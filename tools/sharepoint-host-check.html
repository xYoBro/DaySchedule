<!DOCTYPE html>
<!--
  Synthetic host for the iframe build; this is not a live SharePoint test.
  Build the default srcdoc snippet, paste it at DAYSCHEDULE_EMBED below,
  then open this file. Check host styles, controls and keyboard shortcuts,
  frame dark mode, Create, and removing/reinserting the frame. The frame
  should behave like the standalone app without changing its host.
  Automated equivalents live in tools/test-embed.cjs. Native file-picker
  permissions, print dialogs and tenant policies need manual deployment QA.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SharePoint host-page simulation</title>
<style>
  body { margin: 40px; background: #ffe9c7; font-family: Georgia, serif; }
  h1 { color: darkred; }
  .host-widget-zone { border: 4px dashed limegreen; padding: 12px; }
  .host-footer { margin-top: 40px; padding: 20px; background: #d0e8ff; }
  .toolbar, .app-body { color: darkred; padding: 10px; }
  button { font-family: Georgia, serif; border: 3px solid darkred; }
</style>
</head>
<body>
  <h1>Host Page Title (should stay serif/darkred, unaffected)</h1>
  <p id="host-para">This paragraph belongs to the host page, not the widget.</p>
  <div id="host-toolbar" class="toolbar">Host toolbar must remain visible.</div>
  <div id="host-app" class="app-body">Host app body must remain visible.</div>
  <label for="host-input">Host text field</label>
  <input id="host-input" value="Host controls stay independent">
  <button id="host-button">Host button</button>

  <div class="host-widget-zone">
    <!-- DAYSCHEDULE_EMBED -->
  </div>

  <div class="host-footer">Host page footer &mdash; should still look like this (blue box), not be reset by the widget.</div>
</body>
</html>
