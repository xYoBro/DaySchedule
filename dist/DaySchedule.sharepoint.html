/* ── versions.js ── Contract ───────────────────────────────────────────────
 *
 * EXPORTS:
 *   openVersionPanel()   — async — reads versions from file, renders modal
 *   closeVersionPanel()  — hides version modal
 *
 * REQUIRES:
 *   storage.js  — getVersions(), getRecentActivity(), createVersion(), restoreVersion(), getLastSavedAt()
 *   library.js  — formatTimeAgo()
 *   utils.js    — esc()
 *   ui-core.js  — toast()
 *
 * DOM ELEMENTS:
 *   #versionModal — modal overlay containing version panel
 *
 * CONSUMED BY:
 *   inspector.js — openVersionPanel() (from Versions toolbar button)
 *
 * SIDE EFFECTS:
 *   Registers global click listener to close version modal on backdrop
 *   Registers global keydown listener for Escape → close version modal
 * ──────────────────────────────────────────────────────────────────────────── */

/* ── versions.js ── Version panel UI ───────────────────────────────────────── */

let _versionSaveMode = false;
let _versionOperationPending = false;
let _versionRenderRequest = 0;

async function openVersionPanel() {
  _versionSaveMode = false;
  const overlay = document.getElementById(&#x27;versionModal&#x27;);
  if (!overlay) return;
  const content = overlay.querySelector(&#x27;.modal&#x27;);
  content.innerHTML = &#x27;&lt;h2&gt;Versions&lt;/h2&gt;&lt;p role=&quot;status&quot;&gt;Loading versions…&lt;/p&gt;&lt;button class=&quot;btn&quot; id=&quot;versionLoadingClose&quot;&gt;Close&lt;/button&gt;&#x27;;
  content.querySelector(&#x27;#versionLoadingClose&#x27;).onclick = closeVersionPanel;
  openModal(&#x27;versionModal&#x27;);
  await renderVersionPanel(content);
}

function closeVersionPanel() {
  _versionRenderRequest++;
  closeModal(&#x27;versionModal&#x27;);
}

async function renderVersionPanel(modal) {
  const overlay = document.getElementById(&#x27;versionModal&#x27;);
  if (!overlay || !overlay.classList.contains(&#x27;active&#x27;)) return;
  const request = ++_versionRenderRequest;
  const generation = _workbookGeneration;
  const scheduleId = getScheduleEnvelopeId(getCurrentScheduleFileData());
  const versions = await getVersions();
  const activity = await getRecentActivity();
  if (request !== _versionRenderRequest || generation !== _workbookGeneration
      || scheduleId !== getScheduleEnvelopeId(getCurrentScheduleFileData())) return;
  const editable = typeof isCurrentScheduleEditable === &#x27;function&#x27; ? isCurrentScheduleEditable() : true;
  if (!editable) _versionSaveMode = false;

  let html = &#x27;&lt;h2&gt;Versions&lt;/h2&gt;&#x27;;

  html += &#x27;&lt;div class=&quot;version-working&quot;&gt;&#x27; + esc(getWorkbookSaveStatus()) + &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;p class=&quot;version-storage-note&quot;&gt;Workbook size: about &#x27; + esc(getWorkbookSizeLabel())
    + &#x27;. Versions include appearance and logos; remove unneeded versions to reduce the file size.&lt;/p&gt;&#x27;;

  // Save as version
  if (!editable) {
    html += &#x27;&lt;div class=&quot;version-readonly-note&quot;&gt;Read-only. Click Edit.&lt;/div&gt;&#x27;;
  } else if (_versionSaveMode) {
    html += &#x27;&lt;div class=&quot;version-save-inline&quot;&gt;&#x27;;
    html += &#x27;&lt;input type=&quot;text&quot; class=&quot;version-save-input&quot; id=&quot;versionNameInput&quot; aria-label=&quot;Version name&quot; placeholder=&quot;Version name (e.g., Draft for Review)&quot;&gt;&#x27;;
    html += &#x27;&lt;button class=&quot;btn btn-primary&quot; id=&quot;versionSaveConfirm&quot; style=&quot;font-size:12px;&quot;&gt;Save&lt;/button&gt;&#x27;;
    html += &#x27;&lt;button class=&quot;btn&quot; id=&quot;versionSaveCancel&quot; style=&quot;font-size:12px;&quot;&gt;Cancel&lt;/button&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
  } else {
    html += &#x27;&lt;button class=&quot;version-save-btn&quot; id=&quot;versionSaveBtn&quot;&gt;Save Version\u2026&lt;/button&gt;&#x27;;
  }

  if (activity.length &gt; 0) {
    html += &#x27;&lt;div class=&quot;version-list-label&quot;&gt;Recent&lt;/div&gt;&#x27;;
    activity.forEach(item =&gt; {
      const time = item.at ? new Date(item.at).toLocaleString(undefined, { month: &#x27;short&#x27;, day: &#x27;numeric&#x27;, hour: &#x27;2-digit&#x27;, minute: &#x27;2-digit&#x27; }) : &#x27;&#x27;;
      const by = item.user ? &#x27;by &#x27; + item.user : &#x27;&#x27;;
      html += &#x27;&lt;div class=&quot;version-activity-item&quot;&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;version-activity-name&quot;&gt;&#x27; + esc(item.text) + &#x27;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;version-activity-meta&quot;&gt;&#x27; + esc([time, by].filter(Boolean).join(&#x27; \u00b7 &#x27;)) + &#x27;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;/div&gt;&#x27;;
    });
  }

  // Version list
  if (versions.length &gt; 0) {
    html += &#x27;&lt;div class=&quot;version-list-label&quot;&gt;Saved&lt;/div&gt;&#x27;;
    versions.forEach(v =&gt; {
      const time = v.savedAt ? new Date(v.savedAt).toLocaleString(undefined, { month: &#x27;short&#x27;, day: &#x27;numeric&#x27;, hour: &#x27;2-digit&#x27;, minute: &#x27;2-digit&#x27; }) : &#x27;&#x27;;
      const by = v.savedBy ? &#x27;by &#x27; + v.savedBy : &#x27;&#x27;;
      html += &#x27;&lt;div class=&quot;version-item&quot; data-version-index=&quot;&#x27; + v.index + &#x27;&quot;&gt;&#x27;;
      html += &#x27;&lt;div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;version-item-name&quot;&gt;&#x27; + esc(v.name) + &#x27;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;version-item-meta&quot;&gt;&#x27; + esc([time, by].filter(Boolean).join(&#x27; \u00b7 &#x27;)) + &#x27;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;div class=&quot;version-item-actions&quot;&gt;&lt;button class=&quot;version-restore-btn&quot;&#x27; + (editable ? &#x27;&#x27; : &#x27; disabled&#x27;) + &#x27;&gt;Restore&lt;/button&gt;&#x27;
        + &#x27;&lt;button class=&quot;btn version-rename-btn&quot;&#x27; + (editable ? &#x27;&#x27; : &#x27; disabled&#x27;) + &#x27;&gt;Rename&lt;/button&gt;&#x27;
        + &#x27;&lt;button class=&quot;btn version-delete-btn&quot;&#x27; + (editable ? &#x27;&#x27; : &#x27; disabled&#x27;) + &#x27;&gt;Delete&lt;/button&gt;&lt;/div&gt;&#x27;;
      html += &#x27;&lt;/div&gt;&#x27;;
    });
  } else {
    html += &#x27;&lt;div class=&quot;version-empty&quot;&gt;No saved versions yet.&lt;/div&gt;&#x27;;
  }

  // Close
  html += &#x27;&lt;div class=&quot;modal-actions&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;versionCloseBtn&quot;&gt;Close&lt;/button&gt;&lt;/div&gt;&#x27;;

  const hadFocus = overlay.contains(document.activeElement);
  modal.innerHTML = html;
  wireVersionPanel(modal);
  const heading = modal.querySelector(&#x27;h2&#x27;);
  if (heading) heading.id = &#x27;versionModal-heading&#x27;;
  overlay.setAttribute(&#x27;aria-labelledby&#x27;, &#x27;versionModal-heading&#x27;);
  if (hadFocus &amp;&amp; typeof getActiveModal === &#x27;function&#x27; &amp;&amp; getActiveModal() === overlay) focusModal(overlay);
}

function wireVersionPanel(modal) {
  const editable = typeof isCurrentScheduleEditable === &#x27;function&#x27; ? isCurrentScheduleEditable() : true;
  const closeBtn = modal.querySelector(&#x27;#versionCloseBtn&#x27;);
  if (closeBtn) closeBtn.onclick = () =&gt; closeVersionPanel();

  const saveBtn = modal.querySelector(&#x27;#versionSaveBtn&#x27;);
  if (saveBtn &amp;&amp; editable) {
    saveBtn.onclick = () =&gt; {
      _versionSaveMode = true;
      renderVersionPanel(modal);
    };
  }

  const nameInput = modal.querySelector(&#x27;#versionNameInput&#x27;);
  const confirmBtn = modal.querySelector(&#x27;#versionSaveConfirm&#x27;);
  const cancelBtn = modal.querySelector(&#x27;#versionSaveCancel&#x27;);

  if (nameInput &amp;&amp; editable) {
    setTimeout(() =&gt; {
      if (nameInput.isConnected &amp;&amp; getActiveModal() === document.getElementById(&#x27;versionModal&#x27;)) nameInput.focus();
    }, 50);

    const doSave = async () =&gt; {
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      if (_versionOperationPending) return;
      _versionOperationPending = true;
      confirmBtn.disabled = true;
      let ok;
      try { ok = await createVersion(name); }
      finally { _versionOperationPending = false; confirmBtn.disabled = false; }
      if (ok) {
        if (typeof lastVersionWasWritten === &#x27;function&#x27; &amp;&amp; typeof getCurrentFileName === &#x27;function&#x27;
            &amp;&amp; !getCurrentFileName() &amp;&amp; !lastVersionWasWritten()) {
          toast(&#x27;Version &quot;&#x27; + name + &#x27;&quot; kept in this session — click Save .schedule to write it to the file.&#x27;, 6000);
        } else {
          toast(&#x27;Version saved: &#x27; + name);
        }
        _versionSaveMode = false;
        renderVersionPanel(modal);
      } else {
        toast(&#x27;Couldn’t save the version — the file may be read-only or missing. Use Save .schedule, then try again.&#x27;, 6000);
      }
    };

    if (confirmBtn) confirmBtn.onclick = doSave;
    nameInput.addEventListener(&#x27;keydown&#x27;, e =&gt; {
      if (e.key === &#x27;Enter&#x27;) doSave();
      if (e.key === &#x27;Escape&#x27;) {
        e.preventDefault();
        e.stopPropagation();
        _versionSaveMode = false;
        renderVersionPanel(modal);
      }
    });
  }

  if (cancelBtn) {
    cancelBtn.onclick = () =&gt; {
      _versionSaveMode = false;
      renderVersionPanel(modal);
    };
  }

  if (!editable) return;

  modal.querySelectorAll(&#x27;.version-rename-btn&#x27;).forEach(button =&gt; {
    button.onclick = () =&gt; {
      if (_versionOperationPending) return;
      const row = button.closest(&#x27;.version-item&#x27;);
      const index = Number(row.getAttribute(&#x27;data-version-index&#x27;));
      const title = row.querySelector(&#x27;.version-item-name&#x27;);
      const original = title.textContent;
      title.innerHTML = &#x27;&lt;input class=&quot;version-save-input&quot; aria-label=&quot;New version name&quot; value=&quot;&#x27; + esc(original) + &#x27;&quot;&gt;&#x27;
        + &#x27;&lt;button class=&quot;btn&quot; type=&quot;button&quot;&gt;Save name&lt;/button&gt;&#x27;;
      const input = title.querySelector(&#x27;input&#x27;);
      const save = title.querySelector(&#x27;button&#x27;);
      const rename = async () =&gt; {
        if (_versionOperationPending || !input.value.trim()) return;
        _versionOperationPending = true;
        save.disabled = true;
        try {
          const ok = await renameVersion(index, input.value);
          toast(ok ? &#x27;Version renamed&#x27; : &#x27;Could not rename this version. Your copy is still here.&#x27;);
        } finally {
          _versionOperationPending = false;
          await renderVersionPanel(modal);
        }
      };
      save.onclick = rename;
      input.onkeydown = event =&gt; {
        if (event.key === &#x27;Enter&#x27;) { event.preventDefault(); rename(); }
        if (event.key === &#x27;Escape&#x27;) { event.preventDefault(); event.stopPropagation(); renderVersionPanel(modal); }
      };
      input.focus();
      input.select();
    };
  });
  modal.querySelectorAll(&#x27;.version-delete-btn&#x27;).forEach(button =&gt; {
    button.onclick = async () =&gt; {
      if (_versionOperationPending) return;
      const row = button.closest(&#x27;.version-item&#x27;);
      const name = row.querySelector(&#x27;.version-item-name&#x27;).textContent;
      if (!confirm(&#x27;Delete version &quot;&#x27; + name + &#x27;&quot;? The current schedule will stay unchanged.&#x27;)) return;
      _versionOperationPending = true;
      button.disabled = true;
      try {
        const ok = await deleteVersion(Number(row.getAttribute(&#x27;data-version-index&#x27;)));
        toast(ok ? &#x27;Version deleted&#x27; : &#x27;Could not delete this version.&#x27;);
      } finally {
        _versionOperationPending = false;
        await renderVersionPanel(modal);
      }
    };
  });

  // Restore buttons
  modal.querySelectorAll(&#x27;.version-restore-btn&#x27;).forEach(btn =&gt; {
    btn.addEventListener(&#x27;click&#x27;, async () =&gt; {
      const item = btn.closest(&#x27;.version-item&#x27;);
      const index = parseInt(item.getAttribute(&#x27;data-version-index&#x27;), 10);
      if (_versionOperationPending) return;
      _versionOperationPending = true;
      btn.disabled = true;
      let ok;
      try { ok = await restoreVersion(index); }
      finally { _versionOperationPending = false; btn.disabled = false; }
      if (ok) {
        toast(lastVersionWasWritten() || getCurrentFileName()
          ? &#x27;Version restored — current state backed up&#x27;
          : &#x27;Version restored with a local backup. Save .schedule to write both to the file.&#x27;, 6500);
        closeVersionPanel();
      } else {
        toast(&#x27;Failed to restore version.&#x27;);
      }
    });
  });
}

// Close version modal on backdrop click
document.addEventListener(&#x27;click&#x27;, e =&gt; {
  const overlay = document.getElementById(&#x27;versionModal&#x27;);
  if (overlay &amp;&amp; e.target === overlay) closeVersionPanel();
});

document.addEventListener(&#x27;keydown&#x27;, e =&gt; {
  if (e.key === &#x27;Escape&#x27; &amp;&amp; !e.defaultPrevented) {
    const overlay = document.getElementById(&#x27;versionModal&#x27;);
    if (overlay &amp;&amp; overlay.classList.contains(&#x27;active&#x27;)) closeVersionPanel();
  }
});

/* ── render.js ── Contract ─────────────────────────────────────────────────
 *
 * EXPORTS:
 *   renderDay(dayId)              — renders full schedule page for a day into #scheduleContainer
 *   renderHeader(day)             → HTML string — header with title, date, logo
 *   renderNotes(notes)            → HTML string — notes + dagger footnotes
 *   renderFooter()                → HTML string — footer with contact, POC, print date
 *   formatDateDisplay(dateStr)    → string — &quot;Wednesday, 15 March 2026&quot;
 *   getDaggerFootnotes()          → array — current dagger footnote entries
 *   addDaggerFootnote(fn)         — push an entry onto the dagger footnotes array
 *   clearDaggerFootnotes()        — reset the dagger footnotes array
 *   setCurrentScheduleFileData(data) — sets file-level data for theme access
 *   getCurrentScheduleFileData()  → object|null — current schedule file data
 *
 * REQUIRES:
 *   app-state.js    — Store.getDay(), Store.getDays(), Store.getGroups(), Store.getGroup(),
 *                     Store.getNotes(), Store.getTitle(), Store.getLogo(), Store.getFooter()
 *   utils.js        — esc(), formatDuration(), timeToMinutes()
 *   data-helpers.js — classifyEvents(), computeDuration()
 *   themes.js       — getScheduleTheme(), applyPalette()
 *   print.js        — applyPrintScaling()
 *   skin-band.js    — renderDayBody_band()
 *
 * DOM ELEMENTS:
 *   #scheduleContainer — the page div where schedule HTML is injected
 *
 * CONSUMED BY:
 *   inspector.js  — renderDay() via renderActiveDay()
 *   print.js      — renderHeader(), renderNotes(), renderFooter()
 *   library.js    — setCurrentScheduleFileData() on open/create/return
 *   storage.js    — (indirectly via renderActiveDay)
 * ──────────────────────────────────────────────────────────────────────────── */

// Dagger footnote state (shared with skin files via accessor functions)
let _daggerFootnotes = [];
function getDaggerFootnotes() { return _daggerFootnotes; }
function addDaggerFootnote(fn) { _daggerFootnotes.push(fn); }
function clearDaggerFootnotes() { _daggerFootnotes = []; }

// Skin dispatcher registry
const SKIN_RENDERERS = {
  bands: function(dayId, day, options) { return renderDayBody_band(dayId, day, options); },
  grid:  function(dayId, day) { return typeof renderDayBody_grid   === &#x27;function&#x27; ? renderDayBody_grid(dayId, day)   : &#x27;&#x27;; },
  cards: function(dayId, day) { return typeof renderDayBody_cards  === &#x27;function&#x27; ? renderDayBody_cards(dayId, day)  : &#x27;&#x27;; },
  phases:function(dayId, day) { return typeof renderDayBody_phases === &#x27;function&#x27; ? renderDayBody_phases(dayId, day) : &#x27;&#x27;; },
};

// Shared reference to current schedule file data for theme access.
// Ensures a file data object always exists when the Store has content,
// so the Appearance tab always has something to write theme settings to.
let _currentScheduleFileData = null;
function setCurrentScheduleFileData(data) { _currentScheduleFileData = data; }
function getCurrentScheduleFileData() {
  if (!_currentScheduleFileData &amp;&amp; (Store.getTitle() || Store.getDays().length)) {
    _currentScheduleFileData = {
      name: Store.getTitle(),
      current: Store.getPersistedState(),
      versions: [],
    };
  }
  return _currentScheduleFileData;
}

function renderDay(dayId) {
  const day = Store.getDay(dayId);
  if (!day) return;
  const container = document.getElementById(&#x27;scheduleContainer&#x27;);
  if (!container) return;

  // Apply theme
  const fileData = getCurrentScheduleFileData();
  const theme = getScheduleTheme(fileData &amp;&amp; fileData.theme);
  applyPalette(theme.palette, theme.customColors);

  // Set skin class on page
  const page = container.closest(&#x27;.page&#x27;) || container;
  page.className = &#x27;page skin-&#x27; + theme.skin + (theme.skin === &#x27;bands&#x27; ? &#x27; bands-screen band-page&#x27; : &#x27;&#x27;);

  // Dispatch to skin renderer
  const renderer = SKIN_RENDERERS[theme.skin] || SKIN_RENDERERS.bands;

  let html = &#x27;&#x27;;
  if (theme.skin === &#x27;bands&#x27;) html = BandLayout.page(day, { interactive: true });
  else {
    html += renderHeader(day);
    html += renderer(dayId, day, { interactive: true });
    html += renderFooter();
  }
  container.innerHTML = html;

  if (theme.skin === &#x27;bands&#x27;) {
    removePrintScaling(page);
    const result = BandLayout.fit(container.querySelector(&#x27;.band-sheet&#x27;));
    const notice = document.createElement(&#x27;div&#x27;);
    notice.className = &#x27;band-fit-notice&#x27;; notice.setAttribute(&#x27;role&#x27;, &#x27;status&#x27;);
    if (!result.fits) notice.textContent = &#x27;This day exceeds the readable one-page limits. All content remains here for editing. Reduce or revise the content before printing.&#x27;;
    container.appendChild(notice);
  }
  else applyPrintScaling();
  if (typeof syncPreviewSelection === &#x27;function&#x27;) syncPreviewSelection();
}

function renderHeader(day) {
  const totalDays = Store.getDays().length;
  const dayIndex = Store.getDays().findIndex(d =&gt; d.id === day.id) + 1;
  const dayLabel = day.label || (&#x27;Day &#x27; + dayIndex + &#x27; of &#x27; + totalDays);
  const logo = Store.getLogo();
  const footer = Store.getFooter();
  const dateStr = day.date ? formatDateDisplay(day.date) : &#x27;&#x27;;

  let html = &#x27;&lt;div class=&quot;hdr&quot; role=&quot;button&quot; tabindex=&quot;0&quot; aria-label=&quot;Customize schedule&quot; title=&quot;Customize schedule&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;hdr-text&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;hdr-title&quot;&gt;&#x27; + esc(Store.getTitle()) + &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;hdr-sub&quot;&gt;&#x27; + [dateStr, dayLabel].filter(Boolean).map(esc).join(&#x27; &amp;ensp;\u2014&amp;ensp; &#x27;) + &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;hdr-meta&quot;&gt;&#x27; + esc(footer.contact || &#x27;&#x27;) + &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  if (logo) {
    html += &#x27;&lt;div class=&quot;hdr-logo&quot;&gt;&lt;img src=&quot;&#x27; + esc(logo) + &#x27;&quot; alt=&quot;Unit Logo&quot;&gt;&lt;/div&gt;&#x27;;
  } else {
    html += &#x27;&lt;div class=&quot;hdr-logo&quot;&gt;&lt;span&gt;Unit&lt;br&gt;Logo&lt;/span&gt;&lt;/div&gt;&#x27;;
  }
  html += &#x27;&lt;/div&gt;&#x27;;
  return html;
}

function renderNotes(notes, options) {
  const bands = options &amp;&amp; options.bands;
  let html = &#x27;&lt;div class=&quot;notes&#x27; + (bands ? &#x27; bands-print-section bands-print-wide bands-print-notes&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;notes-label&quot;&gt;Notes&lt;/div&gt;&#x27;;
  html += &#x27;&lt;ul class=&quot;notes-list&#x27; + (bands ? &#x27; bands-print-items&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27;;
  notes.forEach(n =&gt; {
    if (!n.text &amp;&amp; !n.category) {
      // Freshly added, nothing typed yet. Visible on screen so it can be
      // clicked back into; hidden in print (see @media print) and dropped
      // by normalizeNote on the next load.
      html += &#x27;&lt;li data-note-id=&quot;&#x27; + esc(n.id) + &#x27;&quot; class=&quot;note-empty&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;note-select&quot;&gt;&lt;em&gt;Empty note&lt;/em&gt;&lt;/button&gt;&lt;/li&gt;&#x27;;
      return;
    }
    html += &#x27;&lt;li data-note-id=&quot;&#x27; + esc(n.id) + &#x27;&quot;&#x27; + (bands ? &#x27; class=&quot;bands-print-event bands-print-note&quot;&#x27; : &#x27;&#x27;) + &#x27;&gt;&lt;button type=&quot;button&quot; class=&quot;note-select&#x27; + (bands ? &#x27; bands-print-description&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27;;
    if (n.category) html += &#x27;&lt;strong&gt;&#x27; + esc(n.category) + &#x27; \u2014&lt;/strong&gt; &#x27;;
    html += esc(n.text) + &#x27;&lt;/button&gt;&lt;/li&gt;&#x27;;
  });
  html += &#x27;&lt;/ul&gt;&#x27;;
  if (_daggerFootnotes.length &gt; 0) {
    html += &#x27;&lt;ul class=&quot;dagger-list&quot;&gt;&#x27;;
    _daggerFootnotes.forEach((fn, i) =&gt; {
      html += &#x27;&lt;li class=&quot;dagger-note&quot;&gt;&lt;sup&gt;&#x27; + (i + 1) + &#x27;&lt;/sup&gt; &lt;strong&gt;&#x27; + esc(fn.title) + &#x27; (&#x27; + esc(fn.time) + &#x27;) \u2014&lt;/strong&gt; &#x27; + esc(fn.attendees) + &#x27;&lt;/li&gt;&#x27;;
    });
    html += &#x27;&lt;/ul&gt;&#x27;;
  }
  html += &#x27;&lt;/div&gt;&#x27;;
  return html;
}

function renderFooter() {
  const f = Store.getFooter();
  const now = new Date();
  const months = [&#x27;Jan&#x27;,&#x27;Feb&#x27;,&#x27;Mar&#x27;,&#x27;Apr&#x27;,&#x27;May&#x27;,&#x27;Jun&#x27;,&#x27;Jul&#x27;,&#x27;Aug&#x27;,&#x27;Sep&#x27;,&#x27;Oct&#x27;,&#x27;Nov&#x27;,&#x27;Dec&#x27;];
  const printDate = now.getDate() + &#x27; &#x27; + months[now.getMonth()] + &#x27; &#x27; + now.getFullYear();
  const parts = [f.contact, f.poc ? &#x27;Schedule POC: &#x27; + f.poc : &#x27;&#x27;, &#x27;Printed: &#x27; + printDate].filter(Boolean);
  return &#x27;&lt;div class=&quot;footer&quot;&gt;&#x27; + esc(parts.join(&#x27; \u00b7 &#x27;)) + &#x27;&lt;/div&gt;&#x27;;
}

// Until the other layouts receive their own design review, retain newly added
// flight details in their existing event content rather than dropping the data.
function renderFlightDetails(event) {
  if (!event.flightActivities?.length) return &#x27;&#x27;;
  return &#x27;&lt;span class=&quot;flight-details-plain&quot;&gt;&#x27; + event.flightActivities.map(activity =&gt;
    &#x27;&lt;span class=&quot;flight-detail-line&quot;&gt;&lt;strong&gt;&#x27; + esc(activity.flight || &#x27;Unnamed flight&#x27;) + &#x27;&lt;/strong&gt; · &#x27; +
    [activity.startTime + &#x27;-&#x27; + activity.endTime, activity.title, activity.location,
      activity.poc ? &#x27;POC: &#x27; + activity.poc : &#x27;&#x27;, activity.description].filter(Boolean).map(esc).join(&#x27; · &#x27;) + &#x27;&lt;/span&gt;&#x27;).join(&#x27;&#x27;) + &#x27;&lt;/span&gt;&#x27;;
}

function formatDateDisplay(dateStr) {
  const d = new Date(dateStr + &#x27;T00:00:00&#x27;);
  if (isNaN(d.getTime())) return dateStr;
  const days = [&#x27;Sunday&#x27;,&#x27;Monday&#x27;,&#x27;Tuesday&#x27;,&#x27;Wednesday&#x27;,&#x27;Thursday&#x27;,&#x27;Friday&#x27;,&#x27;Saturday&#x27;];
  const months = [&#x27;January&#x27;,&#x27;February&#x27;,&#x27;March&#x27;,&#x27;April&#x27;,&#x27;May&#x27;,&#x27;June&#x27;,&#x27;July&#x27;,&#x27;August&#x27;,&#x27;September&#x27;,&#x27;October&#x27;,&#x27;November&#x27;,&#x27;December&#x27;];
  return days[d.getDay()] + &#x27;, &#x27; + d.getDate() + &#x27; &#x27; + months[d.getMonth()] + &#x27; &#x27; + d.getFullYear();
}

&lt;/script&gt;
  &lt;script&gt;
/* ── workbook-ui.js ── Simple multi-schedule workbook navigation ───────────
 *
 * Keeps the .schedule file mental model small: one workbook file contains many
 * schedules. This layer only owns the switcher UI; persistence.js owns data.
 */

let _workbookSearchText = &#x27;&#x27;;

function formatWorkbookMeta(entry) {
  const parts = [];
  parts.push(entry.dayCount + (entry.dayCount === 1 ? &#x27; day&#x27; : &#x27; days&#x27;));
  parts.push(entry.eventCount + (entry.eventCount === 1 ? &#x27; event&#x27; : &#x27; events&#x27;));
  if (entry.noteCount) parts.push(entry.noteCount + (entry.noteCount === 1 ? &#x27; note&#x27; : &#x27; notes&#x27;));
  return parts.join(&#x27; · &#x27;);
}

function renderWorkbookSwitcher() {
  const btn = document.getElementById(&#x27;workbookSwitchBtn&#x27;);
  const label = document.getElementById(&#x27;workbookSwitchLabel&#x27;);
  if (!btn || !label) return;

  // Legacy directory-library mode: each schedule is its own .json file, and
  // switching/creating here would auto-save the other schedule&#x27;s state into
  // the currently open file. The switcher is workbook-only.
  if (typeof getCurrentFileName === &#x27;function&#x27; &amp;&amp; getCurrentFileName()) {
    btn.hidden = true;
    return;
  }

  if (!Store.getTitle() &amp;&amp; !Store.getDays().length) {
    btn.hidden = true;
    return;
  }

  const entries = typeof getScheduleWorkbookEntries === &#x27;function&#x27; ? getScheduleWorkbookEntries() : [];
  btn.hidden = false;
  label.textContent = entries.length === 1 ? &#x27;1 schedule&#x27; : entries.length + &#x27; schedules&#x27;;
  btn.title = &#x27;Schedules in this workbook&#x27;;
}

function getFilteredWorkbookEntries() {
  const entries = typeof getScheduleWorkbookEntries === &#x27;function&#x27; ? getScheduleWorkbookEntries() : [];
  const query = _workbookSearchText.trim().toLowerCase();
  if (!query) return entries;
  // Names only: matching the hidden ISO timestamp meant any digit, &#x27;t&#x27;, &#x27;z&#x27;,
  // &#x27;-&#x27; or &#x27;:&#x27; matched nearly every schedule.
  return entries.filter(entry =&gt; String(entry.name || &#x27;&#x27;).toLowerCase().includes(query));
}

function renderWorkbookModal() {
  const overlay = document.getElementById(&#x27;workbookModal&#x27;);
  if (!overlay) return;
  const content = overlay.querySelector(&#x27;.modal&#x27;);
  if (!content) return;
  const focusedId = overlay.contains(document.activeElement) ? document.activeElement.id : null;
  const hadFocus = overlay.contains(document.activeElement);

  const entries = typeof getScheduleWorkbookEntries === &#x27;function&#x27; ? getScheduleWorkbookEntries() : [];
  const filtered = getFilteredWorkbookEntries();
  const active = entries.find(entry =&gt; entry.active) || entries[0];
  const defaultName = active &amp;&amp; active.name ? active.name + &#x27; Copy&#x27; : &#x27;New Schedule&#x27;;

  let html = &#x27;&lt;div class=&quot;workbook-head&quot;&gt;&#x27;
    + &#x27;&lt;div&gt;&#x27;
    + &#x27;&lt;h2 id=&quot;workbookModal-heading&quot;&gt;Workbook Schedules&lt;/h2&gt;&#x27;
    + &#x27;&lt;p class=&quot;workbook-desc&quot;&gt;One .schedule file can hold years of drills. Search, open, or create the next one here.&lt;/p&gt;&#x27;
    + &#x27;&lt;/div&gt;&#x27;
    + &#x27;&lt;button class=&quot;modal-close-btn&quot; id=&quot;workbookCloseBtn&quot; aria-label=&quot;Close&quot;&gt;&amp;times;&lt;/button&gt;&#x27;
    + &#x27;&lt;/div&gt;&#x27;
    + &#x27;&lt;div class=&quot;workbook-create&quot;&gt;&#x27;
    + &#x27;&lt;input type=&quot;text&quot; id=&quot;workbookNewName&quot; class=&quot;workbook-new-input&quot; value=&quot;&#x27; + esc(defaultName) + &#x27;&quot; aria-label=&quot;New schedule name&quot;&gt;&#x27;
    + &#x27;&lt;button class=&quot;btn&quot; id=&quot;workbookNewBtn&quot;&gt;New Blank&lt;/button&gt;&#x27;
    + &#x27;&lt;button class=&quot;btn btn-primary&quot; id=&quot;workbookDuplicateBtn&quot;&gt;Duplicate Current&lt;/button&gt;&#x27;
    + &#x27;&lt;/div&gt;&#x27;
    + &#x27;&lt;details class=&quot;workbook-duplicate-options&quot;&gt;&lt;summary&gt;Duplicate onto new dates or clear old details&lt;/summary&gt;&#x27;
    + &#x27;&lt;label&gt;New first date &lt;input type=&quot;date&quot; id=&quot;workbookFirstDate&quot;&gt;&lt;/label&gt;&#x27;
    + &#x27;&lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;workbookClearContacts&quot;&gt; Clear contacts and event POCs&lt;/label&gt;&#x27;
    + &#x27;&lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;workbookClearNotes&quot;&gt; Clear notes&lt;/label&gt;&#x27;
    + &#x27;&lt;label&gt;&lt;input type=&quot;checkbox&quot; id=&quot;workbookClearPeople&quot;&gt; Clear specific people&lt;/label&gt;&#x27;
    + &#x27;&lt;/details&gt;&lt;div id=&quot;workbookDuplicatePreview&quot; class=&quot;workbook-duplicate-preview&quot; hidden&gt;&lt;/div&gt;&#x27;
    + &#x27;&lt;input type=&quot;search&quot; id=&quot;workbookSearch&quot; class=&quot;workbook-search&quot; value=&quot;&#x27; + esc(_workbookSearchText) + &#x27;&quot; placeholder=&quot;Search schedules&quot; aria-label=&quot;Search schedules&quot;&gt;&#x27;
    + &#x27;&lt;div class=&quot;workbook-count&quot;&gt;&#x27; + filtered.length + &#x27; of &#x27; + entries.length + (entries.length === 1 ? &#x27; schedule&#x27; : &#x27; schedules&#x27;) + &#x27;&lt;/div&gt;&#x27;
    + &#x27;&lt;div class=&quot;workbook-list&quot;&gt;&#x27;;

  if (!filtered.length) {
    html += &#x27;&lt;div class=&quot;workbook-empty&quot;&gt;No schedules match that search.&lt;/div&gt;&#x27;;
  } else {
    filtered.forEach(entry =&gt; {
      html += &#x27;&lt;div class=&quot;workbook-item-row&quot;&gt;&lt;button class=&quot;workbook-item&#x27; + (entry.active ? &#x27; active&#x27; : &#x27;&#x27;) + &#x27;&quot; data-schedule-id=&quot;&#x27; + esc(entry.id) + &#x27;&quot;&gt;&#x27;
        + &#x27;&lt;span class=&quot;workbook-item-main&quot;&gt;&#x27;
        + &#x27;&lt;span class=&quot;workbook-item-name&quot;&gt;&#x27; + esc(entry.name) + &#x27;&lt;/span&gt;&#x27;
        + &#x27;&lt;span class=&quot;workbook-item-meta&quot;&gt;&#x27; + esc(formatWorkbookMeta(entry)) + &#x27;&lt;/span&gt;&#x27;
        + &#x27;&lt;/span&gt;&#x27;
        + (entry.active ? &#x27;&lt;span class=&quot;workbook-active-badge&quot;&gt;Open&lt;/span&gt;&#x27; : &#x27;&#x27;)
        + &#x27;&lt;/button&gt;&lt;button class=&quot;btn&quot; data-archive-schedule=&quot;&#x27; + esc(entry.id) + &#x27;&quot; aria-label=&quot;Archive &#x27; + esc(entry.name) + &#x27;&quot;&#x27;
        + (entries.length &lt; 2 ? &#x27; disabled title=&quot;Keep at least one schedule&quot;&#x27; : &#x27;&#x27;) + &#x27;&gt;Archive&lt;/button&gt;&lt;/div&gt;&#x27;;
    });
  }

  html += &#x27;&lt;/div&gt;&#x27;;
  const archived = getArchivedWorkbookSchedules();
  if (archived.length) {
    html += &#x27;&lt;details class=&quot;workbook-archive-list&quot;&gt;&lt;summary&gt;Archived schedules (&#x27; + archived.length + &#x27;)&lt;/summary&gt;&#x27;;
    archived.forEach(item =&gt; {
      html += &#x27;&lt;div class=&quot;workbook-item-row&quot;&gt;&lt;span&gt;&#x27; + esc(item.name) + &#x27;&lt;/span&gt;&lt;button class=&quot;btn&quot; data-restore-schedule=&quot;&#x27; + item.index + &#x27;&quot;&gt;Restore&lt;/button&gt;&lt;/div&gt;&#x27;;
    });
    html += &#x27;&lt;/details&gt;&#x27;;
  }
  content.className = &#x27;modal workbook-modal&#x27;;
  content.innerHTML = html;
  if (hadFocus &amp;&amp; getActiveModal() === overlay) {
    const replacement = focusedId &amp;&amp; document.getElementById(focusedId);
    (replacement || content.querySelector(&#x27;#workbookSearch&#x27;)).focus();
  }

  const search = content.querySelector(&#x27;#workbookSearch&#x27;);
  if (search) {
    search.addEventListener(&#x27;input&#x27;, () =&gt; {
      _workbookSearchText = search.value;
      // The re-render replaces this input; restore the caret where it was,
      // not at the end, so editing mid-word doesn&#x27;t jump.
      const caretStart = search.selectionStart;
      const caretEnd = search.selectionEnd;
      renderWorkbookModal();
      const nextSearch = document.getElementById(&#x27;workbookSearch&#x27;);
      if (nextSearch) {
        nextSearch.focus();
        const len = nextSearch.value.length;
        nextSearch.setSelectionRange(Math.min(caretStart, len), Math.min(caretEnd, len));
      }
    });
  }

  const closeBtn = content.querySelector(&#x27;#workbookCloseBtn&#x27;);
  if (closeBtn) closeBtn.onclick = closeWorkbookModal;

  const newBtn = content.querySelector(&#x27;#workbookNewBtn&#x27;);
  if (newBtn) {
    newBtn.onclick = () =&gt; {
      const input = document.getElementById(&#x27;workbookNewName&#x27;);
      const typed = input ? input.value.trim() : &#x27;&#x27;;
      // The shared name box is prefilled with &quot;&lt;Active&gt; Copy&quot; for Duplicate;
      // an untouched box must not name a blank schedule after the active one.
      const name = typed &amp;&amp; typed !== defaultName ? typed : &#x27;New Schedule&#x27;;
      if (typeof createScheduleInWorkbook === &#x27;function&#x27;) createScheduleInWorkbook(name, { duplicate: false });
      closeWorkbookModal();
    };
  }

  const duplicateBtn = content.querySelector(&#x27;#workbookDuplicateBtn&#x27;);
  if (duplicateBtn) {
    duplicateBtn.onclick = () =&gt; {
      const input = content.querySelector(&#x27;#workbookNewName&#x27;);
      const name = input &amp;&amp; input.value.trim() ? input.value.trim() : defaultName;
      const options = {
        duplicate: true,
        firstDate: content.querySelector(&#x27;#workbookFirstDate&#x27;).value,
        clearContacts: content.querySelector(&#x27;#workbookClearContacts&#x27;).checked,
        clearNotes: content.querySelector(&#x27;#workbookClearNotes&#x27;).checked,
        clearPeople: content.querySelector(&#x27;#workbookClearPeople&#x27;).checked,
      };
      if (!options.firstDate &amp;&amp; !options.clearContacts &amp;&amp; !options.clearNotes &amp;&amp; !options.clearPeople) {
        createScheduleInWorkbook(name, options);
        closeWorkbookModal();
        return;
      }
      const preview = content.querySelector(&#x27;#workbookDuplicatePreview&#x27;);
      try {
        const plan = previewWorkbookDuplicate(name, options);
        preview.innerHTML = &#x27;&lt;h3&gt;Review &#x27; + esc(plan.name) + &#x27;&lt;/h3&gt;&lt;ul&gt;&#x27;
          + plan.days.map(day =&gt; &#x27;&lt;li&gt;&#x27; + esc(day.from || &#x27;No date&#x27;) + &#x27; → &#x27; + esc(day.to || &#x27;No date&#x27;) + &#x27;&lt;/li&gt;&#x27;).join(&#x27;&#x27;)
          + &#x27;&lt;/ul&gt;&lt;p&gt;&#x27; + esc([
            options.clearContacts ? &#x27;Contacts and POCs will be cleared.&#x27; : &#x27;&#x27;,
            options.clearNotes ? &#x27;Notes will be cleared.&#x27; : &#x27;&#x27;,
            options.clearPeople ? &#x27;Specific people will be cleared.&#x27; : &#x27;&#x27;,
          ].filter(Boolean).join(&#x27; &#x27;)) + &#x27;&lt;/p&gt;&#x27;
          + &#x27;&lt;div class=&quot;modal-actions&quot;&gt;&lt;button class=&quot;btn&quot; id=&quot;workbookCancelDuplicate&quot;&gt;Cancel&lt;/button&gt;&#x27;
          + &#x27;&lt;button class=&quot;btn btn-primary&quot; id=&quot;workbookConfirmDuplicate&quot;&gt;Create Copy&lt;/button&gt;&lt;/div&gt;&#x27;;
        preview.hidden = false;
        preview.querySelector(&#x27;#workbookCancelDuplicate&#x27;).onclick = () =&gt; { preview.hidden = true; duplicateBtn.focus(); };
        preview.querySelector(&#x27;#workbookConfirmDuplicate&#x27;).onclick = () =&gt; {
          createScheduleInWorkbook(name, options);
          closeWorkbookModal();
        };
        preview.querySelector(&#x27;#workbookConfirmDuplicate&#x27;).focus();
      } catch (err) {
        toast(err.message, 6500);
      }
    };
  }

  content.querySelectorAll(&#x27;[data-archive-schedule]&#x27;).forEach(button =&gt; {
    button.onclick = () =&gt; {
      if (archiveWorkbookSchedule(button.getAttribute(&#x27;data-archive-schedule&#x27;))) renderWorkbookModal();
    };
  });
  content.querySelectorAll(&#x27;[data-restore-schedule]&#x27;).forEach(button =&gt; {
    button.onclick = () =&gt; {
      if (restoreArchivedWorkbookSchedule(Number(button.getAttribute(&#x27;data-restore-schedule&#x27;)))) renderWorkbookModal();
    };
  });

  content.querySelectorAll(&#x27;.workbook-item&#x27;).forEach(item =&gt; {
    item.addEventListener(&#x27;click&#x27;, () =&gt; {
      const id = item.getAttribute(&#x27;data-schedule-id&#x27;);
      if (typeof switchScheduleInWorkbook === &#x27;function&#x27;) switchScheduleInWorkbook(id);
      closeWorkbookModal();
    });
  });
}

function openWorkbookModal() {
  // Same guard as renderWorkbookSwitcher — never expose workbook switching
  // while a directory-library file is open.
  if (typeof getCurrentFileName === &#x27;function&#x27; &amp;&amp; getCurrentFileName()) return;
  const overlay = document.getElementById(&#x27;workbookModal&#x27;);
  if (!overlay) return;
  renderWorkbookModal();
  openModal(&#x27;workbookModal&#x27;);
  const search = document.getElementById(&#x27;workbookSearch&#x27;);
  if (search) setTimeout(() =&gt; {
    if (search.isConnected &amp;&amp; getActiveModal() === overlay) search.focus();
  }, 0);
}

function closeWorkbookModal() {
  const overlay = document.getElementById(&#x27;workbookModal&#x27;);
  if (overlay) closeModal(&#x27;workbookModal&#x27;);
}

function wireWorkbookUi() {
  const btn = document.getElementById(&#x27;workbookSwitchBtn&#x27;);
  if (btn) btn.onclick = openWorkbookModal;

  const overlay = document.getElementById(&#x27;workbookModal&#x27;);
  if (overlay) {
    overlay.addEventListener(&#x27;click&#x27;, (e) =&gt; {
      if (e.target === overlay) closeWorkbookModal();
    });
  }
  renderWorkbookSwitcher();
}

  &lt;script&gt;
/* ── print.js ── Contract ──────────────────────────────────────────────────
 *
 * EXPORTS:
 *   openPrintReview()             — choose days, audience, detail and page layout
 *   printSchedule(options)        — builds and prints an isolated handout
 *   getPrintDays(options)         — copies selected/filtered data without changing Store
 *   printActiveDay()              — prints the currently active day
 *   printAllDays()                — builds all days into hidden container, prints
 *   applyPrintScaling(forPrint)   — 3-stage adaptive CSS compression + zoom fallback
 *   applyPrintScalingToPage(page, forPrint) — scales a single .page element
 *   removePrintScaling(page)      — removes all scaling CSS vars and zoom
 *
 * REQUIRES:
 *   app-state.js    — Store.getActiveDay(), Store.getDays(), Store.getGroups(), Store.getNotes()
 *   ui-core.js      — toast(), openModal(), closeModal()
 *   render.js       — renderDay(), renderHeader(), SKIN_RENDERERS, renderFooter()
 *   data-helpers.js — getAudienceHandoutEvents(), getScheduleReviewIssues()
 *   constants.js    — LAYOUT_TARGETS
 *
 * CONSUMED BY:
 *   render.js    — applyPrintScaling() (called after renderDay)
 *   events.js    — openPrintReview() (Ctrl+P and toolbar button)
 *
 * SIDE EFFECTS:
 *   Registers beforeprint listener → prepares fresh full readable output unless
 *     an explicit app print request has selected other options
 *   Registers afterprint listener → clears output and re-renders active day
 *   Creates/reuses #printContainer element on document.body
 * ──────────────────────────────────────────────────────────────────────────── */

let _printDocumentTitle = null;
let _printJob = null;

function normalizePrintOptions(options) {
  const opts = options || {};
  const knownDays = Store.getDays().map(day =&gt; day.id);
  const requestedDays = Array.isArray(opts.dayIds) ? opts.dayIds : knownDays;
  return {
    dayIds: knownDays.filter(id =&gt; requestedDays.includes(id)),
    audienceId: Store.getGroup(opts.audienceId) ? opts.audienceId : &#x27;&#x27;,
    detail: opts.detail === &#x27;overview&#x27; ? &#x27;overview&#x27; : &#x27;full&#x27;,
    mode: getScheduleTheme(getCurrentScheduleFileData()?.theme).skin === &#x27;bands&#x27; || opts.mode === &#x27;fit&#x27; ? &#x27;fit&#x27; : &#x27;readable&#x27;,
  };
}

function getPrintDays(options) {
  const opts = normalizePrintOptions(options);
  return Store.getDays().filter(day =&gt; opts.dayIds.includes(day.id)).map(day =&gt; ({
    ...day,
    events: getAudienceHandoutEvents(day.events, Store.getGroups(), opts.audienceId)
      .map(evt =&gt; opts.detail === &#x27;overview&#x27; ? { ...evt, description: &#x27;&#x27; } : { ...evt }),
    notes: (day.notes || []).map(note =&gt; ({ ...note })),
  }));
}

function buildPrintMarkup(options) {
  const opts = normalizePrintOptions(options);
  const theme = getScheduleTheme(getCurrentScheduleFileData() &amp;&amp; getCurrentScheduleFileData().theme);
  const renderer = SKIN_RENDERERS[theme.skin] || SKIN_RENDERERS.bands;
  const audience = Store.getGroup(opts.audienceId);
  return getPrintDays(opts).map(day =&gt; {
    if (theme.skin === &#x27;bands&#x27;) {
      const handout = [audience ? &#x27;Audience: &#x27; + audience.name + &#x27;. Primary audience events and breaks included.&#x27; : &#x27;&#x27;,
        opts.detail === &#x27;overview&#x27; ? &#x27;Overview: event notes omitted.&#x27; : &#x27;&#x27;, audience || opts.detail === &#x27;overview&#x27; ? &#x27;Day notes included.&#x27; : &#x27;&#x27;].filter(Boolean).join(&#x27; &#x27;);
      return &#x27;&lt;div class=&quot;page print-page skin-bands band-page print-fit&quot; data-print-mode=&quot;fit&quot; data-print-day=&quot;&#x27; + esc(day.id) + &#x27;&quot;&gt;&#x27; + BandLayout.page(day, { handout }) + &#x27;&lt;/div&gt;&#x27;;
    }
    let html = &#x27;&lt;div class=&quot;page print-page skin-&#x27; + esc(theme.skin) + &#x27; print-&#x27; + opts.mode + &#x27;&quot; data-print-mode=&quot;&#x27; + opts.mode + &#x27;&quot; data-print-day=&quot;&#x27; + esc(day.id) + &#x27;&quot;&gt;&#x27;;
    html += renderHeader(day);
    if (audience || opts.detail === &#x27;overview&#x27;) {
      html += &#x27;&lt;div class=&quot;print-handout-label&quot;&gt;&#x27; + esc(audience ? &#x27;Audience: &#x27; + audience.name + &#x27; · Primary audience events and breaks included. &#x27; : &#x27;&#x27;);
      if (opts.detail === &#x27;overview&#x27;) html += &#x27;Overview · Event notes omitted. &#x27;;
      html += &#x27;Day notes included.&lt;/div&gt;&#x27;;
    }
    html += renderer(day.id, day, { printMode: opts.mode });
    html += renderFooter() + &#x27;&lt;/div&gt;&#x27;;
    return html;
  }).join(&#x27;&#x27;);
}

function layoutPrintPages(container) {
  // Bands owns its page boundaries. Measurement and both print entry points
  // use that same renderer after insertion at the printable width.
  container.querySelectorAll(&#x27;.print-page&#x27;).forEach(page =&gt; {
    const sheet = page.querySelector(&#x27;.band-sheet&#x27;);
    if (sheet) { BandLayout.fit(sheet); page.dataset.printPaginated = &#x27;true&#x27;; }
    else applyPrintScalingToPage(page, true);
  });
}

function preparePrintPages(container, options) {
  container.innerHTML = buildPrintMarkup(options);
  layoutPrintPages(container);
}

function measurePrintPlan(options) {
  const opts = normalizePrintOptions(options);
  const container = document.createElement(&#x27;div&#x27;);
  container.className = &#x27;print-measurement&#x27;;
  container.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
  container.inert = true;
  document.body.appendChild(container);
  try {
    preparePrintPages(container, opts);
    const days = new Map();
    container.querySelectorAll(&#x27;.print-page&#x27;).forEach(page =&gt; {
      const scale = parseFloat(page.style.zoom || &#x27;1&#x27;);
      const textSizes = Array.from(page.querySelectorAll(&#x27;*&#x27;)).filter(el =&gt;
        !el.closest(&#x27;.band-view-note, .note-empty, .hdr-logo, sup&#x27;) &amp;&amp;
        Array.from(el.childNodes).some(node =&gt; node.nodeType === 3 &amp;&amp; node.textContent.trim()) &amp;&amp;
        el.getClientRects().length &amp;&amp; getComputedStyle(el).display !== &#x27;none&#x27;
      ).map(el =&gt; parseFloat(getComputedStyle(el).fontSize)).filter(Number.isFinite);
      const height = page.getBoundingClientRect().height;
      const metrics = {
        dayId: page.dataset.printDay,
        scale,
        estimatedPages: opts.mode === &#x27;fit&#x27; || (page.dataset.printPaginated === &#x27;true&#x27; &amp;&amp; !page.classList.contains(&#x27;bands-print-natural&#x27;))
          ? 1 : Math.max(1, Math.ceil(height / ((10.32 * 96) - 48))),
        smallestTextPt: (textSizes.length ? Math.min(...textSizes) : 12) * scale * 0.75,
        fits: !page.querySelector(&#x27;.band-sheet[data-fit=&quot;false&quot;]&#x27;),
      };
      const day = days.get(metrics.dayId);
      if (day) {
        day.estimatedPages += metrics.estimatedPages;
        day.scale = Math.min(day.scale, metrics.scale);
        day.smallestTextPt = Math.min(day.smallestTextPt, metrics.smallestTextPt);
      } else {
        days.set(metrics.dayId, metrics);
      }
    });
    return Array.from(days.values());
  } finally {
    container.remove();
  }
}

function openPrintReview() {
  const days = Store.getDays();
  if (!days.length) { toast(&#x27;No days to print.&#x27;); return; }
  let overlay = document.getElementById(&#x27;printReviewModal&#x27;);
  if (!overlay) {
    overlay = document.createElement(&#x27;div&#x27;);
    overlay.id = &#x27;printReviewModal&#x27;;
    overlay.className = &#x27;modal-overlay&#x27;;
    overlay.innerHTML = &#x27;&lt;div class=&quot;modal print-review-modal&quot;&gt;&lt;/div&gt;&#x27;;
    document.body.appendChild(overlay);
  }
  const modal = overlay.querySelector(&#x27;.modal&#x27;);
  const banded = getScheduleTheme(getCurrentScheduleFileData()?.theme).skin === &#x27;bands&#x27;;
  let html = &#x27;&lt;h2 id=&quot;printReviewTitle&quot;&gt;Review and print&lt;/h2&gt;&#x27;;
  html += &#x27;&lt;fieldset class=&quot;print-review-days&quot;&gt;&lt;legend&gt;Days to print&lt;/legend&gt;&#x27;;
  days.forEach((day, index) =&gt; {
    const label = day.label || day.date || (&#x27;Day &#x27; + (index + 1));
    html += &#x27;&lt;label&gt;&lt;input type=&quot;checkbox&quot; name=&quot;printDay&quot; value=&quot;&#x27; + esc(day.id) + &#x27;&quot; checked&gt; &#x27; + esc(label) + &#x27;&lt;/label&gt;&#x27;;
  });
  html += &#x27;&lt;/fieldset&gt;&lt;div class=&quot;print-review-fields&quot;&gt;&#x27;;
  html += &#x27;&lt;label for=&quot;printAudience&quot;&gt;Audience&lt;/label&gt;&lt;select id=&quot;printAudience&quot;&gt;&lt;option value=&quot;&quot;&gt;Everyone&lt;/option&gt;&#x27;;
  Store.getGroups().forEach(group =&gt; { html += &#x27;&lt;option value=&quot;&#x27; + esc(group.id) + &#x27;&quot;&gt;&#x27; + esc(group.name) + &#x27;&lt;/option&gt;&#x27;; });
  html += &#x27;&lt;/select&gt;&lt;p class=&quot;print-review-hint&quot;&gt;An audience handout includes primary audience events and breaks. Review named exceptions and day notes before sharing.&lt;/p&gt;&#x27;;
  html += &#x27;&lt;label for=&quot;printDetail&quot;&gt;Details&lt;/label&gt;&lt;select id=&quot;printDetail&quot;&gt;&lt;option value=&quot;full&quot;&gt;Full details&lt;/option&gt;&lt;option value=&quot;overview&quot;&gt;Overview — omit event notes&lt;/option&gt;&lt;/select&gt;&#x27;;
  html += &#x27;&lt;label for=&quot;printMode&quot;&gt;Page layout&lt;/label&gt;&lt;select id=&quot;printMode&quot;&gt;&#x27; + (banded
    ? &#x27;&lt;option value=&quot;fit&quot;&gt;Letter portrait — one day per page&lt;/option&gt;&#x27;
    : &#x27;&lt;option value=&quot;readable&quot;&gt;Readable pages — allow more than one page per day&lt;/option&gt;&lt;option value=&quot;fit&quot;&gt;Fit each day on one page — may make text small&lt;/option&gt;&#x27;) + &#x27;&lt;/select&gt;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div id=&quot;printReviewSummary&quot; role=&quot;status&quot; aria-live=&quot;polite&quot;&gt;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;details class=&quot;print-review-checks&quot;&gt;&lt;summary id=&quot;printReviewCheckCount&quot;&gt;Schedule checks&lt;/summary&gt;&lt;ul id=&quot;printReviewIssues&quot;&gt;&lt;/ul&gt;&lt;/details&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;modal-actions&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;btn&quot; id=&quot;printReviewCancel&quot;&gt;Cancel&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; id=&quot;printReviewConfirm&quot;&gt;Print&lt;/button&gt;&lt;/div&gt;&#x27;;
  modal.innerHTML = html;
  const readOptions = () =&gt; normalizePrintOptions({
    dayIds: Array.from(modal.querySelectorAll(&#x27;[name=&quot;printDay&quot;]:checked&#x27;)).map(input =&gt; input.value),
    audienceId: modal.querySelector(&#x27;#printAudience&#x27;).value,
    detail: modal.querySelector(&#x27;#printDetail&#x27;).value,
    mode: modal.querySelector(&#x27;#printMode&#x27;).value,
  });
  const refresh = () =&gt; {
    const opts = readOptions();
    const fullDays = getPrintDays({ ...opts, detail: &#x27;full&#x27; });
    const events = fullDays.flatMap(day =&gt; day.events);
    const omitted = opts.detail === &#x27;overview&#x27; ? events.filter(evt =&gt; evt.description).length : 0;
    const metrics = measurePrintPlan(opts);
    const sheets = metrics.reduce((sum, page) =&gt; sum + page.estimatedPages, 0);
    const small = metrics.filter(page =&gt; page.smallestTextPt &lt; (opts.mode === &#x27;fit&#x27; ? 12 : 8));
    let summary = &#x27;&lt;p&gt;&#x27; + opts.dayIds.length + &#x27; day(s), &#x27; + events.length + &#x27; event(s). Estimated &#x27; + sheets + &#x27; printed page(s).&lt;/p&gt;&#x27;;
    if (omitted) summary += &#x27;&lt;p&gt;&#x27; + omitted + &#x27; event note(s) will be omitted from this overview.&lt;/p&gt;&#x27;;
    if (banded) {
      summary += &#x27;&lt;p&gt;Half-inch margins, a reserved notes area and bounded text sizes. Print at actual size on US Letter; duplex can put the next day on the reverse.&lt;/p&gt;&#x27;;
      if (metrics.some(page =&gt; !page.fits)) summary += &#x27;&lt;p class=&quot;print-review-warning&quot;&gt;A selected day exceeds the readable one-page limits. Review its content before printing; no names or event details will be clipped to make it fit.&lt;/p&gt;&#x27;;
    } else if (small.length) {
      summary += &#x27;&lt;p class=&quot;print-review-warning&quot;&gt;Text may be as small as &#x27; + Math.min(...small.map(page =&gt; page.smallestTextPt)).toFixed(1) + &#x27; pt. &#x27;;
      summary += opts.mode === &#x27;fit&#x27;
        ? &#x27;Fit keeps each day on one page and may reduce text below 12 pt. Choose Readable pages for larger type.&lt;/p&gt;&#x27;
        : &#x27;Text below 8 pt can be hard to read; choose Readable pages or print fewer audiences.&lt;/p&gt;&#x27;;
    }
    summary += &#x27;&lt;p class=&quot;print-review-hint&quot;&gt;Check your browser’s print preview before sharing. Paper and printer settings can change pagination.&lt;/p&gt;&#x27;;
    modal.querySelector(&#x27;#printReviewSummary&#x27;).innerHTML = summary;
    const issues = getScheduleReviewIssues(fullDays, Store.getGroups());
    modal.querySelector(&#x27;#printReviewCheckCount&#x27;).textContent = issues.length ? issues.length + &#x27; schedule check(s) to review&#x27; : &#x27;No schedule checks flagged&#x27;;
    modal.querySelector(&#x27;#printReviewIssues&#x27;).innerHTML = issues.map(issue =&gt; &#x27;&lt;li&gt;&#x27; + esc(issue.message) + &#x27;&lt;/li&gt;&#x27;).join(&#x27;&#x27;);
    modal.querySelector(&#x27;#printReviewConfirm&#x27;).disabled = opts.dayIds.length === 0 || metrics.some(page =&gt; page.fits === false);
  };
  modal.querySelectorAll(&#x27;input, select&#x27;).forEach(input =&gt; input.addEventListener(&#x27;change&#x27;, refresh));
  modal.querySelector(&#x27;#printReviewCancel&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; closeModal(&#x27;printReviewModal&#x27;));
  modal.querySelector(&#x27;#printReviewConfirm&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; {
    const options = readOptions();
    closeModal(&#x27;printReviewModal&#x27;);
    printSchedule(options);
  });
  refresh();
  openModal(&#x27;printReviewModal&#x27;);
}

function printActiveDay() {
  const dayId = Store.getActiveDay();
  if (!dayId) { toast(&#x27;No day selected.&#x27;); return; }
  printSchedule({ dayIds: [dayId], mode: &#x27;fit&#x27; });
}

function printAllDays() {
  printSchedule({ mode: &#x27;fit&#x27; });
}

function createPrintJob(options, source) {
  let container = document.getElementById(&#x27;printContainer&#x27;);
  if (!container) {
    container = document.createElement(&#x27;div&#x27;);
    container.id = &#x27;printContainer&#x27;;
    document.body.appendChild(container);
  }
  container.className = &#x27;print-staging&#x27;;
  container.inert = true;
  container.setAttribute(&#x27;aria-hidden&#x27;, &#x27;true&#x27;);
  document.body.classList.add(&#x27;printing-schedule&#x27;);
  if (_printDocumentTitle === null) _printDocumentTitle = document.title;
  const job = { options, source, container, fileData: getCurrentScheduleFileData(), started: false };
  _printJob = job;
  updatePrintDocumentTitle(options);
  return job;
}

function updatePrintDocumentTitle(options) {
  const audience = Store.getGroup(options.audienceId);
  document.title = [Store.getTitle(), audience ? audience.name : &#x27;Everyone&#x27;,
    options.detail === &#x27;overview&#x27; ? &#x27;Overview&#x27; : &#x27;Full details&#x27;, options.dayIds.length + &#x27; day(s)&#x27;].join(&#x27; — &#x27;);
}

function clearPrintJob() {
  _printJob = null;
  const container = document.getElementById(&#x27;printContainer&#x27;);
  if (container) { container.innerHTML = &#x27;&#x27;; container.className = &#x27;&#x27;; }
  document.body.classList.remove(&#x27;printing-schedule&#x27;);
  if (_printDocumentTitle !== null) { document.title = _printDocumentTitle; _printDocumentTitle = null; }
}

function reportPrintFailure(err) {
  clearPrintJob();
  if (typeof logAppError === &#x27;function&#x27;) logAppError(&#x27;error&#x27;, String(err &amp;&amp; err.message || err), &#x27;print&#x27;);
  toast(&#x27;Couldn’t open the print dialog. Try your browser’s File → Print.&#x27;, 6000);
}

function printSchedule(options) {
  const opts = normalizePrintOptions(options);
  if (!opts.dayIds.length) { clearPrintJob(); toast(&#x27;No days to print.&#x27;); return; }
  const job = createPrintJob(opts, &#x27;app&#x27;);
  let content;
  try {
    job.container.innerHTML = buildPrintMarkup(opts);
    content = JSON.stringify({ state: Store.getPersistedState(), theme: job.fileData &amp;&amp; job.fileData.theme });
  } catch (err) {
    reportPrintFailure(err);
    return;
  }
  // Logos are local data URLs, but decoding is asynchronous. Wait for them
  // before measuring rather than assuming a fixed timeout is long enough.
  const images = Array.from(job.container.querySelectorAll(&#x27;img&#x27;));
  return Promise.all(images.map(img =&gt; typeof img.decode === &#x27;function&#x27; ? img.decode().catch(err =&gt; {
    if (_printJob !== job || job.started) return;
    if (typeof logAppError === &#x27;function&#x27;) logAppError(&#x27;warn&#x27;, String(err &amp;&amp; err.message || err), &#x27;print logo&#x27;);
    toast(&#x27;The logo could not be read and may be missing from the printout.&#x27;, 6000);
  }) : Promise.resolve()))
    .then(() =&gt; {
      // A completed decode must not reopen a closed print preview, print a
      // superseded request, or print an old schedule after navigation/editing.
      if (_printJob !== job || job.started) return;
      const fileData = getCurrentScheduleFileData();
      if (!job.container.isConnected || fileData !== job.fileData ||
          content !== JSON.stringify({ state: Store.getPersistedState(), theme: fileData &amp;&amp; fileData.theme })) {
        clearPrintJob();
        toast(&#x27;The schedule changed while preparing print. Review and print again.&#x27;, 6000);
        return;
      }
      try {
        layoutPrintPages(job.container);
        if (job.container.querySelector(&#x27;.band-sheet[data-fit=&quot;false&quot;]&#x27;)) {
          clearPrintJob();
          toast(&#x27;A day exceeds the readable one-page limits. Review the schedule before printing.&#x27;, 6000);
          return;
        }
        job.started = true;
        window.print();
      } catch (err) {
        if (_printJob === job) reportPrintFailure(err);
      }
    });
}

// ── Print Scaling ──────────────────────────────────────────────────────────
// Three-stage bottom-up CSS compression, then zoom fallback (print only —
// on screen the page grows taller instead of zooming below readability).
// Measures at print width (8.2in) for accurate overflow detection.
// Uses zoom (not transform:scale) because zoom affects actual layout flow —
// the print engine sees the zoomed dimensions for pagination. transform:scale
// is purely visual and does not change layout height, causing page overflow.

function applyPrintScaling(forPrint) {
  const pages = forPrint
    ? document.querySelectorAll(&#x27;.print-page&#x27;)
    : document.querySelectorAll(&#x27;.page:not(.print-page)&#x27;);
  if (pages.length) {
    pages.forEach(p =&gt; applyPrintScalingToPage(p, forPrint));
  } else {
    const page = document.querySelector(&#x27;.page&#x27;);
    if (page) applyPrintScalingToPage(page, forPrint);
  }
}

function applyPrintScalingToPage(page, forPrint) {
  const bandSheet = page.querySelector(&#x27;.band-sheet&#x27;);
  if (bandSheet) { removePrintScaling(page); BandLayout.fit(bandSheet); return; }
  // For print: usable area = 11in - 0.3in @page margins - 0.38in padding,
  // minus 48px safety margin for browser rendering differences.
  // For screen: match the .page card&#x27;s min-height (11in = 1056px).
  // scrollHeight includes padding (border-box), so no subtraction needed.
  const maxH = forPrint
    ? (10.32 * 96) - 48   // print: ~943px
    : (11 * 96) - 10;      // screen: 1046px (page card minus small buffer)

  // Reset any previous scaling
  removePrintScaling(page);
  if (forPrint &amp;&amp; page.dataset.printMode === &#x27;readable&#x27;) return;

  // For print: force print-width measurement (8.2in) since screen preview
  // may be narrower. For screen preview: measure at actual rendered width
  // so scaling matches what the user sees.
  const origWidth = page.style.width;
  const origMinH = page.style.minHeight;
  const origMaxH = page.style.maxHeight;
  const origOverflow = page.style.overflow;
  if (forPrint) page.style.width = &#x27;8.2in&#x27;;
  page.style.minHeight = &#x27;0&#x27;;
  page.style.maxHeight = &#x27;none&#x27;;
  page.style.overflow = &#x27;visible&#x27;;

  // For print: force footer to 5px margin during measurement — screen mode
  // uses margin-top:auto which absorbs flex space and masks true content height.
  // For screen preview: leave auto margin alone so footer stays at page bottom.
  const footer = page.querySelector(&#x27;.footer&#x27;);
  const origFooterMargin = footer ? footer.style.marginTop : &#x27;&#x27;;
  if (forPrint &amp;&amp; footer) footer.style.marginTop = &#x27;5px&#x27;;

  let contentH = page.scrollHeight;

  if (contentH &lt;= maxH) {
    page.style.width = origWidth;
    page.style.minHeight = origMinH;
    page.style.maxHeight = origMaxH;
    page.style.overflow = origOverflow;
    if (footer) footer.style.marginTop = origFooterMargin;
    return;
  }

  // Three-stage bottom-up compression: compress lowest-priority content first,
  // only touching primary band content as a last resort.
  const lerp = (range, f) =&gt; range[1] + (range[0] - range[1]) * f;
  const T = LAYOUT_TARGETS;

  // Stage 1: Notes, footer, concurrent detail fonts
  const s1Need = contentH - maxH;
  const s1Factor = Math.max(0, Math.min(1, 1 - (s1Need / (maxH * 0.15))));
  page.style.setProperty(&#x27;--notes-fs&#x27;, lerp(T.notes.fs, s1Factor) + &#x27;px&#x27;);
  page.style.setProperty(&#x27;--notes-lh&#x27;, lerp(T.notes.lineH, s1Factor));
  page.style.setProperty(&#x27;--conc-detail-fs&#x27;, lerp(T.conc.detailFs, s1Factor) + &#x27;px&#x27;);
  page.style.setProperty(&#x27;--conc-time-fs&#x27;, lerp(T.conc.timeFs, s1Factor) + &#x27;px&#x27;);
  page.style.setProperty(&#x27;--conc-title-fs&#x27;, lerp(T.conc.titleFs, s1Factor) + &#x27;px&#x27;);

  void page.offsetHeight; // force reflow so scrollHeight reads updated layout
  contentH = page.scrollHeight;
  if (contentH &lt;= maxH) {
    page.style.width = origWidth;
    page.style.minHeight = origMinH;
    page.style.maxHeight = origMaxH;
    page.style.overflow = origOverflow;
    if (footer) footer.style.marginTop = origFooterMargin;
    return;
  }

  // Stage 2: Supporting band padding, meta/description fonts, tags
  const s2Need = contentH - maxH;
  const s2Factor = Math.max(0, Math.min(1, 1 - (s2Need / (maxH * 0.25))));
  page.style.setProperty(&#x27;--band-sup-pad-v&#x27;, lerp(T.band.supPadV, s2Factor) + &#x27;px&#x27;);
  page.style.setProperty(&#x27;--band-desc-fs&#x27;, lerp(T.band.descFs, s2Factor) + &#x27;px&#x27;);
  page.style.setProperty(&#x27;--band-meta-fs&#x27;, lerp(T.band.metaFs, s2Factor) + &#x27;px&#x27;);
  page.style.setProperty(&#x27;--band-tag-fs&#x27;, lerp(T.band.tagFs, s2Factor) + &#x27;px&#x27;);
  page.style.setProperty(&#x27;--band-time-end-fs&#x27;, lerp(T.band.timeEndFs, s2Factor) + &#x27;px&#x27;);
  page.style.setProperty(&#x27;--band-time-dur-fs&#x27;, lerp(T.band.timeDurFs, s2Factor) + &#x27;px&#x27;);

  void page.offsetHeight; // force reflow so scrollHeight reads updated layout
  contentH = page.scrollHeight;
  if (contentH &lt;= maxH) {
    page.style.width = origWidth;
    page.style.minHeight = origMinH;
    page.style.maxHeight = origMaxH;
    page.style.overflow = origOverflow;
    if (footer) footer.style.marginTop = origFooterMargin;
    return;
  }

  // Stage 3: Primary band content — only as a last resort
  const s3Need = contentH - maxH;
  const s3Factor = Math.max(0, Math.min(1, 1 - (s3Need / (maxH * 0.25))));
  page.style.setProperty(&#x27;--band-main-pad-v&#x27;, lerp(T.band.mainPadV, s3Factor) + &#x27;px&#x27;);
  page.style.setProperty(&#x27;--band-main-pad-h&#x27;, lerp(T.band.mainPadH, s3Factor) + &#x27;px&#x27;);
  page.style.setProperty(&#x27;--band-title-fs&#x27;, lerp(T.band.titleFs, s3Factor) + &#x27;px&#x27;);
  page.style.setProperty(&#x27;--band-time-start-fs&#x27;, lerp(T.band.timeStartFs, s3Factor) + &#x27;px&#x27;);

  // Re-measure after all CSS var compression
  contentH = page.scrollHeight;

  // Restore measurement overrides
  page.style.width = origWidth;
  page.style.minHeight = origMinH;
  page.style.maxHeight = origMaxH;
  page.style.overflow = origOverflow;
  if (footer) footer.style.marginTop = origFooterMargin;

  if (contentH &lt;= maxH) return;

  // Screen: never zoom — stretch the page to the content height instead.
  // (Bands positions events absolutely, so the page cannot grow on its own.)
  // Microscopic-but-fits is worse than a tall, readable page; the density
  // warning already steers users to Grid/Cards/Phases. Print still zooms.
  if (!forPrint) {
    page.style.minHeight = contentH + &#x27;px&#x27;;
    return;
  }

  // Final fallback (print only): zoom shrinks actual layout dimensions.
  // zoom affects layout flow (unlike transform:scale which is visual-only),
  // so the print engine sees the zoomed box size for pagination.
  let scale = maxH / contentH;
  page.style.zoom = scale;
  page.dataset.printScaled = &#x27;1&#x27;;

  // Force min-height:0 so the stylesheet&#x27;s 11in floor doesn&#x27;t reassert at
  // the zoomed size (11in * 0.95 = 10.45in can still overflow).
  page.style.minHeight = &#x27;0&#x27;;

  // Browser zoom rounding can leave the final rendered box a few pixels taller
  // than scrollHeight predicted. Re-measure the actual box and correct once.
  void page.offsetHeight;
  const renderedHeight = page.getBoundingClientRect().height;
  if (renderedHeight &gt; maxH) {
    scale = scale * (maxH / renderedHeight) * 0.995;
    page.style.zoom = scale;
  }
}

function removePrintScaling(page) {
  const props = [
    &#x27;--band-main-pad-v&#x27;,&#x27;--band-main-pad-h&#x27;,&#x27;--band-sup-pad-v&#x27;,
    &#x27;--band-title-fs&#x27;,&#x27;--band-desc-fs&#x27;,&#x27;--band-meta-fs&#x27;,&#x27;--band-tag-fs&#x27;,
    &#x27;--band-time-start-fs&#x27;,&#x27;--band-time-end-fs&#x27;,&#x27;--band-time-dur-fs&#x27;,
    &#x27;--conc-title-fs&#x27;,&#x27;--conc-time-fs&#x27;,&#x27;--conc-detail-fs&#x27;,&#x27;--notes-fs&#x27;,&#x27;--notes-lh&#x27;,
  ];
  props.forEach(p =&gt; page.style.removeProperty(p));

  // zoom and inline min-height only ever come from scaling (the print zoom
  // fallback or the screen grow path), so always clear them.
  page.style.removeProperty(&#x27;zoom&#x27;);
  page.style.removeProperty(&#x27;min-height&#x27;);
  delete page.dataset.printScaled;
}

// Browser File → Print does not go through printSchedule. Build current full
// readable pages synchronously; beforeprint cannot wait for image decoding.
// An app-requested print retains its deliberate day/audience/detail/Fit choices.
window.addEventListener(&#x27;beforeprint&#x27;, () =&gt; {
  try {
    const pending = _printJob &amp;&amp; _printJob.source === &#x27;app&#x27; &amp;&amp;
      _printJob.fileData === getCurrentScheduleFileData() &amp;&amp; _printJob.container.isConnected;
    const options = normalizePrintOptions(pending ? _printJob.options : {});
    if (!options.dayIds.length) { clearPrintJob(); return; }
    const job = pending ? _printJob : createPrintJob(options, &#x27;browser&#x27;);
    job.options = options;
    job.started = true;
    updatePrintDocumentTitle(options);
    preparePrintPages(job.container, options);
  } catch (err) {
    reportPrintFailure(err);
  }
});

// Clean up scaling after print so screen view is unaffected
window.addEventListener(&#x27;afterprint&#x27;, () =&gt; {
  // Empty the print container: the print stylesheet forces it visible
  // (display:block !important), so stale pages left here would be printed —
  // with pre-edit data — by any later browser-menu File→Print.
  clearPrintJob();
  const activeDay = Store.getActiveDay();
  if (activeDay) renderDay(activeDay);
});

  &lt;script&gt;
/* ── events.js ── Contract ─────────────────────────────────────────────────
 *
 * EXPORTS: none (all side effects — registers global event listeners)
 *
 * REQUIRES:
 *   app-state.js  — Store.getActiveDay()
 *   inspector.js  — selectEntity(), openSettingsModal()
 *   print.js      — printAllDays()
 *   persistence.js — undo(), redo()
 *   storage.js    — forceSave()
 *
 * SIDE EFFECTS:
 *   Registers global click listener for:
 *     - [data-conc-jump] → scroll to matching &quot;Also Happening&quot; time group
 *     - .band-conc[data-event-id] → select concurrent event
 *     - .band[data-event-id] → select event
 *     - .conc-item[data-event-id] → select concurrent event
 *     - [data-skin-switch] → switch layout skin
 *     - .hdr → open settings modal
 *     - .notes-list li[data-note-id] → select note
 *     - .preview-area (empty area) → deselect
 *   Registers global keydown listener for:
 *     - Ctrl/Cmd+P → printAllDays()
 *     - Ctrl/Cmd+S → forceSave()
 *     - Ctrl/Cmd+Z → undo()
 *     - Ctrl/Cmd+Shift+Z or Ctrl/Cmd+Y → redo()
 * ──────────────────────────────────────────────────────────────────────────── */

// Selector for any clickable event element across all skins
const EVENT_SELECTOR = &#x27;[data-event-id], [data-event-ref], [data-main-context]&#x27;;

document.addEventListener(&#x27;click&#x27;, e =&gt; {
  if (e.target.closest(&#x27;.modal-overlay&#x27;)) return;

  const concJump = e.target.closest(&#x27;[data-conc-jump]&#x27;);
  if (concJump) {
    const jumpTime = concJump.getAttribute(&#x27;data-conc-jump&#x27;);
    const target = jumpTime ? document.querySelector(&#x27;[data-conc-group=&quot;&#x27; + jumpTime + &#x27;&quot;]&#x27;) : null;
    if (target &amp;&amp; typeof target.scrollIntoView === &#x27;function&#x27;) {
      target.scrollIntoView({ behavior: &#x27;smooth&#x27;, block: &#x27;start&#x27; });
    }
    return;
  }

  const skinSwitch = e.target.closest(&#x27;[data-skin-switch]&#x27;);
  if (skinSwitch) {
    if (typeof isCurrentScheduleEditable === &#x27;function&#x27; &amp;&amp; !isCurrentScheduleEditable()) {
      toast(&#x27;Read-only. Click Edit.&#x27;); return;
    }
    saveUndoState();
    const skin = skinSwitch.getAttribute(&#x27;data-skin-switch&#x27;);
    const fileData = getCurrentScheduleFileData();
    if (fileData) {
      if (!fileData.theme) fileData.theme = {};
      fileData.theme.skin = skin;
    }
    sessionSave();
    renderActiveDay();
    toast(&#x27;Layout: &#x27; + (SKIN_LABELS[skin] ? SKIN_LABELS[skin].name : skin));
    return;
  }

  // Click on &quot;Also happening&quot; concurrent indicator -&gt; select that concurrent event
  const concIndicator = e.target.closest(&#x27;.band-conc[data-event-id]&#x27;);
  if (concIndicator &amp;&amp; !e.target.closest(&#x27;.inspector&#x27;)) {
    const dayId = Store.getActiveDay();
    if (dayId) selectEntity(&#x27;event&#x27;, dayId, concIndicator.getAttribute(&#x27;data-event-id&#x27;));
    return;
  }

  // Click on any event element (band, grid cell, card event, phase task) -&gt; select in inspector
  const eventEl = e.target.closest(EVENT_SELECTOR);
  if (eventEl &amp;&amp; !e.target.closest(&#x27;.inspector&#x27;)) {
    const dayId = Store.getActiveDay();
    const eventId = eventEl.dataset.eventId || eventEl.dataset.eventRef || eventEl.dataset.mainContext;
    if (dayId) selectEntity(&#x27;event&#x27;, dayId, eventId);
    return;
  }

  // Click on header -&gt; open settings modal (logo, title, contact, groups)
  const hdr = e.target.closest(&#x27;.hdr, [data-band-customize]&#x27;);
  if (hdr &amp;&amp; !e.target.closest(&#x27;.inspector&#x27;)) {
    if (typeof isCurrentScheduleEditable === &#x27;function&#x27; &amp;&amp; !isCurrentScheduleEditable()) {
      toast(&#x27;Read-only. Click Edit.&#x27;);
      return;
    }
    openSettingsModal();
    return;
  }

  // Click on note -&gt; select in inspector
  const noteEl = e.target.closest(&#x27;.notes-list li[data-note-id], .band-sheet [data-note-id]&#x27;);
  if (noteEl &amp;&amp; !e.target.closest(&#x27;.inspector&#x27;)) {
    const dayId = Store.getActiveDay();
    if (dayId) selectEntity(&#x27;note&#x27;, dayId, noteEl.getAttribute(&#x27;data-note-id&#x27;));
    return;
  }

  // Click on empty page area -&gt; deselect (show schedule setup)
  if (e.target.closest(&#x27;.preview-area&#x27;) &amp;&amp; !e.target.closest(EVENT_SELECTOR) &amp;&amp; !e.target.closest(&#x27;.notes-list li&#x27;)) {
    selectEntity(null);
    return;
  }
});

// Keyboard shortcuts
document.addEventListener(&#x27;keydown&#x27;, e =&gt; {
  if (e.defaultPrevented) return;
  if ((e.key === &#x27;Enter&#x27; || e.key === &#x27; &#x27;) &amp;&amp; e.target.matches(&#x27;.hdr[role=&quot;button&quot;], .bands-screen [role=&quot;button&quot;], .band-sheet article[data-event-id]&#x27;)) {
    e.preventDefault();
    e.target.click();
    return;
  }
  // Caps Lock makes e.key &#x27;P&#x27; — the shortcut must not silently hand the
  // keystroke to the browser&#x27;s own print/save dialogs.
  const key = typeof e.key === &#x27;string&#x27; ? e.key.toLowerCase() : &#x27;&#x27;;
  const libraryView = document.getElementById(&#x27;libraryView&#x27;);
  const onStartScreen = !!(libraryView &amp;&amp; libraryView.classList.contains(&#x27;active&#x27;));
  // Cmd/Ctrl+P — print all days
  if ((e.metaKey || e.ctrlKey) &amp;&amp; key === &#x27;p&#x27;) {
    e.preventDefault();
    if (onStartScreen) { toast(&#x27;Open a schedule first.&#x27;); return; }
    openPrintReview();
    return;
  }
  // Cmd/Ctrl+S — save immediately
  if ((e.metaKey || e.ctrlKey) &amp;&amp; key === &#x27;s&#x27;) {
    e.preventDefault();
    // On the start screen a save would append an empty schedule to the
    // last-opened workbook.
    if (onStartScreen) { toast(&#x27;Nothing to save yet — open or create a schedule first.&#x27;); return; }
    forceSave();
    return;
  }
  // Undo/Redo
  if ((e.metaKey || e.ctrlKey) &amp;&amp; key === &#x27;z&#x27; &amp;&amp; !e.shiftKey) {
    if (e.target.tagName === &#x27;INPUT&#x27; || e.target.tagName === &#x27;TEXTAREA&#x27;) return;
    e.preventDefault();
    undo();
  }
  if ((e.metaKey || e.ctrlKey) &amp;&amp; ((key === &#x27;z&#x27; &amp;&amp; e.shiftKey) || key === &#x27;y&#x27;)) {
    if (e.target.tagName === &#x27;INPUT&#x27; || e.target.tagName === &#x27;TEXTAREA&#x27;) return;
    e.preventDefault();
    redo();
  }
});

/* ── inspector.js ── Contract ──────────────────────────────────────────────
 *
 * EXPORTS:
 *   selectEntity(type, dayId, entityId) — sets selection, renders inspector, highlights element
 *   renderInspector()        — dispatches to event/note/schedule-setup inspector face
 *   renderActiveDay()        — renders active day + day tabs (main render entry point)
 *   renderDayTabs()          — renders day tab buttons in toolbar
 *   wireToolbar()            — wires all toolbar buttons, title input, overflow menu

 *   openSettingsModal()      — opens settings modal (basics/look/audiences/advanced tabs)

 *   openDayEventSheetModal() — opens a day-only table editor for the active day
 *   openAddEvent(dayId)      — creates new event, selects it
 *   openAddNote(dayId)       — creates new note, selects it
 *   snapToQuarter(timeStr)   → string — snaps to nearest 15-min increment
 *   formatDateShort(dateStr) → string — &quot;Sat, Mar 15&quot;
 *
 * REQUIRES:
 *   app-state.js    — Store (all read/write methods)
 *   utils.js        — esc(), timeToMinutes(), generateId()
 *   ui-core.js      — toast()
 *   data-helpers.js — classifyEvents(), eventsOverlap()
 *   persistence.js  — saveUndoState(), sessionSave()
 *   render.js       — renderDay()
 *   storage.js      — getCurrentFileName(), hasDirectoryAccess(), scheduleNameToSlug(),
 *                     renameScheduleFile(), setCurrentFile(), getLastSavedAt()
 *   library.js      — returnToLibrary(), openHelpModal()
 *   versions.js     — openVersionPanel()
 *   print.js        — printAllDays()
 *
 * DOM ELEMENTS:
 *   #inspectorPanel    — right-side inspector panel
 *   #tbTitle           — toolbar title input
 *   #tbBack            — back to library button
 *   #addEventBtn       — add event button
 *   #addNoteBtn        — add note button
 *   #addDayBtn         — add day button
 *   #versionsMenuBtn   — versions panel button (overflow)
 *   #helpBtn           — help button (overflow)

 *   #dayEventSheetModal — day event sheet modal overlay
