 * CONSUMED BY:
 *   events.js    — selectEntity(), openSettingsModal()
 *   library.js   — renderActiveDay(), renderInspector(), syncToolbarTitle()
 *   storage.js   — renderActiveDay(), syncToolbarTitle()
 *   persistence.js — renderActiveDay()
 *   init.js      — wireToolbar(), renderActiveDay()
 * ──────────────────────────────────────────────────────────────────────────── */

/* ── inspector.js ── Unified inspector panel (replaces editing.js, groups.js, schedule-setup.js) */

let _selection = { type: null, dayId: null, entityId: null };
let _deleteTimer = null;
let _expandedDayId = null;
let _settingsActiveTab = &#x27;look&#x27;;
let _daySheetSelectedEventId = null;

// ── Selection ──────────────────────────────────────────────────────────────

function syncPreviewSelection() {
  const container = document.getElementById(&#x27;scheduleContainer&#x27;);
  if (!container) return;

  container.querySelectorAll(&#x27;[data-event-id].selected, [data-event-ref].selected, [data-main-context].selected&#x27;).forEach(el =&gt; el.classList.remove(&#x27;selected&#x27;));
  container.querySelectorAll(&#x27;[data-note-id].selected&#x27;).forEach(el =&gt; el.classList.remove(&#x27;selected&#x27;));

  if (_selection.type === &#x27;event&#x27; &amp;&amp; _selection.entityId) {
    container.querySelectorAll(&#x27;[data-event-id], [data-event-ref], [data-main-context]&#x27;).forEach(el =&gt; {
      if ((el.dataset.eventId || el.dataset.eventRef || el.dataset.mainContext) === _selection.entityId) el.classList.add(&#x27;selected&#x27;);
    });
  } else if (_selection.type === &#x27;note&#x27; &amp;&amp; _selection.entityId) {
    const noteEl = container.querySelector(&#x27;[data-note-id=&quot;&#x27; + _selection.entityId + &#x27;&quot;]&#x27;);
    if (noteEl) noteEl.classList.add(&#x27;selected&#x27;);
  }
}

function selectEntity(type, dayId, entityId) {
  _selection = { type: type || null, dayId: dayId || null, entityId: entityId || null };
  renderInspector();
  syncPreviewSelection();
}

// ── Render dispatcher ──────────────────────────────────────────────────────

function renderInspector() {
  const panel = document.getElementById(&#x27;inspectorPanel&#x27;);
  if (!panel) return;
  clearDeleteTimer();
  wireEditabilityGuard(panel, &#x27;#insp-close, .insp-day-header&#x27;, renderInspector);

  if (_selection.type === &#x27;event&#x27; &amp;&amp; _selection.dayId &amp;&amp; _selection.entityId) {
    renderEventInspector(panel, _selection.dayId, _selection.entityId);
  } else if (_selection.type === &#x27;note&#x27; &amp;&amp; _selection.dayId &amp;&amp; _selection.entityId) {
    renderNoteInspector(panel, _selection.dayId, _selection.entityId);
  } else {
    renderScheduleSetup(panel);
  }
}

// ── Face 1: Schedule Setup ─────────────────────────────────────────────────

function renderScheduleSetup(panel) {
  const days = Store.getDays();
  const readOnly = typeof isCurrentScheduleEditable === &#x27;function&#x27; ? !isCurrentScheduleEditable() : false;
  const disabledAttr = readOnly ? &#x27; disabled&#x27; : &#x27;&#x27;;

  let html = &#x27;&#x27;;
  if (readOnly) {
    html += &#x27;&lt;div class=&quot;insp-readonly-note&quot;&gt;Read-only. Click &lt;strong&gt;Edit&lt;/strong&gt;.&lt;/div&gt;&#x27;;
  }

  html += &#x27;&lt;div class=&quot;insp-section-head&quot;&gt;&#x27;;
  html += &#x27;&lt;h3&gt;Days&lt;/h3&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;

  if (!days.length) {
    html += &#x27;&lt;div class=&quot;empty-state&quot;&gt;&lt;strong&gt;No days yet.&lt;/strong&gt; Click &lt;strong&gt;+ Day&lt;/strong&gt;.&lt;/div&gt;&#x27;;
  } else {
    html += &#x27;&lt;div class=&quot;insp-day-accordion&quot;&gt;&#x27;;
    days.forEach((day, i) =&gt; {
      const shortDate = day.date ? formatDateShort(day.date) : &#x27;Day &#x27; + (i + 1);
      const timeRange = day.startTime + &#x27;–&#x27; + day.endTime;
      const isExpanded = day.id === (_expandedDayId || &#x27;&#x27;);
      html += &#x27;&lt;div class=&quot;insp-day-item&quot; data-day-id=&quot;&#x27; + esc(day.id) + &#x27;&quot;&gt;&#x27;;
      html += &#x27;&lt;button type=&quot;button&quot; class=&quot;insp-day-header&#x27; + (isExpanded ? &#x27; expanded&#x27; : &#x27;&#x27;) + &#x27;&quot; aria-expanded=&quot;&#x27; + isExpanded + &#x27;&quot;&gt;&#x27;;
      html += &#x27;&lt;span class=&quot;insp-day-arrow&quot;&gt;&#x27; + (isExpanded ? &#x27;▾&#x27; : &#x27;▸&#x27;) + &#x27;&lt;/span&gt;&#x27;;
      html += &#x27;&lt;span class=&quot;insp-day-summary&quot;&gt;&#x27;;
      html += &#x27;&lt;strong&gt;&#x27; + esc(shortDate) + &#x27;&lt;/strong&gt;&#x27;;
      html += &#x27;&lt;span class=&quot;insp-day-times&quot;&gt;&#x27; + esc(timeRange) + &#x27;&lt;/span&gt;&#x27;;
      html += &#x27;&lt;/span&gt;&#x27;;
      html += &#x27;&lt;/button&gt;&#x27;;
      if (isExpanded) {
        html += &#x27;&lt;div class=&quot;insp-day-body&quot;&gt;&#x27;;
        html += &#x27;&lt;label&gt;Date&lt;/label&gt;&#x27;;
        html += &#x27;&lt;input type=&quot;date&quot; class=&quot;insp-day-date&quot; aria-label=&quot;Day date&quot; value=&quot;&#x27; + esc(day.date) + &#x27;&quot;&#x27; + disabledAttr + &#x27;&gt;&#x27;;
        html += &#x27;&lt;div class=&quot;field-row&quot;&gt;&#x27;;
        html += &#x27;&lt;div&gt;&lt;label&gt;Start&lt;/label&gt;&lt;input type=&quot;text&quot; class=&quot;insp-day-start&quot; aria-label=&quot;Day start time&quot; value=&quot;&#x27; + esc(day.startTime) + &#x27;&quot; placeholder=&quot;0700&quot;&#x27; + disabledAttr + &#x27;&gt;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;div&gt;&lt;label&gt;End&lt;/label&gt;&lt;input type=&quot;text&quot; class=&quot;insp-day-end&quot; aria-label=&quot;Day end time&quot; value=&quot;&#x27; + esc(day.endTime) + &#x27;&quot; placeholder=&quot;1630&quot;&#x27; + disabledAttr + &#x27;&gt;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;/div&gt;&#x27;;
        html += &#x27;&lt;label&gt;Label&lt;/label&gt;&#x27;;
        html += &#x27;&lt;input type=&quot;text&quot; class=&quot;insp-day-label&quot; aria-label=&quot;Day label&quot; value=&quot;&#x27; + esc(day.label || &#x27;&#x27;) + &#x27;&quot; placeholder=&quot;auto (e.g., Sat, Mar 15)&quot;&#x27; + disabledAttr + &#x27;&gt;&#x27;;
        html += &#x27;&lt;button class=&quot;btn insp-day-duplicate&quot; style=&quot;font-size:10px;padding:3px 8px;margin-top:6px;&quot;&#x27; + disabledAttr + &#x27;&gt;Duplicate Day&lt;/button&gt;&#x27;;
        if (days.length &gt; 1) {
          html += &#x27; &lt;button class=&quot;btn btn-danger insp-day-remove&quot; style=&quot;font-size:10px;padding:3px 8px;margin-top:6px;&quot; data-delete-label=&quot;Remove Day&quot; data-delete-armed-label=&quot;Tap again to remove&quot;&#x27; + disabledAttr + &#x27;&gt;Remove Day&lt;/button&gt;&#x27;;
        } else {
          html += &#x27; &lt;button class=&quot;btn btn-danger insp-day-remove&quot; style=&quot;font-size:10px;padding:3px 8px;margin-top:6px;&quot; disabled title=&quot;A schedule needs at least one day.&quot;&gt;Remove Day&lt;/button&gt;&#x27;;
        }
        html += &#x27;&lt;/div&gt;&#x27;;
      }
      html += &#x27;&lt;/div&gt;&#x27;;
    });
    html += &#x27;&lt;/div&gt;&#x27;;
  }

  panel.innerHTML = html;
  wireScheduleSetup(panel);
}

function wireScheduleSetup(panel) {
  const editable = typeof isCurrentScheduleEditable === &#x27;function&#x27; ? isCurrentScheduleEditable() : true;

  // Day accordion headers — toggle expand/collapse
  panel.querySelectorAll(&#x27;.insp-day-header&#x27;).forEach(header =&gt; {
    header.addEventListener(&#x27;click&#x27;, () =&gt; {
      const dayId = header.closest(&#x27;.insp-day-item&#x27;).getAttribute(&#x27;data-day-id&#x27;);
      _expandedDayId = (_expandedDayId === dayId) ? null : dayId;
      renderInspector();
      const next = panel.querySelector(&#x27;.insp-day-item[data-day-id=&quot;&#x27; + dayId + &#x27;&quot;] .insp-day-header&#x27;);
      if (next) next.focus();
    });
  });

  if (!editable) return;

  // Day fields (only wired for the expanded day)
  panel.querySelectorAll(&#x27;.insp-day-body&#x27;).forEach(body =&gt; {
    const item = body.closest(&#x27;.insp-day-item&#x27;);
    const dayId = item.getAttribute(&#x27;data-day-id&#x27;);
    wireDayField(body, &#x27;.insp-day-date&#x27;, dayId, &#x27;date&#x27;);
    wireDayField(body, &#x27;.insp-day-start&#x27;, dayId, &#x27;startTime&#x27;);
    wireDayField(body, &#x27;.insp-day-end&#x27;, dayId, &#x27;endTime&#x27;);
    wireDayField(body, &#x27;.insp-day-label&#x27;, dayId, &#x27;label&#x27;, true);

    const dupBtn = body.querySelector(&#x27;.insp-day-duplicate&#x27;);
    if (dupBtn) {
      dupBtn.addEventListener(&#x27;click&#x27;, () =&gt; {
        saveUndoState();
        const clone = Store.duplicateDay(dayId);
        if (clone) {
          Store.setActiveDay(clone.id);
          _expandedDayId = clone.id;
          sessionSave();
          renderActiveDay();
          renderInspector();
          toast(&#x27;Duplicated day&#x27;);
        }
      });
    }

    const removeBtn = body.querySelector(&#x27;.insp-day-remove&#x27;);
    if (removeBtn &amp;&amp; !removeBtn.disabled) {
      // Removing a day takes every event and note on it — same tap-again
      // confirm as the other destructive buttons.
      wireDeleteButton(removeBtn, () =&gt; {
        saveUndoState();
        Store.removeDay(dayId);
        _expandedDayId = null;
        const days = Store.getDays();
        if (days.length &amp;&amp; !days.find(d =&gt; d.id === Store.getActiveDay())) {
          Store.setActiveDay(days[0].id);
        }
        sessionSave();
        renderActiveDay();
        renderInspector();
      });
    }
  });
}

// ── Settings Modal ────────────────────────────────────────────────────────

function openSettingsModal() {
  if (typeof isCurrentScheduleEditable === &#x27;function&#x27; &amp;&amp; !isCurrentScheduleEditable()) {
    toast(&#x27;Read-only. Click Edit.&#x27;);
    return;
  }
  const modal = document.getElementById(&#x27;settingsModalContent&#x27;);
  renderSettingsModal(modal);
  openModal(&#x27;settingsModal&#x27;);
}

function closeSettingsModal() {
  renderActiveDay();
  renderInspector();
  closeModal(&#x27;settingsModal&#x27;);
}

// A lock can change while an editor is already open. Gate the action at the
// event boundary as well as disabling controls when initially rendering it.
function wireEditabilityGuard(container, allowed, refresh) {
  if (container._editabilityGuard) return;
  container._editabilityGuard = true;
  [&#x27;click&#x27;, &#x27;input&#x27;, &#x27;change&#x27;].forEach(type =&gt; container.addEventListener(type, e =&gt; {
    if (typeof isCurrentScheduleEditable !== &#x27;function&#x27; || isCurrentScheduleEditable()) return;
    const control = e.target.closest(&#x27;input, select, textarea, button&#x27;);
    if (!control || (allowed &amp;&amp; control.matches(allowed))) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    if (type !== &#x27;click&#x27; &amp;&amp; refresh) refresh();
    toast(&#x27;Read-only. Click Edit to make changes.&#x27;);
  }, true));
}

function renderSettingsModal(modal) {
  const focused = modal.contains(document.activeElement) ? document.activeElement : null;
  const focusId = focused &amp;&amp; focused.id;
  const focusData = focused &amp;&amp; [&#x27;settingsTab&#x27;, &#x27;skin&#x27;, &#x27;palette&#x27;].find(key =&gt; focused.dataset[key]);
  const focusValue = focusData &amp;&amp; focused.dataset[focusData];
  const title = Store.getTitle();
  const footer = Store.getFooter();
  const groups = Store.getGroups();
  const currentTheme = getScheduleTheme(getCurrentScheduleFileData() &amp;&amp; getCurrentScheduleFileData().theme);

  let html = &#x27;&lt;h2&gt;Customize Schedule&lt;/h2&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-tabs&quot; role=&quot;tablist&quot; aria-label=&quot;Customize sections&quot;&gt;&#x27;;
  html += renderSettingsTab(&#x27;basics&#x27;, &#x27;Basics&#x27;);
  html += renderSettingsTab(&#x27;look&#x27;, &#x27;Look&#x27;);
  html += renderSettingsTab(&#x27;audiences&#x27;, &#x27;Audiences&#x27;);
  html += renderSettingsTab(&#x27;advanced&#x27;, &#x27;Export&#x27;);
  html += &#x27;&lt;/div&gt;&#x27;;

  html += &#x27;&lt;div class=&quot;settings-panel-group&quot;&gt;&#x27;;

  html += &#x27;&lt;section class=&quot;settings-panel&#x27; + (_settingsActiveTab === &#x27;basics&#x27; ? &#x27; active&#x27; : &#x27;&#x27;) + &#x27;&quot; data-settings-panel=&quot;basics&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-section&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-section-title&quot;&gt;Basics&lt;/div&gt;&#x27;;
  html += &#x27;&lt;label class=&quot;settings-label&quot; for=&quot;settings-title&quot;&gt;Schedule Title&lt;/label&gt;&#x27;;

    html += &#x27;&lt;label class=&quot;insp-toggle-label&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;settings-band-logo&quot;&#x27; + (bandSettings.showLogo ? &#x27; checked&#x27; : &#x27;&#x27;) + &#x27;&gt; Show logo on Bands&lt;/label&gt;&#x27;;
  }
  if (Store.getLogo()) {
    html += &#x27;&lt;div class=&quot;settings-logo-preview&quot;&gt;&lt;img alt=&quot;Current unit logo&quot; src=&quot;&#x27; + esc(Store.getLogo()) + &#x27;&quot; style=&quot;max-height:48px;border-radius:4px;&quot;&gt; &#x27;;
    html += &#x27;&lt;button class=&quot;btn&quot; id=&quot;settings-logo-remove&quot; style=&quot;font-size:10px;padding:2px 8px;&quot;&gt;Remove logo&lt;/button&gt;&lt;/div&gt;&#x27;;
  }
  html += &#x27;&lt;label class=&quot;settings-label&quot; for=&quot;settings-contact&quot;&gt;&#x27; + (currentTheme.skin === &#x27;bands&#x27; ? &#x27;Subtitle (optional)&#x27; : &#x27;Header Line&#x27;) + &#x27;&lt;/label&gt;&#x27;;
  html += &#x27;&lt;input type=&quot;text&quot; class=&quot;settings-input&quot; id=&quot;settings-contact&quot; value=&quot;&#x27; + esc(footer.contact) + &#x27;&quot;&gt;&#x27;;
  html += &#x27;&lt;label class=&quot;settings-label&quot; for=&quot;settings-poc&quot;&gt;Point of Contact&lt;/label&gt;&#x27;;
  html += &#x27;&lt;input type=&quot;text&quot; class=&quot;settings-input&quot; id=&quot;settings-poc&quot; value=&quot;&#x27; + esc(footer.poc) + &#x27;&quot;&gt;&#x27;;
  if (currentTheme.skin === &#x27;bands&#x27;) {
    const bandSettings = getBandSettings(getCurrentScheduleFileData()?.theme);
    html += &#x27;&lt;label class=&quot;settings-label&quot; for=&quot;settings-band-notes&quot;&gt;Notes &amp;amp; Reminders space&lt;/label&gt;&lt;select class=&quot;settings-input&quot; id=&quot;settings-band-notes&quot;&gt;&#x27; +
      [[90, &#x27;1¼ inches&#x27;], [108, &#x27;1½ inches&#x27;], [144, &#x27;2 inches&#x27;]].map(([value, label]) =&gt; &#x27;&lt;option value=&quot;&#x27; + value + &#x27;&quot;&#x27; + (bandSettings.notesHeight === value ? &#x27; selected&#x27; : &#x27;&#x27;) + &#x27;&gt;&#x27; + label + &#x27;&lt;/option&gt;&#x27;).join(&#x27;&#x27;) + &#x27;&lt;/select&gt;&#x27;;
  }
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/section&gt;&#x27;;

  html += &#x27;&lt;section class=&quot;settings-panel&#x27; + (_settingsActiveTab === &#x27;look&#x27; ? &#x27; active&#x27; : &#x27;&#x27;) + &#x27;&quot; data-settings-panel=&quot;look&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-section&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-section-title&quot;&gt;Look&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-label&quot; style=&quot;margin-bottom:8px;&quot;&gt;Layout&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;skin-picker&quot;&gt;&#x27;;
  SKIN_NAMES.forEach(function(skin) {
    const label = SKIN_LABELS[skin];
    const selected = skin === currentTheme.skin ? &#x27; selected&#x27; : &#x27;&#x27;;
    // Buttons, not divs: the pickers were unreachable by keyboard.
    html += &#x27;&lt;button type=&quot;button&quot; class=&quot;skin-option&#x27; + selected + &#x27;&quot; data-skin=&quot;&#x27; + skin + &#x27;&quot; aria-pressed=&quot;&#x27; + (selected ? &#x27;true&#x27; : &#x27;false&#x27;) + &#x27;&quot;&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;skin-thumb skin-thumb-&#x27; + skin + &#x27;&quot;&gt;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;skin-option-name&quot;&gt;&#x27; + esc(label.name) + &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;skin-option-desc&quot;&gt;&#x27; + esc(label.desc) + &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;/button&gt;&#x27;;
  });
  html += &#x27;&lt;/div&gt;&#x27;;

  html += &#x27;&lt;div class=&quot;settings-label&quot; style=&quot;margin-top:16px;margin-bottom:8px;&quot;&gt;Colors&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;palette-picker&quot;&gt;&#x27;;
  PALETTE_NAMES.forEach(function(name) {
    const p = PALETTES[name];
    const selected = name === currentTheme.palette ? &#x27; selected&#x27; : &#x27;&#x27;;
    html += &#x27;&lt;button type=&quot;button&quot; class=&quot;palette-option&#x27; + selected + &#x27;&quot; data-palette=&quot;&#x27; + name + &#x27;&quot; aria-pressed=&quot;&#x27; + (selected ? &#x27;true&#x27; : &#x27;false&#x27;) + &#x27;&quot;&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;palette-swatch&quot; style=&quot;background:&#x27; + esc(p.bg) + &#x27;;&quot;&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;palette-bar&quot; style=&quot;background:&#x27; + esc(p.accent) + &#x27;;&quot;&gt;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;palette-bar&quot; style=&quot;background:&#x27; + esc(p.accentSecondary) + &#x27;;&quot;&gt;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;palette-bar&quot; style=&quot;background:&#x27; + esc(p.accentTertiary) + &#x27;;&quot;&gt;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;palette-option-name&quot;&gt;&#x27; + esc(PALETTE_LABELS[name]) + &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;/button&gt;&#x27;;
  });
  html += &#x27;&lt;button type=&quot;button&quot; class=&quot;palette-option&#x27; + (currentTheme.palette === &#x27;custom&#x27; ? &#x27; selected&#x27; : &#x27;&#x27;) + &#x27;&quot; data-palette=&quot;custom&quot; aria-pressed=&quot;&#x27; + (currentTheme.palette === &#x27;custom&#x27; ? &#x27;true&#x27; : &#x27;false&#x27;) + &#x27;&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;palette-swatch palette-custom-swatch&quot;&gt;+&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;palette-option-name&quot;&gt;Custom&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/button&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  const custom = Object.assign({}, PALETTES.classic, currentTheme.customColors);
  html += &#x27;&lt;div class=&quot;custom-palette-fields&quot;&#x27; + (currentTheme.palette === &#x27;custom&#x27; ? &#x27;&#x27; : &#x27; hidden&#x27;) + &#x27;&gt;&#x27;;
  const colorLabels = { bg: &#x27;Paper&#x27;, text: &#x27;Text&#x27;, textSecondary: &#x27;Secondary text&#x27;, textMuted: &#x27;Muted text&#x27;,
    accent: &#x27;Main accent&#x27;, accentSecondary: &#x27;Second accent&#x27;, accentTertiary: &#x27;Third accent&#x27;, border: &#x27;Borders&#x27;, surface: &#x27;Panels&#x27; };
  Object.keys(colorLabels).forEach(key =&gt; {
    html += &#x27;&lt;label class=&quot;custom-palette-field&quot;&gt;&lt;span&gt;&#x27; + colorLabels[key] + &#x27;&lt;/span&gt;&#x27;
      + &#x27;&lt;input type=&quot;color&quot; data-custom-color=&quot;&#x27; + key + &#x27;&quot; value=&quot;&#x27; + esc(custom[key]) + &#x27;&quot;&gt;&lt;/label&gt;&#x27;;
  });
  html += &#x27;&lt;p class=&quot;custom-palette-warning&quot; role=&quot;status&quot;&gt;&lt;/p&gt;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/section&gt;&#x27;;

  html += &#x27;&lt;section class=&quot;settings-panel&#x27; + (_settingsActiveTab === &#x27;audiences&#x27; ? &#x27; active&#x27; : &#x27;&#x27;) + &#x27;&quot; data-settings-panel=&quot;audiences&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-section&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-section-title&quot;&gt;Audiences&lt;/div&gt;&#x27;;
  html += &#x27;&lt;p class=&quot;insp-hint&quot; style=&quot;margin-top:0;margin-bottom:8px;&quot;&gt;Primary shows in the main track.&lt;/p&gt;&#x27;;
  groups.forEach(g =&gt; {
    html += &#x27;&lt;div class=&quot;insp-group-item&quot; data-group-id=&quot;&#x27; + esc(g.id) + &#x27;&quot;&gt;&#x27;;
    html += &#x27;&lt;input type=&quot;color&quot; class=&quot;insp-group-color&quot; aria-label=&quot;Color for &#x27; + esc(g.name) + &#x27;&quot; value=&quot;&#x27; + esc(g.color) + &#x27;&quot;&gt;&#x27;;
    html += &#x27;&lt;input type=&quot;text&quot; class=&quot;insp-group-name&quot; aria-label=&quot;Audience name&quot; value=&quot;&#x27; + esc(g.name) + &#x27;&quot; placeholder=&quot;Group name&quot;&gt;&#x27;;
    html += &#x27;&lt;button class=&quot;insp-group-scope &#x27; + (g.scope === &#x27;main&#x27; ? &#x27;main&#x27; : &#x27;&#x27;) + &#x27;&quot; title=&quot;Toggle between Primary and Supporting&quot;&gt;&#x27; + (g.scope === &#x27;main&#x27; ? &#x27;Primary&#x27; : &#x27;Supporting&#x27;) + &#x27;&lt;/button&gt;&#x27;;
    html += &#x27;&lt;button class=&quot;insp-group-remove&quot; type=&quot;button&quot; aria-label=&quot;Remove audience&quot; title=&quot;Remove audience&quot; data-delete-label=&quot;&amp;times;&quot; data-delete-armed-label=&quot;Delete?&quot;&gt;&amp;times;&lt;/button&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
  });
  html += &#x27;&lt;button class=&quot;btn&quot; id=&quot;settings-add-group&quot; style=&quot;margin-top:6px;font-size:11px;&quot;&gt;+ Add Audience&lt;/button&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/section&gt;&#x27;;

  html += &#x27;&lt;section class=&quot;settings-panel&#x27; + (_settingsActiveTab === &#x27;advanced&#x27; ? &#x27; active&#x27; : &#x27;&#x27;) + &#x27;&quot; data-settings-panel=&quot;advanced&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-section&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-section-title&quot;&gt;Export&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-export-row&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-export-copy&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-export-label&quot;&gt;Schedule File&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-export-hint&quot;&gt;Portable full schedule file with theme, versions, and activity.&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;button class=&quot;btn settings-export-btn&quot; id=&quot;settings-save-schedule-file&quot;&gt;Save .schedule&lt;/button&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-export-row&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-export-copy&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-export-label&quot;&gt;Manual File Export&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;settings-export-hint&quot;&gt;Backup only, or use it when auto-save is unavailable.&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;button class=&quot;btn settings-export-btn&quot; id=&quot;settings-save-file&quot;&gt;Manual Export&lt;/button&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/section&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;

  html += &#x27;&lt;div class=&quot;modal-actions&quot;&gt;&#x27;;
  html += &#x27;&lt;button class=&quot;btn btn-primary&quot; id=&quot;settings-done&quot;&gt;Done&lt;/button&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;

  modal.innerHTML = html;
  wireSettingsModal(modal);
  modal.querySelectorAll(&#x27;[data-settings-panel]&#x27;).forEach(panel =&gt; {
    const name = panel.dataset.settingsPanel;
    panel.id = &#x27;settings-panel-&#x27; + name;
    panel.setAttribute(&#x27;role&#x27;, &#x27;tabpanel&#x27;);
    panel.setAttribute(&#x27;aria-labelledby&#x27;, &#x27;settings-tab-&#x27; + name);
    panel.hidden = name !== _settingsActiveTab;
  });
  const nextFocus = focusId ? document.getElementById(focusId)
    : focusData ? Array.from(modal.querySelectorAll(&#x27;button&#x27;)).find(btn =&gt; btn.dataset[focusData] === focusValue) : null;
  if (nextFocus &amp;&amp; modal.contains(nextFocus)) nextFocus.focus();
}

function renderSettingsTab(tabId, label) {
  const active = _settingsActiveTab === tabId ? &#x27; active&#x27; : &#x27;&#x27;;
  return &#x27;&lt;button type=&quot;button&quot; id=&quot;settings-tab-&#x27; + tabId + &#x27;&quot; class=&quot;settings-tab&#x27; + active + &#x27;&quot; data-settings-tab=&quot;&#x27; + esc(tabId) + &#x27;&quot; role=&quot;tab&quot; aria-controls=&quot;settings-panel-&#x27; + tabId + &#x27;&quot; tabindex=&quot;&#x27; + (active ? &#x27;0&#x27; : &#x27;-1&#x27;) + &#x27;&quot; aria-selected=&quot;&#x27; + (_settingsActiveTab === tabId ? &#x27;true&#x27; : &#x27;false&#x27;) + &#x27;&quot;&gt;&#x27; + esc(label) + &#x27;&lt;/button&gt;&#x27;;
}

function wireSettingsModal(modal) {
  wireEditabilityGuard(modal, &#x27;.settings-tab, #settings-done, #settings-save-file, #settings-save-schedule-file&#x27;, () =&gt; renderSettingsModal(modal));
  modal.querySelectorAll(&#x27;.settings-tab&#x27;).forEach(tab =&gt; {
    tab.addEventListener(&#x27;click&#x27;, () =&gt; {
      _settingsActiveTab = tab.getAttribute(&#x27;data-settings-tab&#x27;) || &#x27;look&#x27;;
      renderSettingsModal(modal);
      modal.querySelector(&#x27;[data-settings-tab=&quot;&#x27; + _settingsActiveTab + &#x27;&quot;]&#x27;).focus();
    });
    tab.addEventListener(&#x27;keydown&#x27;, e =&gt; {
      if (![&#x27;ArrowLeft&#x27;, &#x27;ArrowRight&#x27;, &#x27;Home&#x27;, &#x27;End&#x27;].includes(e.key)) return;
      e.preventDefault();
      const tabs = Array.from(modal.querySelectorAll(&#x27;.settings-tab&#x27;));
      const i = tabs.indexOf(tab);
      const next = e.key === &#x27;Home&#x27; ? 0 : e.key === &#x27;End&#x27; ? tabs.length - 1
        : (i + (e.key === &#x27;ArrowRight&#x27; ? 1 : -1) + tabs.length) % tabs.length;
      tabs[next].click();
    });
  });

  function updateCustomContrast() {
    const warning = modal.querySelector(&#x27;.custom-palette-warning&#x27;);
    if (!warning) return;
    const colors = Object.assign({}, PALETTES.classic, getScheduleTheme(getCurrentScheduleFileData() &amp;&amp; getCurrentScheduleFileData().theme).customColors);
    const transparent = Object.values(colors).some(color =&gt; {
      const parsed = parseHexColor(color);
      return parsed &amp;&amp; parsed.alpha &lt; 1;
    });
    const skin = getScheduleTheme(getCurrentScheduleFileData()?.theme).skin;
    const textRoles = skin === &#x27;bands&#x27; ? [&#x27;text&#x27;, &#x27;textSecondary&#x27;, &#x27;textMuted&#x27;, &#x27;accent&#x27;] : [&#x27;text&#x27;, &#x27;textSecondary&#x27;, &#x27;textMuted&#x27;];
    const low = textRoles.some(key =&gt;
      [&#x27;bg&#x27;, &#x27;surface&#x27;].some(surface =&gt; getColorContrast(colors[key], colors[surface]) &lt; 4.5));
    warning.textContent = transparent ? &#x27;Transparent colors depend on the surface behind them. Choose opaque colors for predictable contrast.&#x27;
      : low ? &#x27;Some text has low contrast. Choose darker text on light paper, or lighter text on dark paper.&#x27; : &#x27;Text contrast meets the 4.5:1 reading target.&#x27;;
  }
  modal.querySelectorAll(&#x27;[data-custom-color]&#x27;).forEach(input =&gt; {
    input.addEventListener(&#x27;change&#x27;, () =&gt; {
      const fileData = getCurrentScheduleFileData();
      if (!fileData) return;
      saveUndoState();
      if (!fileData.theme) fileData.theme = {};
      fileData.theme.palette = &#x27;custom&#x27;;
      fileData.theme.customColors = Object.assign({}, fileData.theme.customColors, { [input.dataset.customColor]: input.value });
      sessionSave();
      renderActiveDay();
      updateCustomContrast();
    });
  });
  updateCustomContrast();

  // General tab fields — auto-commit on change
  const titleInput = modal.querySelector(&#x27;#settings-title&#x27;);
  if (titleInput) {
    titleInput.addEventListener(&#x27;input&#x27;, () =&gt; {
      saveUndoState();
      Store.setTitle(titleInput.value.trim());
      syncToolbarTitle();
      renderActiveDay();
      sessionSave();
    });
  }

  // Logo upload
  modal.querySelector(&#x27;#settings-band-logo&#x27;)?.addEventListener(&#x27;change&#x27;, event =&gt; updateBandSettings({ showLogo: event.target.checked }));
  modal.querySelector(&#x27;#settings-band-notes&#x27;)?.addEventListener(&#x27;change&#x27;, event =&gt; updateBandSettings({ notesHeight: Number(event.target.value) }));
  const logoInput = modal.querySelector(&#x27;#settings-logo&#x27;);
  if (logoInput) {
    logoInput.addEventListener(&#x27;change&#x27;, (e) =&gt; {
      const file = e.target.files[0];
      if (!file) return;
      // The logo is stored inline (data: URL) in the .schedule file and the
      // crash-recovery backup; a non-image is dropped on reload and a huge one
      // silently overflows sessionStorage. Refuse both with a reason.
      if (!/^image\//.test(file.type || &#x27;&#x27;)) {
        toast(&#x27;That file isn’t an image. Choose a PNG, JPG, or SVG logo.&#x27;, 4500);
        logoInput.value = &#x27;&#x27;;
        return;
      }
      if (file.size &gt; LOGO_MAX_BYTES) {
        toast(&#x27;Logo is &#x27; + (file.size / (1024 * 1024)).toFixed(1) + &#x27; MB — keep it under 2 MB so the schedule file stays small and saves reliably.&#x27;, 6000);
        logoInput.value = &#x27;&#x27;;
        return;
      }
      const reader = new FileReader();
      const targetSchedule = getCurrentScheduleFileData();
      reader.onload = (ev) =&gt; {
        if ((typeof isCurrentScheduleEditable === &#x27;function&#x27; &amp;&amp; !isCurrentScheduleEditable())
            || targetSchedule !== getCurrentScheduleFileData()) {
          toast(&#x27;The schedule changed while the logo was loading. Choose the logo again.&#x27;);
          return;
        }
        saveUndoState();
        Store.setLogo(ev.target.result);
        renderActiveDay();
        sessionSave();
        renderSettingsModal(modal);
      };
      reader.onerror = () =&gt; {
        toast(&#x27;Couldn’t read that file. Try a different image.&#x27;, 4500);
        logoInput.value = &#x27;&#x27;;
      };
      reader.readAsDataURL(file);
    });
  }
  const logoRemove = modal.querySelector(&#x27;#settings-logo-remove&#x27;);
  if (logoRemove) {
    logoRemove.addEventListener(&#x27;click&#x27;, () =&gt; {
      saveUndoState();
      Store.setLogo(null);
      renderActiveDay();
      sessionSave();
      renderSettingsModal(modal);
    });
  }

  // Footer fields
  wireSettingsFooterField(modal, &#x27;#settings-contact&#x27;, &#x27;contact&#x27;);
  wireSettingsFooterField(modal, &#x27;#settings-poc&#x27;, &#x27;poc&#x27;);
  // &#x27;updated&#x27; field removed — auto-set at print time

  // Group fields
  modal.querySelectorAll(&#x27;.insp-group-item&#x27;).forEach(item =&gt; {
    const groupId = item.getAttribute(&#x27;data-group-id&#x27;);

    // The schedule behind the modal must track these live, like the scope
    // toggle below does — otherwise Store and preview disagree until Done.
    const colorInput = item.querySelector(&#x27;.insp-group-color&#x27;);
    colorInput.addEventListener(&#x27;input&#x27;, () =&gt; {
      saveUndoState();
      Store.updateGroup(groupId, { color: colorInput.value });
      renderActiveDay();
      sessionSave();
    });

    const nameInput = item.querySelector(&#x27;.insp-group-name&#x27;);
    nameInput.addEventListener(&#x27;input&#x27;, () =&gt; {
      saveUndoState();
      Store.updateGroup(groupId, { name: nameInput.value.trim() });
      renderActiveDay();
      sessionSave();
    });
    wireRequiredTextField(nameInput, &#x27;Unnamed Group&#x27;, (value) =&gt; {
      Store.updateGroup(groupId, { name: value });
    }, &#x27;Audiences need a name — restored the previous one.&#x27;);

    const scopeBtn = item.querySelector(&#x27;.insp-group-scope&#x27;);
    scopeBtn.addEventListener(&#x27;click&#x27;, () =&gt; {
      saveUndoState();
      const isMain = scopeBtn.classList.contains(&#x27;main&#x27;);
      const newScope = isMain ? &#x27;limited&#x27; : &#x27;main&#x27;;
      Store.updateGroup(groupId, { scope: newScope });
      scopeBtn.classList.toggle(&#x27;main&#x27;, !isMain);
      scopeBtn.textContent = isMain ? &#x27;Supporting&#x27; : &#x27;Primary&#x27;;
      renderActiveDay();
      sessionSave();
    });

    // Removing an audience un-assigns its events on every day — the most
    // destructive click in the app, so it gets the same tap-again confirm
    // as event/note deletion.
    wireDeleteButton(item.querySelector(&#x27;.insp-group-remove&#x27;), () =&gt; {
      saveUndoState();
      Store.removeGroup(groupId);
      renderActiveDay();
      sessionSave();
      renderSettingsModal(modal);
    });
  });

  // Add Group
  const addGroupBtn = modal.querySelector(&#x27;#settings-add-group&#x27;);
  if (addGroupBtn) {
    addGroupBtn.addEventListener(&#x27;click&#x27;, () =&gt; {
      saveUndoState();
      Store.addGroup({ name: &#x27;New Audience&#x27; });
      sessionSave();
      renderSettingsModal(modal);
      const last = modal.querySelector(&#x27;.insp-group-item:last-of-type .insp-group-name&#x27;);
      if (last) { last.focus(); last.select(); }
    });
  }

  // Skin picker
  modal.querySelectorAll(&#x27;.skin-option&#x27;).forEach(function(opt) {

function wireDayField(item, selector, dayId, field, nullable) {
  const input = item.querySelector(selector);
  if (!input) return;
  const isTimeField = field === &#x27;startTime&#x27; || field === &#x27;endTime&#x27;;
  if (isTimeField) {
    // Day times commit on blur/Enter, not per keystroke: &quot;17&quot; typed on the
    // way to &quot;1700&quot; is a valid-looking 0017. Same validation as event times,
    // plus end &gt; start.
    const commitTime = () =&gt; {
      const day = Store.getDay(dayId);
      const raw = input.value.trim();
      const normalized = normalizeTime(raw);
      if (!raw || !isValidScheduleTime(normalized)) {
        input.value = (day &amp;&amp; day[field]) || &#x27;&#x27;;
        toast(&#x27;Times use 24-hour HHMM, e.g. 0730.&#x27;);
        return;
      }
      const other = day ? (field === &#x27;startTime&#x27; ? day.endTime : day.startTime) : &#x27;&#x27;;
      if (other) {
        const startMin = timeToMinutes(field === &#x27;startTime&#x27; ? normalized : other);
        const endMin = timeToMinutes(field === &#x27;endTime&#x27; ? normalized : other);
        if (endMin &lt;= startMin) {
          input.value = (day &amp;&amp; day[field]) || &#x27;&#x27;;
          toast(&#x27;End time must be after start time.&#x27;);
          return;
        }
      }
      input.value = normalized;
      if (day &amp;&amp; day[field] === normalized) return;
      saveUndoState();
      Store.updateDay(dayId, { [field]: normalized });
      renderActiveDay();
      sessionSave();
    };
    input.addEventListener(&#x27;blur&#x27;, commitTime);
    input.addEventListener(&#x27;keydown&#x27;, (e) =&gt; {
      if (e.key === &#x27;Enter&#x27;) { e.preventDefault(); input.blur(); }
    });
    return;
  }
  const eventType = input.type === &#x27;date&#x27; ? &#x27;change&#x27; : &#x27;input&#x27;;
  input.addEventListener(eventType, () =&gt; {
    const val = input.value.trim();
    if (field === &#x27;date&#x27; &amp;&amp; val &amp;&amp; !isValidScheduleDate(val)) {
      input.value = Store.getDay(dayId).date;
      toast(&#x27;Choose a valid calendar date.&#x27;);
      return;
    }
    saveUndoState();
    Store.updateDay(dayId, { [field]: nullable &amp;&amp; !val ? null : val });
    renderActiveDay();
    sessionSave();
    // Re-render inspector when date changes (reorders accordion); the
    // re-render replaces this input, so put focus back for arrow-key stepping.
    if (field === &#x27;date&#x27;) {
      renderInspector();
      const next = document.querySelector(&#x27;.insp-day-item[data-day-id=&quot;&#x27; + dayId + &#x27;&quot;] .insp-day-date&#x27;);
      if (next) next.focus();
    }
  });
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr + &#x27;T00:00:00&#x27;);
  if (isNaN(d.getTime())) return dateStr;
  const days = [&#x27;Sun&#x27;,&#x27;Mon&#x27;,&#x27;Tue&#x27;,&#x27;Wed&#x27;,&#x27;Thu&#x27;,&#x27;Fri&#x27;,&#x27;Sat&#x27;];
  const months = [&#x27;Jan&#x27;,&#x27;Feb&#x27;,&#x27;Mar&#x27;,&#x27;Apr&#x27;,&#x27;May&#x27;,&#x27;Jun&#x27;,&#x27;Jul&#x27;,&#x27;Aug&#x27;,&#x27;Sep&#x27;,&#x27;Oct&#x27;,&#x27;Nov&#x27;,&#x27;Dec&#x27;];
  return days[d.getDay()] + &#x27;, &#x27; + months[d.getMonth()] + &#x27; &#x27; + d.getDate();
}

function formatIsoLocalDate(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, &#x27;0&#x27;);
  const day = String(date.getDate()).padStart(2, &#x27;0&#x27;);
  return year + &#x27;-&#x27; + month + &#x27;-&#x27; + day;
}

function addDaysToIsoDate(dateStr, daysToAdd) {
  const base = new Date(dateStr + &#x27;T00:00:00&#x27;);
  if (isNaN(base.getTime())) return &#x27;&#x27;;
  base.setDate(base.getDate() + daysToAdd);
  return formatIsoLocalDate(base);
}

function getDefaultNewDayDate() {
  const activeDay = Store.getDay(Store.getActiveDay());
  if (activeDay &amp;&amp; activeDay.date) return addDaysToIsoDate(activeDay.date, 1);

  const datedDays = Store.getDays()
    .map(day =&gt; day.date)
    .filter(Boolean)
    .sort();
  if (datedDays.length &gt; 0) {
    return addDaysToIsoDate(datedDays[datedDays.length - 1], 1);
  }

  return formatIsoLocalDate(new Date());
}

function openDayEventSheetModal(focusInfo) {
  if (typeof isCurrentScheduleEditable === &#x27;function&#x27; &amp;&amp; !isCurrentScheduleEditable()) {
    toast(&#x27;Read-only. Click Edit.&#x27;);
    return;
  }
  const dayId = Store.getActiveDay();
  if (!dayId) {
    toast(&#x27;Add a day first.&#x27;);
    return;
  }
  const modal = document.getElementById(&#x27;dayEventSheetModalContent&#x27;);
  if (!modal) return;
  renderDayEventSheetModal(modal, dayId, focusInfo);
  openModal(&#x27;dayEventSheetModal&#x27;);
}

function closeDayEventSheetModal() {
  _daySheetSelectedEventId = null;
  closeModal(&#x27;dayEventSheetModal&#x27;);
}

function getDayEventSheetContext(dayId) {
  const day = Store.getDay(dayId);
  if (!day) return null;

  const days = Store.getDays();
  const dayIndex = days.findIndex(d =&gt; d.id === dayId) + 1;
  const events = Store.getEvents(dayId).slice()
    .sort((a, b) =&gt; timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
  const groups = Store.getGroups();
  const groupMap = {};
  groups.forEach(g =&gt; { groupMap[g.id] = g; });

  const { mainBands } = classifyEvents(events, groups);
  const overlapMap = {};
  mainBands.forEach(band =&gt; {
    if (band.overlappingMain &amp;&amp; band.overlappingMain.length &gt; 0) {
      overlapMap[band.event.id] = band.overlappingMain.map(evt =&gt; evt.title);
    }
  });

  return { day, dayIndex, events, groups, groupMap, overlapMap };
}

function getDaySheetTrackStatus(evt, group) {
  if (evt.isBreak) {
    return {
      label: &#x27;Break&#x27;,
      tone: &#x27;break&#x27;,
      title: &#x27;Breaks always appear in the main track.&#x27;
    };
  }
  if (group &amp;&amp; group.scope === &#x27;main&#x27;) {
    return {
      label: &#x27;Main&#x27;,
      tone: &#x27;primary&#x27;,
      title: &#x27;The selected Primary audience automatically places this event in the main track.&#x27;
    };
  }
  if (evt.isMainEvent) {
    return {
      label: &#x27;Main Override&#x27;,
      tone: &#x27;override&#x27;,
      title: &#x27;This supporting or unassigned event is manually shown in the main track.&#x27;
    };
  }
  if (group &amp;&amp; group.scope === &#x27;limited&#x27;) {
    return {
      label: &#x27;Side&#x27;,
      tone: &#x27;supporting&#x27;,
      title: &#x27;Supporting audiences stay in the side track unless Main Track is turned on.&#x27;
    };
  }
  return {
    label: &#x27;No Audience&#x27;,
    tone: &#x27;none&#x27;,
    title: &#x27;Choose an audience to place this event automatically, or turn on Main Track manually.&#x27;
  };
}

function resolveDaySheetSelectedEventId(ctx, dayId, preferredId) {
  const validIds = new Set(ctx.events.map(evt =&gt; evt.id));
  if (preferredId &amp;&amp; validIds.has(preferredId)) return preferredId;
  if (_daySheetSelectedEventId &amp;&amp; validIds.has(_daySheetSelectedEventId)) return _daySheetSelectedEventId;
  if (_selection.type === &#x27;event&#x27; &amp;&amp; _selection.dayId === dayId &amp;&amp; validIds.has(_selection.entityId)) return _selection.entityId;
  return ctx.events[0] ? ctx.events[0].id : null;
}

      html += &#x27;&lt;td class=&quot;day-sheet-check-cell&quot;&gt;&lt;label class=&quot;day-sheet-check-target&quot;&gt;&lt;input type=&quot;checkbox&quot; class=&quot;day-sheet-main-toggle&quot; data-event-id=&quot;&#x27; + esc(evt.id) + &#x27;&quot; data-focus=&quot;isMainEvent&quot;&#x27; + (evt.isMainEvent ? &#x27; checked&#x27; : &#x27;&#x27;) + &#x27; title=&quot;Turn this on only when a supporting or unassigned event should appear in the main track.&quot; aria-label=&quot;Main track override&quot;&gt;&lt;/label&gt;&lt;/td&gt;&#x27;;
    } else {
      html += &#x27;&lt;td class=&quot;day-sheet-check-cell&quot;&gt;&lt;span class=&quot;day-sheet-cell-note&quot; title=&quot;&#x27; + esc(evt.isBreak ? &#x27;Breaks always render in the main track.&#x27; : &#x27;The selected Primary audience already places this event in the main track.&#x27;) + &#x27;&quot;&gt;Auto&lt;/span&gt;&lt;/td&gt;&#x27;;
    }
    html += &#x27;&lt;td&gt;&lt;div class=&quot;day-sheet-track-cell&quot;&gt;&#x27;;
    html += &#x27;&lt;span class=&quot;day-sheet-badge day-sheet-badge-track day-sheet-badge-track-&#x27; + esc(trackStatus.tone) + &#x27;&quot; title=&quot;&#x27; + esc(trackStatus.title) + &#x27;&quot;&gt;&#x27; + esc(trackStatus.label) + &#x27;&lt;/span&gt;&#x27;;
    if (overlapNames.length &gt; 0) {
      html += &#x27;&lt;span class=&quot;day-sheet-badge warn&quot; title=&quot;&#x27; + esc(&#x27;Overlaps with &#x27; + overlapNames.join(&#x27;, &#x27;)) + &#x27;&quot;&gt;Overlap&lt;/span&gt;&#x27;;
    }
    html += &#x27;&lt;/div&gt;&lt;/td&gt;&#x27;;
    html += &#x27;&lt;td&gt;&lt;span class=&quot;day-sheet-duration&quot;&gt;&#x27; + esc(formatDuration(computeDuration(evt))) + &#x27;&lt;/span&gt;&lt;/td&gt;&#x27;;
    html += &#x27;&lt;/tr&gt;&#x27;;
  });

  html += &#x27;&lt;/tbody&gt;&lt;/table&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;day-sheet-detail-panel&quot; id=&quot;daySheetDetailPanel&quot;&gt;&#x27;;
  html += buildDaySheetDetailPanel(ctx, selectedEventId);
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;

  // Re-rendering replaces the scrolling table; carry the scroll position over
  // so toggling a row near the bottom of a long sheet doesn&#x27;t snap to the top.
  const previousWrap = modal.querySelector(&#x27;.day-sheet-table-wrap&#x27;);
  const previousScrollTop = previousWrap ? previousWrap.scrollTop : 0;
  modal.innerHTML = html;
  wireDayEventSheetModal(modal, dayId);
  const nextWrap = modal.querySelector(&#x27;.day-sheet-table-wrap&#x27;);
  if (nextWrap &amp;&amp; previousScrollTop) nextWrap.scrollTop = previousScrollTop;
  modal.querySelectorAll(&#x27;.day-sheet-row input, .day-sheet-row select&#x27;).forEach(input =&gt; {
    const field = input.dataset.field || input.dataset.focus;
    const labels = { startTime: &#x27;Start time&#x27;, endTime: &#x27;End time&#x27;, title: &#x27;Event title&#x27;, groupId: &#x27;Audience&#x27;,
      location: &#x27;Location&#x27;, isBreak: &#x27;Break&#x27;, isMainEvent: &#x27;Main track override&#x27; };
    const evt = ctx.events.find(item =&gt; item.id === input.dataset.eventId);
    input.setAttribute(&#x27;aria-label&#x27;, (labels[field] || field) + &#x27;: &#x27; + (evt ? evt.title : &#x27;event&#x27;));
  });

  if (focusInfo &amp;&amp; focusInfo.eventId &amp;&amp; focusInfo.field) {
    setTimeout(() =&gt; {
      const target = modal.querySelector(&#x27;[data-event-id=&quot;&#x27; + focusInfo.eventId + &#x27;&quot;][data-focus=&quot;&#x27; + focusInfo.field + &#x27;&quot;]&#x27;);
      if (target &amp;&amp; target.focus) {
        const active = document.activeElement;
        if (active &amp;&amp; active !== document.body &amp;&amp; active !== target &amp;&amp; modal.contains(active)) return;
        target.focus();
        if (target.select &amp;&amp; target.tagName !== &#x27;SELECT&#x27;) target.select();
      }
    }, 50);
  }
}

function wireDayEventSheetModal(modal, dayId) {
  wireEditabilityGuard(modal, &#x27;#daySheetClose, #daySheetOpenDetails&#x27;, () =&gt; renderDayEventSheetModal(modal, Store.getActiveDay()));
  modal.onkeydown = e =&gt; {
    if (e.key !== &#x27;Escape&#x27; || e.defaultPrevented) return;
    const input = e.target.closest(&#x27;input[data-event-id], textarea[data-event-id]&#x27;);
    if (!input || input.type === &#x27;checkbox&#x27;) return;
    const eventId = input.dataset.eventId;
    const evt = Store.getEvents(dayId).find(item =&gt; item.id === eventId);
    if (!evt) return;
    const field = input.dataset.field;
    const isTime = field === &#x27;startTime&#x27; || field === &#x27;endTime&#x27;;
    const fields = isTime ? Object.values(getDayEventSheetTimeInputs(modal, eventId)).filter(Boolean) : [input];
    if (!fields.some(el =&gt; el.value !== String(evt[el.dataset.field] || &#x27;&#x27;))) return;
    e.preventDefault();
    fields.forEach(el =&gt; { el.value = evt[el.dataset.field] || &#x27;&#x27;; el._daySheetNextFocus = null; });
    input.select();
    toast(&#x27;Cell edit canceled. Press Escape again to close Quick Edit.&#x27;);
  };
  const closeBtn = modal.querySelector(&#x27;#daySheetClose&#x27;);
  if (closeBtn) closeBtn.addEventListener(&#x27;click&#x27;, () =&gt; closeDayEventSheetModal());

  const addBtn = modal.querySelector(&#x27;#daySheetAddEvent&#x27;);
  if (addBtn) {
    addBtn.addEventListener(&#x27;click&#x27;, () =&gt; {
      saveUndoState();
      const groups = Store.getGroups();
      const defaultGroup = groups.find(g =&gt; g.scope === &#x27;main&#x27;) || groups[0];
      const day = Store.getDay(dayId);
      const events = Store.getEvents(dayId);
      // After the latest-ending event, not the latest-starting one — a short
      // event inside a long block otherwise lands the new row mid-block.
      const lastEnd = events.reduce((m, e) =&gt; Math.max(m, timeToMinutes(e.endTime)), -1);
      let startMin = lastEnd &gt;= 0 ? lastEnd : timeToMinutes((day &amp;&amp; day.startTime) || &#x27;0800&#x27;);
      if (!Number.isFinite(startMin)) startMin = 8 * 60;
      // Keep a valid final interval when the day already reaches midnight.
      startMin = Math.min(startMin, 1440 - TIME_INCREMENT);
      const startTime = minutesToTime(startMin);
      const endTime = minutesToTime(Math.min(startMin + 60, 1440));
      const evt = Store.addEvent(dayId, {
        title: &#x27;New Event&#x27;,
        startTime,
        endTime,
        groupId: defaultGroup ? defaultGroup.id : &#x27;&#x27;,
      });
      sessionSave();
      renderActiveDay();
      renderInspector();
      if (evt) renderDayEventSheetModal(modal, dayId, { eventId: evt.id, field: &#x27;title&#x27; });
      });
  }

  modal.querySelectorAll(&#x27;.day-sheet-row&#x27;).forEach(row =&gt; {
    const eventId = row.getAttribute(&#x27;data-event-id&#x27;);
    row.addEventListener(&#x27;click&#x27;, () =&gt; {
      syncDaySheetSelectionUI(modal, dayId, eventId);
    });
    row.addEventListener(&#x27;dblclick&#x27;, (e) =&gt; {
      if (e.target.closest(&#x27;input, select, textarea, button, label&#x27;)) return;
      openDaySheetFullDetails(dayId, eventId);
    });
  });

  modal.querySelectorAll(&#x27;.day-sheet-time-input&#x27;).forEach(input =&gt; {
    input.addEventListener(&#x27;focus&#x27;, () =&gt; {
      const eventId = input.getAttribute(&#x27;data-event-id&#x27;);
      syncDaySheetSelectionUI(modal, dayId, eventId);
    });
    input.addEventListener(&#x27;blur&#x27;, (e) =&gt; {
      const eventId = input.getAttribute(&#x27;data-event-id&#x27;);
      const focusInfo = input._daySheetNextFocus || null;
      input._daySheetNextFocus = null;
      // Normalize only parseable text; preserve exact minutes and reject blanks.
      if (isUsableTimeEntry(input.value)) input.value = normalizeTime(input.value);
      const relatedTarget = e.relatedTarget;
      const field = input.getAttribute(&#x27;data-field&#x27;);
      const { startInput, endInput } = getDayEventSheetTimeInputs(modal, eventId);
      const startCandidate = startInput ? normalizeTime(startInput.value) : &#x27;&#x27;;
      const endCandidate = endInput ? normalizeTime(endInput.value) : &#x27;&#x27;;
      const stagePairedEndEdit = field === &#x27;startTime&#x27;
        &amp;&amp; startCandidate
        &amp;&amp; endCandidate
        &amp;&amp; timeToMinutes(startCandidate) &gt;= timeToMinutes(endCandidate);
      const isSameRowTimeInput = (target) =&gt; !!(
        target &amp;&amp;
        target !== input &amp;&amp;
        target.classList &amp;&amp;
        target.classList.contains(&#x27;day-sheet-time-input&#x27;) &amp;&amp;
        target.getAttribute(&#x27;data-event-id&#x27;) === eventId
      );
      if (isSameRowTimeInput(relatedTarget) || isSameRowTimeInput(document.activeElement)) return;
      setTimeout(() =&gt; {
        if (!modal.contains(input)) return;
        if (isSameRowTimeInput(document.activeElement)) return;
        commitDayEventSheetTimeRange(modal, dayId, eventId, {
          focusInfo,
          allowStartTimeStaging: stagePairedEndEdit
        });
      }, stagePairedEndEdit ? 80 : 0);
    });
    input.addEventListener(&#x27;keydown&#x27;, (e) =&gt; {
      const fieldOrder = [&#x27;startTime&#x27;, &#x27;endTime&#x27;, &#x27;title&#x27;, &#x27;groupId&#x27;, &#x27;location&#x27;];
      const field = input.getAttribute(&#x27;data-field&#x27;);
      const index = fieldOrder.indexOf(field);
      if (e.key === &#x27;Tab&#x27;) {
        const nextIndex = index + (e.shiftKey ? -1 : 1);
        input._daySheetNextFocus = nextIndex &gt;= 0 &amp;&amp; nextIndex &lt; fieldOrder.length
          ? { eventId: input.getAttribute(&#x27;data-event-id&#x27;), field: fieldOrder[nextIndex] }
          : null;
      }
      if (e.key === &#x27;Enter&#x27;) {
        e.preventDefault();
        input._daySheetNextFocus = { eventId: input.getAttribute(&#x27;data-event-id&#x27;), field };
        input.blur();
      }
    });
  });

  modal.querySelectorAll(&#x27;.day-sheet-title-input, .day-sheet-location-input&#x27;).forEach(input =&gt; {
    input.addEventListener(&#x27;focus&#x27;, () =&gt; {
      const eventId = input.getAttribute(&#x27;data-event-id&#x27;);
      syncDaySheetSelectionUI(modal, dayId, eventId);
    });
    input.addEventListener(&#x27;change&#x27;, () =&gt; {
      const eventId = input.getAttribute(&#x27;data-event-id&#x27;);
      const field = input.getAttribute(&#x27;data-field&#x27;);
      const value = typeof input.value === &#x27;string&#x27; ? input.value.trim() : input.value;
      if (field === &#x27;title&#x27; &amp;&amp; !value) {
        const current = Store.getEvents(dayId).find(e =&gt; e.id === eventId);
        input.value = current ? current.title : &#x27;&#x27;;
        toast(&#x27;Events need a title — restored the previous one.&#x27;);
        return;
      }
      commitDayEventSheetUpdate(dayId, eventId, { [field]: value }, { rerenderModal: false });
    });
    if (input.tagName !== &#x27;TEXTAREA&#x27;) {
      input.addEventListener(&#x27;keydown&#x27;, (e) =&gt; {
        if (e.key === &#x27;Enter&#x27;) {
          e.preventDefault();
          input.blur();
        }
      });
    }
  });

  modal.querySelectorAll(&#x27;.day-sheet-group-select&#x27;).forEach(select =&gt; {
    select.addEventListener(&#x27;focus&#x27;, () =&gt; {
      const eventId = select.getAttribute(&#x27;data-event-id&#x27;);
      syncDaySheetSelectionUI(modal, dayId, eventId);
    });
    select.addEventListener(&#x27;change&#x27;, () =&gt; {
      const eventId = select.getAttribute(&#x27;data-event-id&#x27;);
      const currentEvent = Store.getEvents(dayId).find(e =&gt; e.id === eventId);
      if (!currentEvent) return;
      const updates = { groupId: select.value };
      commitDayEventSheetUpdate(dayId, eventId, updates, {
        rerenderModal: true,
        checkConflict: true,
        focusInfo: { eventId, field: &#x27;groupId&#x27; }
      });
    });
  });

  modal.querySelectorAll(&#x27;.day-sheet-break-toggle&#x27;).forEach(input =&gt; {
    input.addEventListener(&#x27;focus&#x27;, () =&gt; {
      const eventId = input.getAttribute(&#x27;data-event-id&#x27;);
      syncDaySheetSelectionUI(modal, dayId, eventId);
    });
    input.addEventListener(&#x27;change&#x27;, () =&gt; {
      const eventId = input.getAttribute(&#x27;data-event-id&#x27;);
      commitDayEventSheetUpdate(dayId, eventId, { isBreak: input.checked }, {
        rerenderModal: true, checkConflict: true, focusInfo: { eventId, field: &#x27;isBreak&#x27; },
      });
    });
  });

  modal.querySelectorAll(&#x27;.day-sheet-main-toggle&#x27;).forEach(input =&gt; {
    input.addEventListener(&#x27;focus&#x27;, () =&gt; {
      const eventId = input.getAttribute(&#x27;data-event-id&#x27;);
      syncDaySheetSelectionUI(modal, dayId, eventId);
    });
    input.addEventListener(&#x27;change&#x27;, () =&gt; {
      const eventId = input.getAttribute(&#x27;data-event-id&#x27;);
      commitDayEventSheetUpdate(dayId, eventId, { isMainEvent: input.checked }, {
        rerenderModal: true, checkConflict: true, focusInfo: { eventId, field: &#x27;isMainEvent&#x27; },
      });
    });
  });

  wireDaySheetDetailPanel(modal, dayId);
}

function wireDaySheetDetailPanel(modal, dayId) {
  const detailPanel = modal.querySelector(&#x27;#daySheetDetailPanel&#x27;);
  if (!detailPanel) return;

  const openDetailsBtn = detailPanel.querySelector(&#x27;#daySheetOpenDetails&#x27;);
  if (openDetailsBtn) {
    openDetailsBtn.addEventListener(&#x27;click&#x27;, () =&gt; {
      const eventId = openDetailsBtn.getAttribute(&#x27;data-event-id&#x27;);
      if (eventId) openDaySheetFullDetails(dayId, eventId);
    });
  }

  detailPanel.querySelectorAll(&#x27;input[type=&quot;text&quot;], textarea&#x27;).forEach(input =&gt; {
    input.addEventListener(&#x27;change&#x27;, () =&gt; {
      const eventId = input.getAttribute(&#x27;data-event-id&#x27;);
      const field = input.getAttribute(&#x27;data-field&#x27;);
      const value = typeof input.value === &#x27;string&#x27; ? input.value.trim() : input.value;
      commitDayEventSheetUpdate(dayId, eventId, { [field]: value }, { rerenderModal: false });
    });
    if (input.tagName !== &#x27;TEXTAREA&#x27;) {
      input.addEventListener(&#x27;keydown&#x27;, (e) =&gt; {
        if (e.key === &#x27;Enter&#x27;) {
          e.preventDefault();
          input.blur();
        }
      });
    }
  });

  const deleteBtn = detailPanel.querySelector(&#x27;#daySheetDeleteSelected&#x27;);
  if (deleteBtn) {
    wireDeleteButton(deleteBtn, () =&gt; {
      const eventId = deleteBtn.getAttribute(&#x27;data-event-id&#x27;);
      const events = Store.getEvents(dayId).slice()
        .sort((a, b) =&gt; timeToMinutes(a.startTime) - timeToMinutes(b.startTime));
      const index = events.findIndex(evt =&gt; evt.id === eventId);
      const nextEventId = (events[index + 1] &amp;&amp; events[index + 1].id) || (events[index - 1] &amp;&amp; events[index - 1].id) || null;
      saveUndoState();
      Store.removeEvent(dayId, eventId);
      sessionSave();
      renderActiveDay();
      renderInspector();
      renderDayEventSheetModal(modal, dayId, nextEventId ? { eventId: nextEventId } : null);
    });
  }
}

function commitDayEventSheetUpdate(dayId, eventId, updates, options) {
  if (typeof isCurrentScheduleEditable === &#x27;function&#x27; &amp;&amp; !isCurrentScheduleEditable()) return;
  saveUndoState();
  Store.updateEvent(dayId, eventId, updates);
  renderActiveDay();
  renderInspector();
  sessionSave();
  if (options &amp;&amp; options.checkConflict) checkTimeConflict(dayId, eventId);
  if (!options || options.rerenderModal !== false) {
    const modal = document.getElementById(&#x27;dayEventSheetModalContent&#x27;);
    if (modal) renderDayEventSheetModal(modal, dayId, options &amp;&amp; options.focusInfo);
  }
}

function getDayEventSheetTimeInputs(modal, eventId) {
  return {
    startInput: modal.querySelector(&#x27;.day-sheet-time-input[data-event-id=&quot;&#x27; + eventId + &#x27;&quot;][data-field=&quot;startTime&quot;]&#x27;),
    endInput: modal.querySelector(&#x27;.day-sheet-time-input[data-event-id=&quot;&#x27; + eventId + &#x27;&quot;][data-field=&quot;endTime&quot;]&#x27;),
  };
}

function commitDayEventSheetTimeRange(modal, dayId, eventId, options) {
  const evt = Store.getEvents(dayId).find(item =&gt; item.id === eventId);
  if (!evt) return;

  const { startInput, endInput } = getDayEventSheetTimeInputs(modal, eventId);
  if ((startInput &amp;&amp; !isUsableTimeEntry(startInput.value)) || (endInput &amp;&amp; !isUsableTimeEntry(endInput.value))) {
    if (startInput) startInput.value = evt.startTime;
    if (endInput) endInput.value = evt.endTime;
    toast(&#x27;Times use 24-hour HHMM, e.g. 0730.&#x27;);
    return;
  }
  const startTime = startInput ? normalizeTime(startInput.value) : evt.startTime;
  const endTime = endInput ? normalizeTime(endInput.value) : evt.endTime;
  const updates = { startTime, endTime };

  if (startTime === evt.startTime &amp;&amp; endTime === evt.endTime) {
    // Unchanged: skip the undo entry, the dirty write, the conflict toast and
    // the full re-render — just honor the requested focus.
    if (startInput) startInput.value = startTime;
    if (endInput) endInput.value = endTime;
    const focusInfo = options &amp;&amp; options.focusInfo;
    if (focusInfo &amp;&amp; focusInfo.eventId &amp;&amp; focusInfo.field) {
      const target = modal.querySelector(&#x27;[data-event-id=&quot;&#x27; + focusInfo.eventId + &#x27;&quot;][data-focus=&quot;&#x27; + focusInfo.field + &#x27;&quot;]&#x27;);
      if (target &amp;&amp; target.focus) target.focus();
    }
    return;
  }

  if (!eventTimeRangeIsValid(dayId, eventId, updates)) {
    if (options &amp;&amp; options.allowStartTimeStaging &amp;&amp; startTime !== evt.startTime &amp;&amp; endTime === evt.endTime) {
      if (startInput) startInput.value = startTime;
      if (endInput) endInput.value = endTime;
      setTimeout(() =&gt; {
        const current = getDayEventSheetTimeInputs(modal, eventId);
        const currentStart = current.startInput ? normalizeTime(current.startInput.value) : &#x27;&#x27;;
        const currentEnd = current.endInput ? normalizeTime(current.endInput.value) : &#x27;&#x27;;
        if (currentStart === startTime &amp;&amp; currentEnd === endTime) {
          commitDayEventSheetTimeRange(modal, dayId, eventId, {
            focusInfo: options.focusInfo
          });
        }
      }, 140);
      return;
    }
    if (startInput) startInput.value = evt.startTime;
    if (endInput) endInput.value = evt.endTime;
    toast(&#x27;End time must be after start time.&#x27;);
    return;
  }

  if (startInput) startInput.value = startTime;
  if (endInput) endInput.value = endTime;
  commitDayEventSheetUpdate(dayId, eventId, updates, {
    rerenderModal: true,
    checkConflict: true,
    focusInfo: options &amp;&amp; options.focusInfo
  });
}

// ── Face 2: Event Inspector ────────────────────────────────────────────────

function renderEventInspector(panel, dayId, eventId) {
  const evt = Store.getEvents(dayId).find(e =&gt; e.id === eventId);
  if (!evt) { renderScheduleSetup(panel); return; }

  const groups = Store.getGroups();
  const evtGroup = Store.getGroup(evt.groupId);
  const groupIsMain = evtGroup &amp;&amp; evtGroup.scope === &#x27;main&#x27;;
  const readOnly = typeof isCurrentScheduleEditable === &#x27;function&#x27; ? !isCurrentScheduleEditable() : false;
  const textReadOnly = readOnly ? &#x27; readonly&#x27; : &#x27;&#x27;;
  const disabledAttr = readOnly ? &#x27; disabled&#x27; : &#x27;&#x27;;

  let html = &#x27;&lt;div class=&quot;insp-header&quot;&gt;&lt;h3 style=&quot;margin:0;&quot;&gt;Event&lt;/h3&gt;&lt;button class=&quot;insp-close&quot; id=&quot;insp-close&quot; title=&quot;Back to Setup&quot;&gt;\u2715&lt;/button&gt;&lt;/div&gt;&#x27;;
  if (readOnly) {
    html += &#x27;&lt;div class=&quot;insp-readonly-note&quot;&gt;Read-only. Click &lt;strong&gt;Edit&lt;/strong&gt;.&lt;/div&gt;&#x27;;
  }

  // Check for main-on-main overlaps
  const allEvents = Store.getEvents(dayId);
  const { mainBands } = classifyEvents(allEvents, groups);
  const thisBand = mainBands.find(b =&gt; b.event.id === eventId);
  const sharedExceptions = getSharedEventExceptions(evt, allEvents, groups);
  const sharedOverlaps = getOverlappingSharedEvents(evt, allEvents, groups);
  const sharedNames = summarizeDisplayList(sharedExceptions.attendeeNames, 4);
  const eventNames = summarizeDisplayList(evt.attendees ? evt.attendees.split(/\s*(?:,|;|\n|\/)\s*/).map(name =&gt; name.trim()).filter(Boolean) : [], 4);
  if (thisBand &amp;&amp; thisBand.overlappingMain &amp;&amp; thisBand.overlappingMain.length &gt; 0) {
    const names = thisBand.overlappingMain.map(m =&gt; esc(m.title)).join(&#x27;, &#x27;);
    html += &#x27;&lt;div class=&quot;insp-overlap-warn&quot;&gt;Overlaps with &#x27; + names + &#x27;&lt;/div&gt;&#x27;;
  }
  if (sharedExceptions.groupNames.length &gt; 0) {
    html += &#x27;&lt;div class=&quot;insp-context-note&quot;&gt;Exceptions active during this block: &#x27; + esc(summarizeDisplayList(sharedExceptions.groupNames, 3)) + &#x27;.&#x27;;
    if (sharedNames) html += &#x27; Named people: &#x27; + esc(sharedNames) + &#x27;.&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
  } else if (sharedOverlaps.titles.length &gt; 0) {
    const audienceLabel = evtGroup ? evtGroup.name : &#x27;this audience&#x27;;
    html += &#x27;&lt;div class=&quot;insp-context-note&quot;&gt;This runs during &#x27; + esc(summarizeDisplayList(sharedOverlaps.titles, 2)) + &#x27;. It will read as an exception for &#x27; + esc(audienceLabel) + &#x27;.&#x27;;
    if (eventNames) html += &#x27; Named people: &#x27; + esc(eventNames) + &#x27;.&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
  }

  const trackLabel = evt.isBreak
    ? &#x27;Break&#x27;
    : (groupIsMain
        ? &#x27;Main&#x27;
        : (evt.isMainEvent ? &#x27;Main Override&#x27; : (evtGroup ? &#x27;Side&#x27; : &#x27;No Audience&#x27;)));
  html += &#x27;&lt;div class=&quot;insp-summary-pills&quot;&gt;&#x27;;
  html += &#x27;&lt;span class=&quot;insp-summary-pill insp-summary-pill-accent&quot;&gt;&#x27; + esc(evt.startTime + &#x27;–&#x27; + evt.endTime) + &#x27;&lt;/span&gt;&#x27;;
  html += &#x27;&lt;span class=&quot;insp-summary-pill&quot;&gt;&#x27; + esc(evtGroup ? evtGroup.name : &#x27;No audience&#x27;) + &#x27;&lt;/span&gt;&#x27;;
  html += &#x27;&lt;span class=&quot;insp-summary-pill&quot;&gt;&#x27; + esc(trackLabel) + &#x27;&lt;/span&gt;&#x27;;

    html += &#x27;&lt;option value=&quot;&#x27; + esc(g.id) + &#x27;&quot;&#x27; + (g.id === evt.groupId ? &#x27; selected&#x27; : &#x27;&#x27;) + &#x27;&gt;&#x27; + esc(g.name) + &#x27;&lt;/option&gt;&#x27;;

  html += &#x27;&lt;label for=&quot;insp-evt-desc&quot;&gt;Notes&lt;/label&gt;&#x27;;

  html += &#x27;&lt;label for=&quot;insp-evt-loc&quot;&gt;Location&lt;/label&gt;&#x27;;

  html += &#x27;&lt;label for=&quot;insp-evt-poc&quot;&gt;POC&lt;/label&gt;&#x27;;

  html += &#x27;&lt;div class=&quot;insp-toggle-section&quot;&gt;&#x27;;
  html += &#x27;&lt;label class=&quot;insp-toggle-label&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;insp-evt-break&quot;&#x27; + (evt.isBreak ? &#x27; checked&#x27; : &#x27;&#x27;) + disabledAttr + &#x27;&gt; Break&lt;/label&gt;&#x27;;

    html += &#x27;&lt;label class=&quot;insp-toggle-label&quot;&gt;&lt;input type=&quot;checkbox&quot; id=&quot;insp-evt-main&quot;&#x27; + (evt.isMainEvent ? &#x27; checked&#x27; : &#x27;&#x27;) + disabledAttr + &#x27;&gt; Main Track&lt;/label&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
  }

  // Delete — in sticky zone
  html += &#x27;&lt;div class=&quot;insp-delete-zone&quot;&gt;&lt;button class=&quot;delete-btn&quot; id=&quot;insp-evt-delete&quot;&#x27; + disabledAttr + &#x27;&gt;Delete Event&lt;/button&gt;&lt;/div&gt;&#x27;;

  panel.innerHTML = html;
  wireEventInspector(panel, dayId, eventId);
}

function wireEventInspector(panel, dayId, eventId) {
  const editable = typeof isCurrentScheduleEditable === &#x27;function&#x27; ? isCurrentScheduleEditable() : true;
  function autoCommit(selector, field, isSelect) {
    const el = panel.querySelector(selector);
    if (!el) return;
    const eventType = isSelect ? &#x27;change&#x27; : &#x27;input&#x27;;
    el.addEventListener(eventType, () =&gt; {
      saveUndoState();
      let val;
      if (el.type === &#x27;checkbox&#x27;) val = el.checked;
      else val = typeof el.value === &#x27;string&#x27; ? el.value.trim() : el.value;
      Store.updateEvent(dayId, eventId, { [field]: val });
      renderActiveDay();
      sessionSave();
      if (field === &#x27;isBreak&#x27; || field === &#x27;isMainEvent&#x27;) {
        renderInspector();
        const next = panel.querySelector(selector);
        if (next) next.focus();
      }
    });
  }

  // Close button — back to schedule setup
  const closeBtn = panel.querySelector(&#x27;#insp-close&#x27;);
  if (closeBtn) closeBtn.addEventListener(&#x27;click&#x27;, () =&gt; selectEntity(null));

  if (!editable) return;

  autoCommit(&#x27;#insp-evt-title&#x27;, &#x27;title&#x27;);
  wireRequiredTextField(panel.querySelector(&#x27;#insp-evt-title&#x27;), &#x27;Untitled event&#x27;, (value) =&gt; {
    Store.updateEvent(dayId, eventId, { title: value });
  }, &#x27;Events need a title — restored the previous one.&#x27;);
  wireTimeInput(panel, &#x27;#insp-evt-start&#x27;, &#x27;startTime&#x27;, dayId, eventId);
  wireTimeInput(panel, &#x27;#insp-evt-end&#x27;, &#x27;endTime&#x27;, dayId, eventId);
  autoCommit(&#x27;#insp-evt-attendees&#x27;, &#x27;attendees&#x27;);
  autoCommit(&#x27;#insp-evt-desc&#x27;, &#x27;description&#x27;);
  autoCommit(&#x27;#insp-evt-loc&#x27;, &#x27;location&#x27;);
  autoCommit(&#x27;#insp-evt-poc&#x27;, &#x27;poc&#x27;);
  autoCommit(&#x27;#insp-evt-break&#x27;, &#x27;isBreak&#x27;, true);
  wireBandEventFields(panel, dayId, eventId);

  // Highlight override (only present for limited-scope groups)
  const mainCheckbox = panel.querySelector(&#x27;#insp-evt-main&#x27;);
  if (mainCheckbox) {
    autoCommit(&#x27;#insp-evt-main&#x27;, &#x27;isMainEvent&#x27;, true);
  }

  // Group change — auto-derive isMainEvent from group scope and re-render inspector
  const groupSelect = panel.querySelector(&#x27;#insp-evt-group&#x27;);
  if (groupSelect) {
    groupSelect.addEventListener(&#x27;change&#x27;, () =&gt; {
      saveUndoState();
      const updates = { groupId: groupSelect.value };
      Store.updateEvent(dayId, eventId, updates);
      renderActiveDay();
      sessionSave();
      renderInspector();
      // renderInspector rebuilt the select; keep keyboard focus on it.
      const nextSelect = document.getElementById(&#x27;insp-evt-group&#x27;);
      if (nextSelect) nextSelect.focus();
      checkTimeConflict(dayId, eventId);
    });
  }

  wireDeleteButton(panel.querySelector(&#x27;#insp-evt-delete&#x27;), () =&gt; {
    saveUndoState();
    Store.removeEvent(dayId, eventId);
    sessionSave();
    selectEntity(null);
    renderActiveDay();
  });
}

// ── Face 3: Note Inspector ─────────────────────────────────────────────────

  if (readOnly) {
    html += &#x27;&lt;div class=&quot;insp-readonly-note&quot;&gt;Read-only. Click &lt;strong&gt;Edit&lt;/strong&gt;.&lt;/div&gt;&#x27;;

function wireNoteInspector(panel, dayId, noteId) {

// ── Delete confirmation pattern ────────────────────────────────────────────

const LOGO_MAX_BYTES = 2 * 1024 * 1024;

function wireDeleteButton(btn, onConfirm) {
  if (!btn) return;
  let armed = false;
  // Per-button timer: a shared module timer let arming one Delete cancel
  // another&#x27;s disarm, leaving &quot;Tap again&quot; armed indefinitely.
  let timer = null;
  const defaultLabel = btn.getAttribute(&#x27;data-delete-label&#x27;) || (btn.id.includes(&#x27;note&#x27;) ? &#x27;Delete Note&#x27; : &#x27;Delete Event&#x27;);
  const armedLabel = btn.getAttribute(&#x27;data-delete-armed-label&#x27;) || &#x27;Tap again to delete&#x27;;
  btn.addEventListener(&#x27;click&#x27;, () =&gt; {
    if (armed) {
      clearTimeout(timer);
      onConfirm();
      return;
    }
    armed = true;
    btn.textContent = armedLabel;
    btn.classList.add(&#x27;confirm&#x27;);
    clearTimeout(timer);
    timer = setTimeout(() =&gt; {
      armed = false;
      btn.textContent = defaultLabel;
      btn.classList.remove(&#x27;confirm&#x27;);
    }, 3000);
  });
}

function clearDeleteTimer() {
  if (_deleteTimer) { clearTimeout(_deleteTimer); _deleteTimer = null; }
}

// ── Rendering helpers ──────────────────────────────────────────────────────

function renderActiveDay() {
  const dayId = Store.getActiveDay();
  if (dayId) {
    renderDay(dayId);
  } else {
    // Otherwise the previous schedule&#x27;s (or a deleted day&#x27;s) page stays on
    // screen looking live — and browser-menu print would print it.
    const container = document.getElementById(&#x27;scheduleContainer&#x27;);
    if (container) {
      container.innerHTML = &#x27;&lt;div class=&quot;empty-state&quot;&gt;&lt;strong&gt;No days yet.&lt;/strong&gt; Click &lt;strong&gt;+ Day&lt;/strong&gt; to start this schedule.&lt;/div&gt;&#x27;;
    }
  }
  renderDayTabs();
  syncPreviewSelection();
}

function renderDayTabs() {
  const tabs = document.getElementById(&#x27;dayTabs&#x27;);
  if (!tabs) return;
  const days = Store.getDays();
  const activeDay = Store.getActiveDay();
  let html = &#x27;&#x27;;
  days.forEach((day, i) =&gt; {
    const label = day.label || (day.date ? formatDateShort(day.date) : &#x27;Day &#x27; + (i + 1));
    const active = day.id === activeDay ? &#x27; active&#x27; : &#x27;&#x27;;
    html += &#x27;&lt;button class=&quot;day-tab&#x27; + active + &#x27;&quot; data-day-id=&quot;&#x27; + esc(day.id) + &#x27;&quot; aria-pressed=&quot;&#x27; + (day.id === activeDay) + &#x27;&quot; aria-controls=&quot;scheduleContainer&quot;&gt;&#x27; + esc(label) + &#x27;&lt;/button&gt;&#x27;;
  });
  tabs.innerHTML = html;

  tabs.querySelectorAll(&#x27;.day-tab&#x27;).forEach(tab =&gt; {
    tab.addEventListener(&#x27;click&#x27;, () =&gt; {
      Store.setActiveDay(tab.getAttribute(&#x27;data-day-id&#x27;));
      selectEntity(null);
      renderActiveDay();
    });
  });
}

// ── Toolbar wiring ─────────────────────────────────────────────────────────

function wireToolbar() {
  const addBtn = document.getElementById(&#x27;addEventBtn&#x27;);
  if (addBtn) addBtn.onclick = () =&gt; {
    const dayId = Store.getActiveDay();
    if (dayId) openAddEvent(dayId);
    else toast(&#x27;Add a day first.&#x27;);
  };

  const addNoteBtn = document.getElementById(&#x27;addNoteBtn&#x27;);
  if (addNoteBtn) addNoteBtn.onclick = () =&gt; {
    const dayId = Store.getActiveDay();
    if (dayId) openAddNote(dayId);
    else toast(&#x27;Add a day first.&#x27;);
  };

  const addDayBtn = document.getElementById(&#x27;addDayBtn&#x27;);
  if (addDayBtn) addDayBtn.onclick = () =&gt; {
    if (typeof isCurrentScheduleEditable === &#x27;function&#x27; &amp;&amp; !isCurrentScheduleEditable()) {
      toast(&#x27;Read-only. Click Edit.&#x27;);
      return;
    }
    saveUndoState();
    const day = Store.addDay({ date: getDefaultNewDayDate(), startTime: &#x27;0700&#x27;, endTime: &#x27;1630&#x27; });
    Store.setActiveDay(day.id);
    _expandedDayId = day.id;
    sessionSave();
    renderActiveDay();
    selectEntity(null); // show days face with new day expanded
  };

  const daySheetBtn = document.getElementById(&#x27;daySheetBtn&#x27;);
  if (daySheetBtn) daySheetBtn.onclick = () =&gt; openDayEventSheetModal();

  // Overflow menu toggle
  const overflowBtn = document.getElementById(&#x27;overflowBtn&#x27;);
  const overflowMenu = document.getElementById(&#x27;overflowMenu&#x27;);
  if (overflowBtn &amp;&amp; overflowMenu) {
    const syncOverflow = () =&gt; overflowBtn.setAttribute(&#x27;aria-expanded&#x27;, String(overflowMenu.classList.contains(&#x27;open&#x27;)));
    overflowBtn.onclick = (e) =&gt; {
      e.stopPropagation();
      overflowMenu.classList.toggle(&#x27;open&#x27;);
      syncOverflow();
    };
    document.addEventListener(&#x27;click&#x27;, (e) =&gt; {
      if (!e.target.closest(&#x27;#overflowMenu&#x27;)) overflowMenu.classList.remove(&#x27;open&#x27;);
      syncOverflow();
    });
    overflowMenu.addEventListener(&#x27;keydown&#x27;, e =&gt; {
      if (e.key === &#x27;Escape&#x27; &amp;&amp; overflowMenu.classList.contains(&#x27;open&#x27;)) {
        e.preventDefault();
        overflowMenu.classList.remove(&#x27;open&#x27;);
        syncOverflow();
        overflowBtn.focus();
      } else if (e.key === &#x27;ArrowDown&#x27; &amp;&amp; e.target === overflowBtn) {
        e.preventDefault();
        overflowMenu.classList.add(&#x27;open&#x27;);
        syncOverflow();
        const first = overflowMenu.querySelector(&#x27;.tb-overflow-item&#x27;);
        if (first) first.focus();
      }
    });
  }

  const customizeBtn = document.getElementById(&#x27;customizeBtn&#x27;);
  if (customizeBtn) customizeBtn.onclick = () =&gt; openSettingsModal();

  const printBtn = document.getElementById(&#x27;printBtn&#x27;);
  if (printBtn) printBtn.onclick = () =&gt; { overflowMenu.classList.remove(&#x27;open&#x27;); openPrintReview(); };

  // Back to library
  const backBtn = document.getElementById(&#x27;tbBack&#x27;);
  if (backBtn) backBtn.onclick = () =&gt; returnToLibrary();

  // Versions panel
  const versionsMenuBtn = document.getElementById(&#x27;versionsMenuBtn&#x27;);
  if (versionsMenuBtn) versionsMenuBtn.onclick = () =&gt; { overflowMenu.classList.remove(&#x27;open&#x27;); openVersionPanel(); };

  const saveScheduleFileBtn = document.getElementById(&#x27;saveScheduleFileBtn&#x27;);
  if (saveScheduleFileBtn) saveScheduleFileBtn.onclick = () =&gt; { overflowMenu.classList.remove(&#x27;open&#x27;); saveScheduleWorkbookFile(); };

  // Help button in overflow
  const helpBtn = document.getElementById(&#x27;helpBtn&#x27;);
  if (helpBtn) helpBtn.onclick = () =&gt; { overflowMenu.classList.remove(&#x27;open&#x27;); openHelpModal(); };

  // Toolbar title — editable inline, syncs with Store
  const tbTitle = document.getElementById(&#x27;tbTitle&#x27;);
  if (tbTitle) {
    tbTitle.value = Store.getTitle();
    tbTitle.addEventListener(&#x27;input&#x27;, () =&gt; {
      if (typeof isCurrentScheduleEditable === &#x27;function&#x27; &amp;&amp; !isCurrentScheduleEditable()) return;
      saveUndoState();
      Store.setTitle(tbTitle.value.trim());
      renderActiveDay();
      sessionSave();
    });
    tbTitle.addEventListener(&#x27;change&#x27;, async () =&gt; {
      const oldFile = getCurrentFileName();
      if (!oldFile || !hasDirectoryAccess()) return;
      const newFile = scheduleNameToSlug(tbTitle.value.trim()) + &#x27;.json&#x27;;
      if (newFile !== oldFile) {
        const renamed = await renameScheduleFile(oldFile, newFile);
        if (renamed) {
          setCurrentFile(newFile, getLastSavedAt());
        } else {
          const oldData = await readScheduleFile(oldFile, { suppressErrors: true });
          const restoredTitle = oldData &amp;&amp; oldData.current ? oldData.current.title : Store.getTitle();
          Store.setTitle(restoredTitle);
          tbTitle.value = restoredTitle;
          renderActiveDay();
          sessionSave({ skipDirty: true });
        }
      }
    });
  }

  // Settings modal — close on backdrop click
  const settingsOverlay = document.getElementById(&#x27;settingsModal&#x27;);
  if (settingsOverlay) {
    settingsOverlay.addEventListener(&#x27;click&#x27;, (e) =&gt; {
      if (e.target === settingsOverlay) closeSettingsModal();
    });
  }

  const daySheetOverlay = document.getElementById(&#x27;dayEventSheetModal&#x27;);
  if (daySheetOverlay) {
    // A drag-select that starts inside a cell and ends over the backdrop
    // dispatches its click to the overlay; only a press that began on the
    // backdrop counts as &quot;close&quot;.
    let pressStartedOnBackdrop = false;
    daySheetOverlay.addEventListener(&#x27;mousedown&#x27;, (e) =&gt; { pressStartedOnBackdrop = e.target === daySheetOverlay; });
    daySheetOverlay.addEventListener(&#x27;click&#x27;, (e) =&gt; {
      if (e.target === daySheetOverlay &amp;&amp; pressStartedOnBackdrop) closeDayEventSheetModal();
      pressStartedOnBackdrop = false;
    });
  }

  // Escape key closes settings modal
  document.addEventListener(&#x27;keydown&#x27;, (e) =&gt; {
    if (e.key === &#x27;Escape&#x27; &amp;&amp; !e.defaultPrevented) {
      const overlay = document.getElementById(&#x27;settingsModal&#x27;);
      if (overlay &amp;&amp; overlay.classList.contains(&#x27;active&#x27;)) {
        closeSettingsModal();
      }
    }
  });

  // Initial inspector render
  renderInspector();
}

function syncToolbarTitle() {
  const tbTitle = document.getElementById(&#x27;tbTitle&#x27;);
  if (tbTitle) tbTitle.value = Store.getTitle();
  if (typeof renderWorkbookSwitcher === &#x27;function&#x27;) renderWorkbookSwitcher();
}

// ── Add event / note ───────────────────────────────────────────────────────

function openAddEvent(dayId) {
  if (typeof isCurrentScheduleEditable === &#x27;function&#x27; &amp;&amp; !isCurrentScheduleEditable()) {
    toast(&#x27;Read-only. Click Edit.&#x27;);
    return;
  }
  saveUndoState();
  const groups = Store.getGroups();
  const defaultGroup = groups.find(g =&gt; g.scope === &#x27;main&#x27;) || groups[0];
  // Start where the day currently ends (or at the day&#x27;s start), not at a
  // fixed 0800 that overlaps whatever is already there.
  const day = Store.getDay(dayId);
  const lastEnd = Store.getEvents(dayId).reduce((m, e) =&gt; Math.max(m, timeToMinutes(e.endTime)), -1);
  let startMin = lastEnd &gt;= 0 ? lastEnd : timeToMinutes((day &amp;&amp; day.startTime) || &#x27;0800&#x27;);
  if (!Number.isFinite(startMin)) startMin = 8 * 60;
  startMin = Math.min(startMin, 1440 - TIME_INCREMENT);
  const evt = Store.addEvent(dayId, {
    title: &#x27;New Event&#x27;,
    startTime: minutesToTime(startMin),
    endTime: minutesToTime(Math.min(startMin + 60, 1440)),
    groupId: defaultGroup ? defaultGroup.id : &#x27;&#x27;,
  });
  sessionSave();
  renderActiveDay();
  if (evt) {
    selectEntity(&#x27;event&#x27;, dayId, evt.id);
    checkTimeConflict(dayId, evt.id);
    const titleInput = document.getElementById(&#x27;insp-evt-title&#x27;);
    if (titleInput) { titleInput.focus(); titleInput.select(); }
  }
}

function openAddNote(dayId) {
