// ── Time input helpers ─────────────────────────────────────────────────────

// Snap minutes to nearest 15-minute increment
function snapToQuarter(timeStr) {
  const cleaned = timeStr.replace(/[^0-9]/g, &#x27;&#x27;).padStart(4, &#x27;0&#x27;).slice(0, 4);
  let h = parseInt(cleaned.slice(0, 2), 10);
  let m = parseInt(cleaned.slice(2, 4), 10);
  if (isNaN(h) || h &gt; 24) h = 0;
  if (isNaN(m) || m &gt; 59) m = 0;
  // Round to nearest 15; 2359 rounds up to 2400 (a valid end-of-day end
  // time — the range check rejects it as a start).
  m = Math.round(m / 15) * 15;
  if (m === 60) { m = 0; h = Math.min(h + 1, 24); }
  return String(h).padStart(2, &#x27;0&#x27;) + String(m).padStart(2, &#x27;0&#x27;);
}

function checkTimeConflict(dayId, eventId) {
  const groups = Store.getGroups();
  const { mainBands } = classifyEvents(Store.getEvents(dayId), groups);
  const band = mainBands.find(b =&gt; b.event.id === eventId);
  if (!band || band.event.isBreak || band.tier !== &#x27;main&#x27;) return;
  if (band.overlappingMain &amp;&amp; band.overlappingMain.length &gt; 0) {
    const names = band.overlappingMain.map(c =&gt; c.title).join(&#x27;, &#x27;);
    toast(&#x27;Schedule conflict: overlaps with &#x27; + names);
  }
}

function eventTimeRangeIsValid(dayId, eventId, updates) {
  const evt = Store.getEvents(dayId).find(item =&gt; item.id === eventId);
  if (!evt) return true;
  const nextStart = updates &amp;&amp; updates.startTime != null ? updates.startTime : evt.startTime;
  const nextEnd = updates &amp;&amp; updates.endTime != null ? updates.endTime : evt.endTime;
  return timeToMinutes(nextEnd) &gt; timeToMinutes(nextStart);
}

// A field the record cannot exist without. The live &#x27;input&#x27; handlers write
// &#x27;&#x27; to the Store while the user retypes; on blur an empty field restores the
// last non-empty value (or the fallback) so nothing is persisted blank.
function wireRequiredTextField(input, fallback, commit, message) {
  if (!input) return;
  let last = input.value.trim() || fallback;
  input.addEventListener(&#x27;input&#x27;, () =&gt; {
    if (input.value.trim()) last = input.value.trim();
  });
  input.addEventListener(&#x27;blur&#x27;, () =&gt; {
    if (input.value.trim() || !last) return;
    input.value = last;
    commit(last);
    renderActiveDay();
    sessionSave();
    toast(message);
  });
}

// Empty or unparseable text (&quot;&quot;, &quot;abc&quot;, &quot;0095&quot;, &quot;2500&quot;) must revert, not snap
// to midnight — the day-level fields already behave this way (wireDayField).
function isUsableTimeEntry(raw) {
  const value = String(raw || &#x27;&#x27;).trim();
  return !!value &amp;&amp; isValidScheduleTime(normalizeTime(value));
}

function wireTimeInput(panel, selector, field, dayId, eventId) {
  const input = panel.querySelector(selector);
  if (!input) return;
  input.addEventListener(&#x27;blur&#x27;, () =&gt; {
    if (!isUsableTimeEntry(input.value)) {
      const evt = Store.getEvents(dayId).find(item =&gt; item.id === eventId);
      if (evt) input.value = evt[field];
      toast(&#x27;Times use 24-hour HHMM, e.g. 0730.&#x27;);
      return;
    }
    const normalized = normalizeTime(input.value);
    const updates = { [field]: normalized };
    const current = Store.getEvents(dayId).find(item =&gt; item.id === eventId);
    if (current &amp;&amp; current[field] === normalized) {
      // Nothing changed: no undo entry, no dirty write, no conflict toast.
      input.value = normalized;
      return;
    }
    if (!eventTimeRangeIsValid(dayId, eventId, updates)) {
      if (current) input.value = current[field];
      toast(&#x27;End time must be after start time.&#x27;);
      return;
    }
    input.value = normalized;
    saveUndoState();
    Store.updateEvent(dayId, eventId, updates);
    renderActiveDay();
    sessionSave();
    checkTimeConflict(dayId, eventId);
  });
  // Also commit on Enter key
  input.addEventListener(&#x27;keydown&#x27;, (e) =&gt; {
    if (e.key === &#x27;Enter&#x27;) { e.preventDefault(); input.blur(); }
  });
}

function wireBandEventFields(panel, dayId, eventId) {
  const current = () =&gt; Store.getEvents(dayId).find(event =&gt; event.id === eventId);
  const update = updates =&gt; {
    saveUndoState(); Store.updateEvent(dayId, eventId, updates); renderActiveDay(); sessionSave();

  panel.querySelector(&#x27;#insp-add-flight&#x27;)?.addEventListener(&#x27;click&#x27;, () =&gt; {

    const field = input.dataset.flightField, isTime = field === &#x27;startTime&#x27; || field === &#x27;endTime&#x27;;
    input.addEventListener(isTime ? &#x27;change&#x27; : &#x27;input&#x27;, () =&gt; {

      }
      activities[index] = next; update({ flightActivities: activities });
    });
  });
  panel.querySelectorAll(&#x27;[data-remove-flight]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; {
    update({ flightActivities: current().flightActivities.filter((_, index) =&gt; index !== Number(button.dataset.removeFlight)) });
    renderInspector(); document.querySelector(&#x27;#insp-add-flight&#x27;)?.focus();
  }));
}

  &lt;script&gt;
/* ── init.js ── Contract ───────────────────────────────────────────────────
 *
 * EXPORTS:
 *   (IIFE — auto-executes on load, no callable exports)
 *   migrateSavedState(savedState)  — async — imports SAVED_STATE into library (idempotent)
 *   legacyBoot()                   — async — old-style boot for non-FSAPI browsers
 *   loadSampleData()               — populates Store with sample schedule
 *
 * REQUIRES:
 *   inspector.js  — wireToolbar(), renderActiveDay()
 *   library.js    — wireLibrary(), showLibrary()
 *   themes.js     — applyEditorTheme(), getEditorTheme()
 *   storage.js    — hasFSAPI(), restoreDirectoryHandle(), listScheduleFiles(),
 *                   scheduleNameToSlug(), buildScheduleFile(), writeScheduleFile(), getUserName()
 *   persistence.js — sessionLoad()
 *   app-state.js  — Store.loadPersistedState(), Store.getDays(), Store.setActiveDay(),
 *                   Store.reset(), Store.setTitle(), Store.setFooter(), Store.addDay(),
 *                   Store.addEvent(), Store.addNote()
 *   ui-core.js    — toast()
 *
 * LOAD ORDER: Must be the LAST script loaded. Depends on all other modules.
 *
 * BOOT FLOW:
 *   1. wireToolbar() + wireLibrary() — always, sets up UI event handlers.
 *      Each runs through runBootStep(), which catches and logs rather than
 *      letting one throw (e.g. a hosting page denying storage access) abort
 *      the rest of boot and leave unrelated buttons silently unwired.
 *   2. hasFSAPI()? → No: legacyBoot() (restores saved/session data into the
 *      editor; shows the start screen when there is nothing to restore —
 *      sample data is never auto-loaded)
 *   3. restoreDirectoryHandle()? → Yes: migrate SAVED_STATE if present, showLibrary()
 *   4. No handle: load legacy data into Store, show connect prompt + library
 * ──────────────────────────────────────────────────────────────────────────── */

/* ── init.js ── Application bootstrap ──────────────────────────────────────── */

// Each wiring step owns a distinct set of buttons. Without isolation, one
// throwing (a missing element, a storage call denied by a hosting page&#x27;s
// permissions) would abort the whole boot IIFE and silently skip every
// wiring call after it — leaving unrelated, otherwise-fine buttons inert
// with no visible error.
function runBootStep(name, fn) {
  try {
    fn();
  } catch (e) {
    console.error(&#x27;Boot step failed: &#x27; + name, e);
    if (typeof logAppError === &#x27;function&#x27;) logAppError(&#x27;error&#x27;, String(e &amp;&amp; e.message || e), &#x27;boot:&#x27; + name);
  }
}

// Expose completion so embedded consumers and the test harness can wait for
// recovery before loading another workbook; load events alone are too early.
var appReady = (async function init() {
  runBootStep(&#x27;wireToolbar&#x27;, wireToolbar);
  runBootStep(&#x27;wireLibrary&#x27;, wireLibrary);
  if (typeof wireWorkbookUi === &#x27;function&#x27;) runBootStep(&#x27;wireWorkbookUi&#x27;, wireWorkbookUi);
  runBootStep(&#x27;applyEditorTheme&#x27;, () =&gt; applyEditorTheme(getEditorTheme()));

  // Last line of defense against losing unsaved work on tab close. Auto-save
  // clears the dirty flag within 2s, so this only fires for genuinely
  // unsaved changes (e.g. a draft never saved to a .schedule file).
  // Skipped under automation (navigator.webdriver): the native &quot;Leave site?&quot;
  // dialog freezes headless browsers — test runs leave dirty state, then any
  // scripted navigation deadlocks the renderer.
  if (!navigator.webdriver) {
    window.addEventListener(&#x27;beforeunload&#x27;, (e) =&gt; {
      if (typeof isDirty === &#x27;function&#x27; &amp;&amp; isDirty()) {
        e.preventDefault();
        e.returnValue = &#x27;&#x27;;
      }
    });
  }

  // Recovery is local and independent of a previously granted file handle.
  if (typeof restoreDurableRecovery === &#x27;function&#x27;) await restoreDurableRecovery();

  // Check FSAPI support
  if (!hasFSAPI()) {
    const banner = document.getElementById(&#x27;libraryFallbackBanner&#x27;);
    if (banner) banner.style.display = &#x27;block&#x27;;
    // No directory access — try legacy load paths
    await legacyBoot();
    return;
  }

  // Try restoring saved directory handle
  let handle = null;
  try {
    handle = await restoreDirectoryHandle();
  } catch (e) {
    console.warn(&#x27;Failed to restore directory handle:&#x27;, e);
  }

  if (handle) {
    // Check for SAVED_STATE migration
    if (typeof SAVED_STATE !== &#x27;undefined&#x27; &amp;&amp; hasSavedScheduleState(SAVED_STATE)) {
      try {
        await migrateSavedState(SAVED_STATE);
      } catch (e) {
        console.error(&#x27;Boot step failed: migrateSavedState&#x27;, e);
        if (typeof logAppError === &#x27;function&#x27;) logAppError(&#x27;error&#x27;, String(e &amp;&amp; e.message || e), &#x27;boot:migrateSavedState&#x27;);
      }
    }
    showLibrary();
    return;
  }

  // No handle — check if we have legacy data to migrate
  if (typeof SAVED_STATE !== &#x27;undefined&#x27; &amp;&amp; hasSavedScheduleState(SAVED_STATE)) {
    // Load into Store so user can see their data while we prompt for folder
    Store.loadPersistedState(SAVED_STATE);
  } else if (sessionLoad()) {
    const days = Store.getDays();
    if (days.length &amp;&amp; !Store.getActiveDay()) Store.setActiveDay(days[0].id);
  }

  showLibrary();
})().catch((e) =&gt; {
  // Anything the steps above didn&#x27;t catch would otherwise leave the default
  // shell on screen (editor chrome, no library, nothing wired) with only a
  // devtools rejection to explain it. Log it and land on the start screen.
  console.error(&#x27;Boot failed&#x27;, e);
  if (typeof logAppError === &#x27;function&#x27;) logAppError(&#x27;error&#x27;, String(e &amp;&amp; e.message || e), &#x27;boot&#x27;);
  try { showLibrary(); } catch (inner) { console.error(&#x27;Could not show the start screen&#x27;, inner); }
  toast(&#x27;Something went wrong while starting up. Open Help → Shortcuts to see the error, then reload.&#x27;, 8000);
});

function hasSavedScheduleState(state) {
  return !!(state &amp;&amp; Array.isArray(state.days));
}

async function migrateSavedState(savedState) {
  // Check if already migrated (a file with this title exists)
  const files = await listScheduleFiles();
  const slug = scheduleNameToSlug(savedState.title || &#x27;Imported Schedule&#x27;);
  const fileName = slug + &#x27;.json&#x27;;
  const alreadyExists = files.some(f =&gt; f.fileName === fileName);
  if (alreadyExists) return;

  const userName = getUserName() || &#x27;Migration&#x27;;
  const fileData = buildScheduleFile(
    savedState.title || &#x27;Imported Schedule&#x27;,
    savedState,
    [],
    userName
  );

  await writeScheduleFile(fileName, fileData);
  toast(&#x27;Migrated &quot;&#x27; + (savedState.title || &#x27;schedule&#x27;) + &#x27;&quot; to library&#x27;);
}

async function legacyBoot() {
  // FSAPI not available — fall back to old behavior
  if (typeof SAVED_STATE !== &#x27;undefined&#x27; &amp;&amp; hasSavedScheduleState(SAVED_STATE)) {
    Store.loadPersistedState(SAVED_STATE);
  } else if (!sessionLoad()) {
    // Nothing to restore — show the start screen. Never auto-load sample
    // data into an editable schedule: users mistook it for their own work
    // and saved it into real workbook files.
    showLibrary();
    return;
  }

  const days = Store.getDays();
  if (days.length &amp;&amp; !Store.getActiveDay()) {
    Store.setActiveDay(days[0].id);
  }

  // Say so explicitly rather than relying on the stylesheet&#x27;s default
  // (library hidden, editor shown) happening to match this branch.
  if (typeof hideLibrary === &#x27;function&#x27;) hideLibrary();
  if (typeof syncCurrentScheduleAccess === &#x27;function&#x27;) {
    await syncCurrentScheduleAccess();
  }
  syncToolbarTitle();
  renderActiveDay();
  renderInspector();
}
