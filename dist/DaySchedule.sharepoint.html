    surface: &#x27;#f8f8fa&#x27;,
  },
  airforce: {
    bg: &#x27;#f5f7fa&#x27;,
    text: &#x27;#00308F&#x27;,
    textSecondary: &#x27;#2c3e5a&#x27;,
    textMuted: &#x27;#576777&#x27;,
    accent: &#x27;#00308F&#x27;,
    accentSecondary: &#x27;#B8860B&#x27;,
    accentTertiary: &#x27;#708090&#x27;,
    border: &#x27;#d8dde5&#x27;,
    surface: &#x27;#eef1f6&#x27;,
  },
  ocp: {
    bg: &#x27;#f5f2ec&#x27;,
    text: &#x27;#3d3929&#x27;,
    textSecondary: &#x27;#5a5040&#x27;,
    textMuted: &#x27;#6d6249&#x27;,
    accent: &#x27;#5a6f52&#x27;,
    accentSecondary: &#x27;#8b7d5e&#x27;,
    accentTertiary: &#x27;#6b6353&#x27;,
    border: &#x27;#ddd8ce&#x27;,
    surface: &#x27;#ece8df&#x27;,
  },
  darkops: {
    bg: &#x27;#1a1a2e&#x27;,
    text: &#x27;#e0e0f0&#x27;,
    textSecondary: &#x27;#b0b0cc&#x27;,
    textMuted: &#x27;#9999b6&#x27;,
    accent: &#x27;#5b8def&#x27;,
    accentSecondary: &#x27;#e8a849&#x27;,
    accentTertiary: &#x27;#6b6b8a&#x27;,
    border: &#x27;#333355&#x27;,
    surface: &#x27;#252545&#x27;,
  },
  mono: {
    bg: &#x27;#ffffff&#x27;,
    text: &#x27;#333333&#x27;,
    textSecondary: &#x27;#555555&#x27;,
    textMuted: &#x27;#666666&#x27;,
    accent: &#x27;#333333&#x27;,
    accentSecondary: &#x27;#777777&#x27;,
    accentTertiary: &#x27;#aaaaaa&#x27;,
    border: &#x27;#dddddd&#x27;,
    surface: &#x27;#f5f5f5&#x27;,
  },
};

// Keep deployed palettes and add the approved paper color families.
const PALETTE_NAMES = [&#x27;classic&#x27;, &#x27;airforce&#x27;, &#x27;ocp&#x27;, &#x27;darkops&#x27;, &#x27;mono&#x27;, &#x27;forest&#x27;, &#x27;teal&#x27;, &#x27;slate&#x27;, &#x27;plum&#x27;, &#x27;burgundy&#x27;, &#x27;copper&#x27;];

const PALETTE_LABELS = {
  classic: &#x27;Classic&#x27;,
  airforce: &#x27;Air Force&#x27;,
  ocp: &#x27;OCP&#x27;,
  darkops: &#x27;Dark Ops&#x27;,
  mono: &#x27;Mono&#x27;,
};

for (const key of [&#x27;forest&#x27;, &#x27;teal&#x27;, &#x27;slate&#x27;, &#x27;plum&#x27;, &#x27;burgundy&#x27;, &#x27;copper&#x27;]) {
  const paper = BAND_PAPER_THEMES[key];
  PALETTES[key] = { bg: &#x27;#ffffff&#x27;, text: &#x27;#20262c&#x27;, textSecondary: &#x27;#39424b&#x27;, textMuted: &#x27;#525962&#x27;,
    accent: paper.colors[0], accentSecondary: paper.colors[8], accentTertiary: paper.colors[1], border: paper.colors[5], surface: paper.colors[2] };
  PALETTE_LABELS[key] = paper.label;
}

const SKIN_NAMES = [&#x27;bands&#x27;, &#x27;grid&#x27;, &#x27;cards&#x27;, &#x27;phases&#x27;];

const SKIN_LABELS = {
  bands: { name: &#x27;Bands&#x27;, desc: &#x27;Main track + concurrent&#x27; },
  grid: { name: &#x27;Grid&#x27;, desc: &#x27;Time \u00d7 groups&#x27; },
  cards: { name: &#x27;Cards&#x27;, desc: &#x27;Group detail&#x27; },
  phases: { name: &#x27;Phases&#x27;, desc: &#x27;Field exercises&#x27; },
};

// File-supplied theme values are untrusted (they bypass event/group
// normalization), and skin lands in HTML class strings while colors land in
// CSS custom properties — whitelist everything here, the one funnel every
// consumer reads through.
const THEME_COLOR_RE = /^#(?:[0-9a-fA-F]{3,4}|[0-9a-fA-F]{6}|[0-9a-fA-F]{8})$/;

function sanitizeCustomColors(raw) {
  if (!raw || typeof raw !== &#x27;object&#x27;) return null;
  const colors = {};
  let any = false;
  Object.keys(PALETTES.classic).forEach(key =&gt; {
    const value = typeof raw[key] === &#x27;string&#x27; ? raw[key].trim() : &#x27;&#x27;;
    if (THEME_COLOR_RE.test(value)) {
      colors[key] = value;
      any = true;
    }
  });
  return any ? colors : null;
}

function getScheduleTheme(t) {
  const palette = t &amp;&amp; t.palette;
  return {
    skin: (t &amp;&amp; SKIN_NAMES.indexOf(t.skin) !== -1) ? t.skin : &#x27;bands&#x27;,
    palette: (palette === &#x27;custom&#x27; || PALETTE_NAMES.indexOf(palette) !== -1) ? palette : &#x27;classic&#x27;,
    customColors: sanitizeCustomColors(t &amp;&amp; t.customColors),
  };
}

function applyPalette(paletteName, customColors) {
  const base = PALETTES[paletteName] || PALETTES.classic;
  const colors = customColors ? Object.assign({}, base, customColors) : base;
  const root = document.documentElement;
  root.style.setProperty(&#x27;--sch-bg&#x27;, colors.bg);
  root.style.setProperty(&#x27;--sch-text&#x27;, colors.text);
  root.style.setProperty(&#x27;--sch-text-secondary&#x27;, colors.textSecondary);
  root.style.setProperty(&#x27;--sch-text-muted&#x27;, colors.textMuted);
  root.style.setProperty(&#x27;--sch-accent&#x27;, colors.accent);
  root.style.setProperty(&#x27;--sch-accent-secondary&#x27;, colors.accentSecondary);
  root.style.setProperty(&#x27;--sch-accent-tertiary&#x27;, colors.accentTertiary);
  root.style.setProperty(&#x27;--sch-border&#x27;, colors.border);
  root.style.setProperty(&#x27;--sch-surface&#x27;, colors.surface);
}

const EDITOR_THEME_KEY = &#x27;dayschedule_editor_theme&#x27;;

function getEditorTheme() {
  try { return localStorage.getItem(EDITOR_THEME_KEY) === &#x27;dark&#x27; ? &#x27;dark&#x27; : &#x27;light&#x27;; }
  catch (e) { return document.body.getAttribute(&#x27;data-editor-theme&#x27;) === &#x27;dark&#x27; ? &#x27;dark&#x27; : &#x27;light&#x27;; }
}

function applyEditorTheme(theme) {
  const t = theme === &#x27;dark&#x27; ? &#x27;dark&#x27; : &#x27;light&#x27;;
  document.body.setAttribute(&#x27;data-editor-theme&#x27;, t);
  try { localStorage.setItem(EDITOR_THEME_KEY, t); }
  catch (e) { console.warn(&#x27;Editor theme will last for this page only:&#x27;, e); }
}

&lt;/script&gt;
  &lt;script&gt;
/* Approved day-first paper layout. One renderer and fitter serve editor and print.
 * Inputs come from normalized Store records; fitting moves existing DOM records,
 * never rewrites source data or infers names. No application network access.
 */
const BandLayout = (() =&gt; {
  const policy = Object.freeze({ margin: 36, logo: 72, notes: 90, clearance: 4,
    detail: 9, name: 10.5, roster: 9.5, title: 11.5, label: 8, scale: .85 });
  const ordered = events =&gt; events.slice().sort((a, b) =&gt; a.startTime.localeCompare(b.startTime));
  const time = event =&gt; event.startTime + &#x27;-&#x27; + event.endTime;
  const duration = event =&gt; {
    const minutes = computeDuration(event);
    return minutes &gt;= 60 &amp;&amp; minutes % 60 === 0 ? minutes / 60 + &#x27;h&#x27; : minutes + &#x27;m&#x27;;
  };
  const attendance = event =&gt; parsePersonnelInput(event.attendees || &#x27;&#x27;, event.attendeeFormat || &#x27;text&#x27;);

  function model(day) {
    const groups = getGroupMap(Store.getGroups());
    const mains = ordered(day.events.filter(event =&gt; isEventEffectiveMain(event, groups)));
    const concurrent = ordered(day.events.filter(event =&gt; !isEventEffectiveMain(event, groups)));
    const references = new Map(concurrent.map((event, i) =&gt; [event.id, i + 1]));
    const byMain = new Map(mains.map(main =&gt; [main.id, concurrent.filter(event =&gt; eventsOverlap(main, event))]));
    return { day, groups, mains, concurrent, references, byMain };
  }

  function paletteStyle() {
    const theme = getScheduleTheme(getCurrentScheduleFileData()?.theme);
    let colors = (BAND_PAPER_THEMES[theme.palette] || BAND_PAPER_THEMES.slate).colors;
    let ink = { bg: &#x27;#ffffff&#x27;, text: &#x27;#20262c&#x27;, textSecondary: &#x27;#39424b&#x27;, textMuted: &#x27;#525962&#x27; };
    if (theme.palette === &#x27;classic&#x27;) colors = BAND_PAPER_THEMES.airforce.colors;
    if (theme.palette === &#x27;custom&#x27; || theme.palette === &#x27;darkops&#x27;) {
      const custom = Object.assign({}, PALETTES[theme.palette] || PALETTES.classic, theme.customColors);
      ink = custom;
      colors = [custom.accent, custom.accentSecondary, custom.surface, custom.surface,
        custom.surface, custom.border, custom.surface, custom.surface, custom.accentTertiary];
    }
    const roles = BAND_COLOR_ROLES.map((role, i) =&gt; &#x27;--paper-&#x27; + role + &#x27;:&#x27; + colors[i]);
    roles.push(&#x27;--paper-bg:&#x27; + ink.bg, &#x27;--paper-text:&#x27; + ink.text,
      &#x27;--paper-secondary:&#x27; + ink.textSecondary, &#x27;--paper-muted:&#x27; + ink.textMuted);
    roles.push(&#x27;--paper-anchor-ink:&#x27; + getContrastingTextColor(colors[1]));
    roles.push(&#x27;--paper-heading-ink:&#x27; + getContrastingTextColor(colors[0]));
    return roles.join(&#x27;;&#x27;);
  }

  function badge(event, number, interactive) {
    const attributes = &#x27;class=&quot;start-ref&quot; data-ref-event=&quot;&#x27; + esc(event.id) + &#x27;&quot;&#x27;;
    return interactive
      ? &#x27;&lt;button type=&quot;button&quot; &#x27; + attributes + &#x27; data-event-ref=&quot;&#x27; + esc(event.id) + &#x27;&quot; aria-label=&quot;Concurrent event &#x27; + number + &#x27;: &#x27; + esc(event.title) + &#x27;&quot;&gt;&#x27; + number + &#x27;&lt;/button&gt;&#x27;
      : &#x27;&lt;span &#x27; + attributes + &#x27;&gt;&#x27; + number + &#x27;&lt;/span&gt;&#x27;;
  }

  function articleAttributes(event, interactive) {
    return &#x27; data-event-id=&quot;&#x27; + esc(event.id) + &#x27;&quot;&#x27; + (interactive
      ? &#x27; tabindex=&quot;0&quot; aria-label=&quot;&#x27; + esc(event.title + &#x27;, &#x27; + time(event) + &#x27;. Select to edit.&#x27;) + &#x27;&quot;&#x27; : &#x27;&#x27;);
  }

  function attendees(event) {
    const parsed = attendance(event);
    if (!parsed.raw.trim()) return &#x27;&#x27;;
    if (parsed.mode === &#x27;text&#x27;) return &#x27;&lt;div class=&quot;attendee-free-text&quot;&gt;&#x27; + esc(parsed.raw) + &#x27;&lt;/div&gt;&#x27;;
    return &#x27;&lt;div class=&quot;attendees&quot;&gt;&#x27; + parsed.entries.map((entry, index) =&gt;
      &#x27;&lt;span class=&quot;person-label&quot; data-person=&quot;&#x27; + esc(entry) + &#x27;&quot; data-entry-index=&quot;&#x27; + index + &#x27;&quot;&gt;&lt;strong&gt;&#x27; + esc(entry) + &#x27;&lt;/strong&gt;&lt;/span&gt;&#x27;).join(&#x27; &#x27;) + &#x27;&lt;/div&gt;&#x27;;
  }

  function details(event) {
    const meta = [event.location, event.poc ? &#x27;POC: &#x27; + event.poc : &#x27;&#x27;].filter(Boolean);
    return (meta.length ? &#x27;&lt;p class=&quot;event-meta&quot;&gt;&#x27; + meta.map(esc).join(&#x27; · &#x27;) + &#x27;&lt;/p&gt;&#x27; : &#x27;&#x27;) +
      (event.description ? &#x27;&lt;p class=&quot;description&quot;&gt;&#x27; + esc(event.description) + &#x27;&lt;/p&gt;&#x27; : &#x27;&#x27;);
  }

  function flightTable(event) {
    const activities = event.flightActivities || [];
    if (!activities.length) return &#x27;&#x27;;
    const flights = new Map();
    activities.forEach(activity =&gt; {
      const key = activity.flight || &#x27;Unnamed flight&#x27;;
      if (!flights.has(key)) flights.set(key, []);
      flights.get(key).push(activity);
    });
    const timed = activities.some(activity =&gt; activity.startTime !== event.startTime || activity.endTime !== event.endTime);
    return &#x27;&lt;table class=&quot;flight-table&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Flight&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;&#x27; +
      (timed ? &#x27;Time / activity&#x27; : &#x27;Activity&#x27;) + &#x27;&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Location / POC&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&#x27; +
      Array.from(flights, ([flight, entries]) =&gt; {
        const sorted = ordered(entries);
        const common = sorted.every(a =&gt; a.location === sorted[0].location &amp;&amp; a.poc === sorted[0].poc);
        const logistics = a =&gt; (a.location ? &#x27;&lt;span&gt;&#x27; + esc(a.location) + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;) +
          (a.poc ? &#x27;&lt;span class=&quot;flight-poc&quot;&gt;&#x27; + esc(a.poc) + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;);
        return &#x27;&lt;tr&gt;&lt;th scope=&quot;row&quot;&gt;&#x27; + esc(flight) + &#x27;&lt;/th&gt;&lt;td&gt;&#x27; + sorted.map(a =&gt;
          &#x27;&lt;div class=&quot;flight-activity&quot;&gt;&#x27; + (timed ? &#x27;&lt;span class=&quot;flight-time&quot;&gt;&#x27; + esc(time(a)) + &#x27;&lt;/span&gt; &#x27; : &#x27;&#x27;) +
          &#x27;&lt;strong&gt;&#x27; + esc(a.title || &#x27;Untitled activity&#x27;) + &#x27;&lt;/strong&gt;&#x27; + (a.description ? &#x27;&lt;span class=&quot;flight-description&quot;&gt;&#x27; + esc(a.description) + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/div&gt;&#x27;).join(&#x27;&#x27;) +
          &#x27;&lt;/td&gt;&lt;td&gt;&#x27; + (common ? logistics(sorted[0]) : sorted.map(a =&gt; &#x27;&lt;div class=&quot;flight-logistics&quot;&gt;&#x27; +
            &#x27;&lt;span class=&quot;flight-time&quot;&gt;&#x27; + esc(time(a)) + &#x27;&lt;/span&gt;&#x27; + logistics(a) + &#x27;&lt;/div&gt;&#x27;).join(&#x27;&#x27;)) + &#x27;&lt;/td&gt;&lt;/tr&gt;&#x27;;
      }).join(&#x27;&#x27;) + &#x27;&lt;/tbody&gt;&lt;/table&gt;&#x27;;
  }

  function mainEvent(event, data, interactive) {
    const references = data.byMain.get(event.id) || [];
    const group = data.groups[event.groupId];
    const flight = (event.flightActivities || []).length &gt; 0;
    const audience = flight ? &#x27;By flight&#x27; : group?.name || &#x27;&#x27;;
    const meta = (event.location ? &#x27;&lt;span class=&quot;detail-field detail-location&quot;&gt;&lt;small&gt;At&lt;/small&gt; &#x27; + esc(event.location) + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;) +
      (event.poc ? &#x27;&lt;span class=&quot;detail-field detail-poc&quot;&gt;&lt;small&gt;POC&lt;/small&gt; &#x27; + esc(event.poc) + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;);
    const refs = references.length ? &#x27;&lt;div class=&quot;start-refs&quot;&gt;&lt;span class=&quot;reference-label&quot;&gt;Concurrent events:&lt;/span&gt;&lt;span class=&quot;reference-badges&quot;&gt;&#x27; +
      references.map(item =&gt; badge(item, data.references.get(item.id), interactive)).join(&#x27;&#x27;) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27; : &#x27;&#x27;;
    return &#x27;&lt;article class=&quot;event main-event&#x27; + (event.emphasized ? &#x27; highlighted&#x27; : &#x27;&#x27;) + (flight ? &#x27; flight&#x27; : &#x27;&#x27;) + (event.isBreak ? &#x27; break&#x27; : &#x27;&#x27;) + &#x27;&quot;&#x27; + articleAttributes(event, interactive) + &#x27;&gt;&#x27; +
      &#x27;&lt;div class=&quot;time&quot;&gt;&#x27; + esc(time(event)) + &#x27;&lt;span class=&quot;duration&quot;&gt;&#x27; + esc(duration(event)) + &#x27;&lt;/span&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;div class=&quot;main-content&#x27; + (refs &amp;&amp; !meta &amp;&amp; !event.description ? &#x27; reference-only&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&lt;div class=&quot;main-top&quot;&gt;&lt;div class=&quot;event-title&quot;&gt;&lt;h3&gt;&#x27; + esc(event.title) + &#x27;&lt;/h3&gt;&#x27; +
      (audience &amp;&amp; audience !== data.primaryLabel ? &#x27;&lt;span class=&quot;audience&quot;&gt;&#x27; + esc(audience) + &#x27;&lt;/span&gt;&#x27; : &#x27;&#x27;) +
      &#x27;&lt;/div&gt;&lt;div class=&quot;main-details&quot;&gt;&#x27; + meta + &#x27;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;main-support&quot;&gt;&#x27; +
      (event.description ? &#x27;&lt;p class=&quot;description&quot;&gt;&#x27; + esc(event.description) + &#x27;&lt;/p&gt;&#x27; : &#x27;&#x27;) + refs + &#x27;&lt;/div&gt;&#x27; + attendees(event) + flightTable(event) + &#x27;&lt;/div&gt;&lt;/article&gt;&#x27;;
  }

  function concurrentEvent(event, data, interactive) {
    const parsed = attendance(event), roster = parsed.mode !== &#x27;text&#x27; &amp;&amp; parsed.entries.length &gt;= 8;
    const group = data.groups[event.groupId];
    const heading = &#x27;&lt;header&gt;&lt;h3&gt;&#x27; + badge(event, data.references.get(event.id), false) + esc(event.title) + &#x27;&lt;/h3&gt;&lt;span class=&quot;time&quot;&gt;&#x27; + esc(time(event)) + &#x27;&lt;/span&gt;&#x27; +
      (roster ? &#x27;&lt;p class=&quot;roster-title&quot;&gt;All &#x27; + parsed.entries.length + &#x27; entries · entered order&lt;/p&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/header&gt;&#x27;;
    const audience = group &amp;&amp; !/^specific (people|personnel)$/i.test(group.name.trim())
      ? &#x27;&lt;div class=&quot;audience&quot;&gt;&#x27; + esc(group.name) + &#x27;&lt;/div&gt;&#x27; : &#x27;&#x27;;
    const body = attendees(event);
    return &#x27;&lt;article class=&quot;event &#x27; + (roster ? &#x27;large-event flow-roster&#x27; : &#x27;small-event&#x27;) + (event.emphasized ? &#x27; highlighted&#x27; : &#x27;&#x27;) + &#x27;&quot;&#x27; + articleAttributes(event, interactive) + &#x27;&gt;&#x27; +
      (roster ? &#x27;&lt;div class=&quot;large-head&quot;&gt;&#x27; + heading + &#x27;&lt;/div&gt;&lt;div class=&quot;roster-body&quot;&gt;&#x27; + audience + body + &#x27;&lt;div class=&quot;roster-details&quot;&gt;&#x27; + details(event) + flightTable(event) + &#x27;&lt;/div&gt;&lt;/div&gt;&#x27; :
        heading + audience + body + details(event) + flightTable(event)) + &#x27;&lt;/article&gt;&#x27;;
  }

  function body(day, options) {
    const interactive = !!options?.interactive, data = model(day);
    const primary = Store.getGroups().filter(group =&gt; group.scope === &#x27;main&#x27;);
    data.primaryLabel = primary.length === 1 ? primary[0].name : &#x27;&#x27;;
    return &#x27;&lt;div class=&quot;sheet-body&quot;&gt;&lt;section class=&quot;main-panel&quot;&gt;&lt;h3 class=&quot;section-title&quot;&gt;Main schedule&#x27; +
      (data.primaryLabel ? &#x27;&lt;small&gt;&#x27; + esc(data.primaryLabel) + &#x27;&lt;/small&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/h3&gt;&lt;div class=&quot;main-list&quot;&gt;&#x27; +
      (data.mains.length ? data.mains.map(event =&gt; mainEvent(event, data, interactive)).join(&#x27;&#x27;) : &#x27;&lt;p class=&quot;band-empty&quot;&gt;No main events scheduled.&lt;/p&gt;&#x27;) +
      &#x27;&lt;/div&gt;&lt;/section&gt;&#x27; + (data.concurrent.length ? &#x27;&lt;section class=&quot;attendance-area&quot;&gt;&lt;div class=&quot;concurrent-heading&quot;&gt;&lt;h3 class=&quot;section-title&quot;&gt;Concurrent events&lt;/h3&gt;&lt;/div&gt;&lt;div class=&quot;attendance-columns&quot;&gt;&#x27; +
      data.concurrent.map(event =&gt; concurrentEvent(event, data, interactive)).join(&#x27;&#x27;) + &#x27;&lt;/div&gt;&lt;/section&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/div&gt;&#x27;;
  }

  function page(day, options) {
    const opts = options || {}, settings = getBandSettings(getCurrentScheduleFileData()?.theme);
    const index = Store.getDays().findIndex(item =&gt; item.id === day.id) + 1;
    const date = day.date ? formatDateDisplay(day.date).split(&#x27;, &#x27;) : [];
    const label = day.label || date[0] || &#x27;Day &#x27; + index;
    const footer = Store.getFooter(), logo = Store.getLogo();
    const notes = (day.notes || []).filter(note =&gt; opts.interactive || note.category || note.text);
    const half = Math.ceil(notes.length / 2);
    const css = &#x27;--page-width:612pt;--page-height:792pt;--page-margin:36pt;--logo-size:72pt;&#x27; +
      &#x27;--min-detail:9pt;--min-name:10.5pt;--min-label:8pt;--min-main-title:11.5pt;--notes-height:&#x27; + settings.notesHeight + &#x27;pt;&#x27; + paletteStyle();
    return &#x27;&lt;section class=&quot;sheet band-sheet roomy&quot; data-theme=&quot;app&quot; data-fit=&quot;true&quot; data-day=&quot;&#x27; + esc(day.id) + &#x27;&quot; style=&quot;&#x27; + css + &#x27;&quot; aria-label=&quot;&#x27; + esc(label) + &#x27;&quot;&gt;&#x27; +
      &#x27;&lt;div class=&quot;print-error&quot;&gt;&lt;b&gt;Schedule not ready to print.&lt;/b&gt;&lt;p&gt;&#x27; + esc(label) + &#x27;: the complete day exceeds the supported text sizes. No partial schedule is printed. Review the content before issuing it.&lt;/p&gt;&lt;/div&gt;&#x27; +
      &#x27;&lt;header class=&quot;page-header&#x27; + (settings.showLogo ? &#x27;&#x27; : &#x27; no-logo&#x27;) + &#x27;&quot;&#x27; + (opts.interactive ? &#x27; data-band-customize tabindex=&quot;0&quot; role=&quot;button&quot; aria-label=&quot;Customize schedule&quot;&#x27; : &#x27;&#x27;) + &#x27;&gt;&#x27; +
      (settings.showLogo ? &#x27;&lt;div class=&quot;logo-slot&#x27; + (logo ? &#x27; has-logo&#x27; : &#x27;&#x27;) + &#x27;&quot;&gt;&#x27; + (logo ? &#x27;&lt;img src=&quot;&#x27; + esc(logo) + &#x27;&quot; alt=&quot;Unit logo&quot;&gt;&#x27; : &#x27;&lt;span&gt;UNIT&lt;br&gt;LOGO&lt;/span&gt;&#x27;) + &#x27;&lt;/div&gt;&#x27; : &#x27;&#x27;) +
      &#x27;&lt;div class=&quot;heading-content&quot;&gt;&#x27; + (Store.getTitle() ? &#x27;&lt;p class=&quot;page-title&quot;&gt;&#x27; + esc(Store.getTitle()) + &#x27;&lt;/p&gt;&#x27; : &#x27;&#x27;) +
      (footer.contact ? &#x27;&lt;p class=&quot;schedule-label&quot;&gt;&#x27; + esc(footer.contact) + &#x27;&lt;/p&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/div&gt;&lt;div class=&quot;day-heading&quot;&gt;&lt;h2&gt;&#x27; + esc(label) + &#x27;&lt;/h2&gt;&#x27; +
      (date.length &gt; 1 ? &#x27;&lt;p class=&quot;date&quot;&gt;&#x27; + esc(date[1]) + &#x27;&lt;/p&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/div&gt;&lt;/header&gt;&#x27; +
      (opts.handout ? &#x27;&lt;p class=&quot;band-handout&quot;&gt;&#x27; + esc(opts.handout) + &#x27;&lt;/p&gt;&#x27; : &#x27;&#x27;) + body(day, opts) +
      &#x27;&lt;section class=&quot;reminder-area&quot;&gt;&lt;div class=&quot;reminder-panel&quot;&gt;&lt;h3 class=&quot;reminder-heading&quot;&gt;Notes &amp;amp; Reminders&lt;/h3&gt;&lt;div class=&quot;reminders&quot;&gt;&#x27; +
      [notes.slice(0, half), notes.slice(half)].map(column =&gt; &#x27;&lt;div class=&quot;reminder-column&quot;&gt;&#x27; + column.map(note =&gt;
        &#x27;&lt;div class=&quot;reminder&#x27; + (!note.category &amp;&amp; !note.text ? &#x27; note-empty&#x27; : &#x27;&#x27;) + &#x27;&quot; data-note-id=&quot;&#x27; + esc(note.id) + &#x27;&quot;&gt;&#x27; + (opts.interactive ? &#x27;&lt;button type=&quot;button&quot; class=&quot;note-select&quot;&gt;&#x27; : &#x27;&#x27;) +
        (note.category ? &#x27;&lt;strong&gt;&#x27; + esc(note.category) + &#x27;:&lt;/strong&gt; &#x27; : &#x27;&#x27;) + esc(note.text || (!note.category ? &#x27;Empty note&#x27; : &#x27;&#x27;)) +
        (opts.interactive ? &#x27;&lt;/button&gt;&#x27; : &#x27;&#x27;) + &#x27;&lt;/div&gt;&#x27;).join(&#x27;&#x27;) + &#x27;&lt;/div&gt;&#x27;).join(&#x27;&#x27;) + &#x27;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;&#x27; +
      &#x27;&lt;footer class=&quot;page-footer&quot;&gt;&lt;span&gt;&#x27; + (footer.poc ? &#x27;Schedule POC: &#x27; + esc(footer.poc) : &#x27;&#x27;) + &#x27;&lt;/span&gt;&lt;span&gt;Day &#x27; + index + &#x27; of &#x27; + Store.getDays().length + &#x27;&lt;/span&gt;&lt;/footer&gt;&lt;/section&gt;&#x27;;
  }

  function geometry(sheet) {
    const pageBox = sheet.getBoundingClientRect(), content = sheet.querySelector(&#x27;.sheet-body&#x27;).getBoundingClientRect();
    const area = sheet.querySelector(&#x27;.reminder-area&#x27;).getBoundingClientRect(), footer = sheet.querySelector(&#x27;.page-footer&#x27;).getBoundingClientRect();
    const panel = sheet.querySelector(&#x27;.reminder-panel&#x27;).getBoundingClientRect(), notes = sheet.querySelector(&#x27;.reminders&#x27;).getBoundingClientRect();
    const notesOverflow = Math.max(0, notes.bottom - panel.bottom);
    const overflow = Math.max(0, content.bottom + policy.clearance / .75 - area.top,
      footer.bottom - (pageBox.bottom - policy.margin / .75), notesOverflow);
    const tooWide = Array.from(sheet.querySelectorAll(&#x27;.event,.reminder,.page-title,.schedule-label,.day-heading,.page-footer&#x27;))
      .some(element =&gt; element.scrollWidth &gt; element.clientWidth + 1);
    return { fits: overflow &lt; .05 &amp;&amp; !tooWide, overflow, notesOverflow, tooWide };
  }

  function fit(sheet) {
    sheet.dataset.fit = &#x27;true&#x27;;
    sheet.style.setProperty(&#x27;--main-extra&#x27;, &#x27;0pt&#x27;);
    sheet.style.setProperty(&#x27;--main-title-grow&#x27;, &#x27;0pt&#x27;);
    let titleSize = 19;
    sheet.style.setProperty(&#x27;--title-size&#x27;, titleSize + &#x27;pt&#x27;);
    while (sheet.querySelector(&#x27;.heading-content&#x27;).getBoundingClientRect().height &gt; 96 &amp;&amp; titleSize &gt; 10) {
      titleSize -= .25; sheet.style.setProperty(&#x27;--title-size&#x27;, titleSize + &#x27;pt&#x27;);
    }
    let noteScale = 1;
    sheet.style.setProperty(&#x27;--note-scale&#x27;, &#x27;1&#x27;);
    while (geometry(sheet).notesOverflow &gt; 0 &amp;&amp; noteScale &gt; policy.detail / 9.5) {
      noteScale = Math.max(policy.detail / 9.5, noteScale - .02);
      sheet.style.setProperty(&#x27;--note-scale&#x27;, String(noteScale));
    }
    const columns = sheet.querySelector(&#x27;.attendance-columns&#x27;);
    const entries = columns ? Array.from(columns.querySelectorAll(&#x27;article[data-event-id]&#x27;)) : [];
    let columnCount = 0, density = &#x27;roomy&#x27;, scale = 1;
    const place = (count, widths) =&gt; {
      if (!columns) return geometry(sheet).fits;
      const single = entries.length &lt;= 3 &amp;&amp; !entries.some(entry =&gt; entry.classList.contains(&#x27;large-event&#x27;));
      columnCount = single ? 1 : count;
      columns.className = &#x27;attendance-columns &#x27; + (single ? &#x27;single-list&#x27; : &#x27;reading-columns&#x27;);
      columns.style.gridTemplateColumns = (single ? [1] : widths).map(width =&gt; &#x27;minmax(0,&#x27; + width + &#x27;fr)&#x27;).join(&#x27; &#x27;);
      columns.replaceChildren();
      const hosts = Array.from({ length: columnCount }, () =&gt; {
        const host = document.createElement(&#x27;div&#x27;); host.className = &#x27;event-column&#x27;; columns.appendChild(host); return host;
      });
      const box = sheet.getBoundingClientRect();
      const reserve = sheet.querySelector(&#x27;.reminder-area&#x27;).getBoundingClientRect().height + sheet.querySelector(&#x27;.page-footer&#x27;).getBoundingClientRect().height +
        parseFloat(getComputedStyle(sheet.querySelector(&#x27;.page-footer&#x27;)).marginTop);
      const limit = box.bottom - policy.margin / .75 - reserve - policy.clearance / .75 - columns.getBoundingClientRect().top;
      let col = 0;
      entries.forEach(entry =&gt; {
        hosts[col].appendChild(entry);
        if (hosts[col].getBoundingClientRect().height &gt; limit + .05 &amp;&amp; col + 1 &lt; columnCount &amp;&amp; hosts[col].children.length &gt; 1) hosts[++col].appendChild(entry);
      });
      return geometry(sheet).fits;
    };
    const attempt = count =&gt; {
      const widths = count === 2 ? [[1, 1], [.44, .56], [.4, .6]] : [[1, 1, 1]];
      const fits = () =&gt; widths.some(ratio =&gt; place(count, ratio));
      for (const roster of [12, 11.5, 11, 10.5, 10, policy.roster]) {
        sheet.style.setProperty(&#x27;--roster-name-size&#x27;, roster + &#x27;pt&#x27;);
        for (const candidate of [&#x27;roomy&#x27;, &#x27;standard&#x27;, &#x27;compact&#x27;, &#x27;tight&#x27;]) {
          sheet.classList.remove(&#x27;roomy&#x27;, &#x27;standard&#x27;, &#x27;compact&#x27;, &#x27;tight&#x27;);
          sheet.classList.add(candidate); if (candidate === &#x27;tight&#x27;) sheet.classList.add(&#x27;compact&#x27;);
          sheet.style.setProperty(&#x27;--type-scale&#x27;, &#x27;1&#x27;);
          density = candidate; scale = 1;
          if (fits()) return true;
        }
      }
      let low = policy.scale, high = 1;
      sheet.style.setProperty(&#x27;--type-scale&#x27;, String(low)); scale = low;
      if (!fits()) return false;
      for (let i = 0; i &lt; 9; i++) {
        const mid = (low + high) / 2; sheet.style.setProperty(&#x27;--type-scale&#x27;, String(mid));
        if (fits()) low = mid; else high = mid;
      }
      scale = Math.floor(low * 100) / 100; sheet.style.setProperty(&#x27;--type-scale&#x27;, String(scale));
      return fits();
    };
    const fitted = attempt(2) || attempt(3);
    if (fitted) {
      const panel = sheet.querySelector(&#x27;.main-panel&#x27;), area = sheet.querySelector(&#x27;.reminder-area&#x27;);
      const free = area.getBoundingClientRect().top - sheet.querySelector(&#x27;.sheet-body&#x27;).getBoundingClientRect().bottom;
      if (free &gt;= 16) {
        const mainOnly = !columns, cap = (area.getBoundingClientRect().top - panel.getBoundingClientRect().top) * (mainOnly ? .88 : .68);
        let low = 0, high = 1;
        const apply = value =&gt; { sheet.style.setProperty(&#x27;--main-extra&#x27;, (mainOnly ? 18 : 7) * value + &#x27;pt&#x27;); sheet.style.setProperty(&#x27;--main-title-grow&#x27;, (mainOnly ? 2.5 : 1.5) * value + &#x27;pt&#x27;); };
        for (let i = 0; i &lt; 9; i++) { const mid = (low + high) / 2; apply(mid); if (geometry(sheet).fits &amp;&amp; panel.getBoundingClientRect().height &lt;= cap) low = mid; else high = mid; }
        apply(Math.floor(low * 100) / 100);
      }
    }
    const result = geometry(sheet);
    sheet.dataset.fit = String(result.fits); sheet.dataset.columns = String(columnCount);
    sheet.dataset.density = density; sheet.dataset.textScale = String(scale);
    return { ...result, columns: columnCount, scale, density };
  }

  return { policy, model, attendance, page, body, fit, flightTable };
})();

/* Bands uses the approved page renderer. Shared dispatch still exposes a body
 * renderer for callers that compose their own shell; the app and print pipeline
 * use BandLayout.page() so header, notes and fitting stay identical.
 */
function renderDayBody_band(dayId, dayOverride, options) {
  const day = dayOverride || Store.getDay(dayId);
  return day ? BandLayout.body(day, options) : &#x27;&#x27;;
}

  &lt;script&gt;
/* ── skin-grid.js ── Contract ─────────────────────────────────────────────
 *
 * EXPORTS:
 *   renderDayBody_grid(dayId) → string (HTML)
 *
 * REQUIRES:
 *   app-state.js    — Store.getDay(), Store.getGroups(), Store.getNotes()
 *   utils.js        — esc(), timeToMinutes(), getContrastingTextColor()
 *   data-helpers.js — getSharedEventExceptions(), summarizeExceptionNote()
 *   render.js       — renderNotes(), clearDaggerFootnotes()
 *
 * CONSUMED BY:
 *   render.js — dispatches to this when skin === &#x27;grid&#x27;
 * ──────────────────────────────────────────────────────────────────────────── */

function renderDayBody_grid(dayId, dayOverride) {
  const day = dayOverride || Store.getDay(dayId);
  if (!day) return &#x27;&#x27;;
  const groups = Store.getGroups();
  const events = day.events.slice().sort(compareBandOrder);
  const notes = day.notes || Store.getNotes(dayId);

  clearDaggerFootnotes();

  if (events.length === 0) {
    let html = &#x27;&lt;div class=&quot;empty-state&quot;&gt;&#x27;;
    html += &#x27;&lt;p&gt;Click &lt;strong&gt;+ Event&lt;/strong&gt; to add your first event.&lt;/p&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
    if (notes.length &gt; 0) html += renderNotes(notes);
    return html;
  }

  // Separate shared/main-track events from group-specific events. Orphaned
  // and ungrouped events are routed to an &quot;Unassigned&quot; lane so they render.
  const sharedEvents = events.filter(e =&gt; isEventEffectiveMain(e, groups));
  const groupEvents = resolveLaneEvents(events.filter(e =&gt; !sharedEvents.includes(e)), groups);

  // Get groups that have events
  const activeGroupIds = [...new Set(groupEvents.map(e =&gt; e.groupId))];
  const activeGroups = activeGroupIds
    .map(id =&gt; id === &#x27;&#x27; ? UNASSIGNED_LANE_GROUP : groups.find(g =&gt; g.id === id))
    .filter(Boolean);

  // Time rows are keyed by event starts. Boundaries caused duplicate-looking
  // rows when several main-track events shared the same start time.
  const timeSlots = Array.from(new Set(events.map(e =&gt; e.startTime)))
    .sort((a, b) =&gt; timeToMinutes(a) - timeToMinutes(b));

  // CSS grid needs explicit column count
  const colCount = Math.max(activeGroups.length, 1);
  let html = &#x27;&lt;div class=&quot;grid-schedule&quot; style=&quot;--grid-cols:&#x27; + colCount + &#x27;;&quot;&gt;&#x27;;
  const overlapWarnings = getGridLaneOverlapWarnings(activeGroups, groupEvents);

  if (overlapWarnings.length &gt; 0) {
    html += &#x27;&lt;div class=&quot;grid-view-note&quot;&gt;&#x27;;
    html += &#x27;&lt;strong&gt;Grid view warning:&lt;/strong&gt; &#x27; + esc(summarizeGridOverlapWarnings(overlapWarnings));
    html += &#x27;&lt;/div&gt;&#x27;;
  }

  if (activeGroups.length &gt; 0) {
    html += &#x27;&lt;div class=&quot;grid-header&quot;&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;grid-time-col&quot;&gt;Time&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;grid-lane-head-strip&quot;&gt;&#x27;;
    activeGroups.forEach(g =&gt; {
      html += &#x27;&lt;div class=&quot;grid-group-col&quot; style=&quot;background:&#x27; + esc(g.color) + &#x27;;color:&#x27; + esc(getContrastingTextColor(g.color)) + &#x27;;&quot;&gt;&#x27; + esc(g.name) + &#x27;&lt;/div&gt;&#x27;;
    });
    html += &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
  }

  // Rows
  timeSlots.forEach(slotStart =&gt; {
    const sharedAtSlot = sharedEvents.filter(e =&gt; e.startTime === slotStart);
    const groupRow = renderGridRow(slotStart, activeGroups, groupEvents);

    if (!sharedAtSlot.length &amp;&amp; !groupRow.hasGroupActivity) return;

    html += &#x27;&lt;div class=&quot;grid-slot&quot;&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;grid-time-col&quot;&gt;&#x27; + esc(slotStart) + &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;grid-slot-body&quot;&gt;&#x27;;

    if (sharedAtSlot.length &gt; 0) {
      html += &#x27;&lt;div class=&quot;grid-main-stack&quot;&gt;&#x27;;
      sharedAtSlot.forEach(shared =&gt; {
        html += renderGridBanner(shared, events, groups);
      });
      html += &#x27;&lt;/div&gt;&#x27;;
    }

    if (groupRow.hasGroupActivity) html += groupRow.html;

    html += &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
  });

  html += &#x27;&lt;/div&gt;&#x27;;
  if (notes.length &gt; 0) html += renderNotes(notes);
  return html;
}

function renderGridBanner(shared, events, groups) {
  const sharedExceptions = getSharedEventExceptions(shared, events, groups);
  const exceptionNote = summarizeExceptionNote(sharedExceptions, 3);
  const bannerClass = shared.isBreak ? &#x27;grid-banner grid-banner-break&#x27; : &#x27;grid-banner&#x27;;
  let html = &#x27;&lt;div class=&quot;&#x27; + bannerClass + &#x27;&quot; data-event-id=&quot;&#x27; + esc(shared.id) + &#x27;&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;grid-banner-content&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;grid-banner-stack&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;grid-banner-head&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;grid-banner-title&quot;&gt;&#x27; + esc(shared.title) + &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;grid-banner-time&quot;&gt;&#x27; + esc(shared.startTime + &#x27;\u2013&#x27; + shared.endTime) + &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  const bannerMeta = [];
  if (shared.location) bannerMeta.push(&#x27;&lt;span&gt;&#x27; + esc(shared.location) + &#x27;&lt;/span&gt;&#x27;);
  if (shared.poc) bannerMeta.push(&#x27;&lt;span&gt;POC: &#x27; + esc(shared.poc) + &#x27;&lt;/span&gt;&#x27;);
  if (bannerMeta.length &gt; 0) {
    html += &#x27;&lt;div class=&quot;grid-banner-meta&quot;&gt;&#x27; + bannerMeta.join(&#x27;&lt;span class=&quot;grid-meta-sep&quot;&gt;\u00b7&lt;/span&gt;&#x27;) + &#x27;&lt;/div&gt;&#x27;;
  }
  // Main-track events kept their audience tag and named people in Bands but
  // lost both here \u2014 on a printed handout those are the point.
  const bannerGroup = (groups || []).find(g =&gt; g.id === shared.groupId) || null;
  if (bannerGroup || shared.attendees) {
    html += &#x27;&lt;div class=&quot;grid-banner-meta grid-banner-who&quot;&gt;&#x27;;
    if (bannerGroup) html += &#x27;&lt;span class=&quot;skin-group-tag&quot; style=&quot;background:&#x27; + esc(bannerGroup.color) + &#x27;;color:&#x27; + esc(getContrastingTextColor(bannerGroup.color)) + &#x27;;&quot;&gt;&#x27; + esc(bannerGroup.name) + &#x27;&lt;/span&gt;&#x27;;
    if (shared.attendees) html += &#x27;&lt;span&gt;WHO: &#x27; + esc(shared.attendees) + &#x27;&lt;/span&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
  }
  html += renderFlightDetails(shared);
  if (shared.description) html += &#x27;&lt;div class=&quot;grid-banner-desc&quot;&gt;&#x27; + esc(shared.description) + &#x27;&lt;/div&gt;&#x27;;
  if (exceptionNote) {
    html += &#x27;&lt;div class=&quot;grid-banner-exception&quot;&gt;Exceptions: &#x27; + esc(exceptionNote) + &#x27;&lt;/div&gt;&#x27;;
  }
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  return html;
}

function renderGridRow(slotStart, activeGroups, groupEvents) {
  const slotMinutes = timeToMinutes(slotStart);
  let hasGroupActivity = false;
  let html = &#x27;&lt;div class=&quot;grid-row&quot;&gt;&#x27;;

  activeGroups.forEach(g =&gt; {
    const startingEvents = groupEvents.filter(e =&gt;
      e.groupId === g.id &amp;&amp;
      e.startTime === slotStart
    );
    const continuingEvents = groupEvents.filter(e =&gt;
      e.groupId === g.id &amp;&amp;
      e.startTime !== slotStart &amp;&amp;
      timeToMinutes(e.startTime) &lt;= slotMinutes &amp;&amp;
      timeToMinutes(e.endTime) &gt; slotMinutes
    );
    const laneEvents = startingEvents.concat(continuingEvents);

    if (laneEvents.length &gt; 0) hasGroupActivity = true;

    if (laneEvents.length &gt; 0) {
      html += &#x27;&lt;div class=&quot;grid-cell-stack&quot;&gt;&#x27;;
      laneEvents.forEach(evt =&gt; {
        html += renderGridCell(evt, g, evt.startTime !== slotStart);
      });
      html += &#x27;&lt;/div&gt;&#x27;;
      return;
    }

    html += &#x27;&lt;div class=&quot;grid-cell-stack grid-cell-empty&quot;&gt;&lt;/div&gt;&#x27;;
  });

  html += &#x27;&lt;/div&gt;&#x27;;
  return { html, hasGroupActivity };
}

function renderGridCell(evt, group, isContinuation) {
  const className = isContinuation ? &#x27;grid-cell grid-cell-cont&#x27; : &#x27;grid-cell&#x27;;
  const accentText = getContrastingTextColor(group.color);
  const accentStyle = &#x27;--grid-accent:&#x27; + esc(group.color) + &#x27;;--grid-accent-text:&#x27; + esc(accentText) + &#x27;;&#x27;;
  let html = &#x27;&lt;div class=&quot;&#x27; + className + &#x27;&quot; style=&quot;&#x27; + accentStyle + &#x27;&quot; data-event-id=&quot;&#x27; + esc(evt.id) + &#x27;&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;grid-cell-head&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;grid-cell-title&quot;&gt;&#x27; + esc(evt.title) + &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;grid-cell-time&quot;&gt;&#x27; + esc(evt.startTime + &#x27;\u2013&#x27; + evt.endTime) + &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  if (isContinuation) {
    html += &#x27;&lt;div class=&quot;grid-cell-body&quot;&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;grid-cell-audience&quot;&gt;&#x27; + esc(group.name) + &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;grid-cell-meta&quot;&gt;Continues from &#x27; + esc(evt.startTime) + &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
    return html;
  }
  html += &#x27;&lt;div class=&quot;grid-cell-body&quot;&gt;&#x27;;
  html += &#x27;&lt;div class=&quot;grid-cell-audience&quot;&gt;&#x27; + esc(group.name) + &#x27;&lt;/div&gt;&#x27;;
  const meta = [];
  if (evt.location) meta.push(&#x27;&lt;span&gt;&#x27; + esc(evt.location) + &#x27;&lt;/span&gt;&#x27;);
  if (evt.poc) meta.push(&#x27;&lt;span&gt;POC: &#x27; + esc(evt.poc) + &#x27;&lt;/span&gt;&#x27;);
  if (meta.length &gt; 0) {
    html += &#x27;&lt;div class=&quot;grid-cell-meta-line&quot;&gt;&#x27; + meta.join(&#x27;&lt;span class=&quot;grid-meta-sep&quot;&gt;\u00b7&lt;/span&gt;&#x27;) + &#x27;&lt;/div&gt;&#x27;;
  }
  if (evt.description) html += &#x27;&lt;div class=&quot;grid-cell-meta&quot;&gt;&#x27; + esc(evt.description) + &#x27;&lt;/div&gt;&#x27;;
  html += renderFlightDetails(evt);
  if (evt.attendees) html += &#x27;&lt;div class=&quot;grid-cell-meta grid-cell-attendees&quot;&gt;WHO: &#x27; + esc(evt.attendees) + &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  html += &#x27;&lt;/div&gt;&#x27;;
  return html;
}

function getGridLaneOverlapWarnings(activeGroups, groupEvents) {
  const warnings = [];

  activeGroups.forEach(group =&gt; {
    const eventsForGroup = groupEvents
      .filter(evt =&gt; evt.groupId === group.id)
      .slice()
      .sort((a, b) =&gt; timeToMinutes(a.startTime) - timeToMinutes(b.startTime));

    for (let i = 0; i &lt; eventsForGroup.length; i++) {
      for (let j = i + 1; j &lt; eventsForGroup.length; j++) {
        const current = eventsForGroup[i];
        const next = eventsForGroup[j];
        if (timeToMinutes(next.startTime) &gt;= timeToMinutes(current.endTime)) break;
        warnings.push({
          groupName: group.name,
          titles: [current.title, next.title],
        });
      }
    }
  });

  return warnings;
}

function summarizeGridOverlapWarnings(warnings) {
  const first = warnings[0];
  const pair = first.titles.join(&#x27; and &#x27;);
  if (warnings.length === 1) {
    return pair + &#x27; overlap in &#x27; + first.groupName + &#x27;. Use Cards or Phases to review both events.&#x27;;
  }
  return pair + &#x27; overlap in &#x27; + first.groupName + &#x27;, plus &#x27; + (warnings.length - 1) + &#x27; more overlap&#x27; + (warnings.length === 2 ? &#x27;&#x27; : &#x27;s&#x27;) + &#x27;. Use Cards or Phases to review all events.&#x27;;
}

let _contextMenuTarget = null;
const HELP_SEEN_KEY = &#x27;dayschedule_help_seen&#x27;;

function showLibrary() {
  document.getElementById(&#x27;libraryView&#x27;).classList.add(&#x27;active&#x27;);
  document.querySelector(&#x27;.toolbar&#x27;).style.display = &#x27;none&#x27;;

// ── Continue card ───────────────────────────────────────────────────────────
// Non-technical users shouldn&#x27;t have to know where their .schedule file lives.
// Priority: in-memory session draft (newest state, also the only way back into
// an unsaved draft) → workbook file remembered in IndexedDB → hidden.

function formatWorkbookSavedAt(iso) {
  if (!iso) return &#x27;&#x27;;
  const then = new Date(iso);
  if (isNaN(then.getTime())) return &#x27;&#x27;;
  const days = Math.floor((Date.now() - then.getTime()) / 86400000);
  if (days &lt;= 0) return &#x27;today&#x27;;
  if (days === 1) return &#x27;yesterday&#x27;;
  if (days &lt; 30) return days + &#x27; days ago&#x27;;
  return then.toLocaleDateString();
}

function readSessionDraftState() {
  try {
    const record = typeof getRecoveryDraftRecord === &#x27;function&#x27;
      ? getRecoveryDraftRecord()
      : JSON.parse(sessionStorage.getItem(&#x27;schedule_state&#x27;) || &#x27;null&#x27;);
    const state = typeof recoveryState === &#x27;function&#x27; ? recoveryState(record) : record;
    if (state &amp;&amp; Array.isArray(state.days)) return state;
  } catch (e) { console.warn(&#x27;Could not inspect workbook recovery:&#x27;, e); }
  return null;
}

// The action behind the Continue/Reopen button. Set by renderLibraryContinueCard
// and invoked through a delegated listener wired once in wireLibrary() — a
// per-render `onclick` assignment proved fragile (render races / clobbering),
// and a swallowed click here looks like a dead button to the user.
let _libraryContinueAction = null;

async function runLibraryContinueAction() {
  if (typeof _libraryContinueAction !== &#x27;function&#x27;) return;
  const btn = document.getElementById(&#x27;libraryContinueBtn&#x27;);
  const label = btn ? btn.textContent : &#x27;&#x27;;
  if (btn) { btn.disabled = true; btn.textContent = &#x27;Opening…&#x27;; }
  try {
    await _libraryContinueAction();
  } catch (err) {
    console.error(&#x27;Continue failed:&#x27;, err);
    if (typeof logAppError === &#x27;function&#x27;) logAppError(&#x27;error&#x27;, String(err &amp;&amp; err.message || err), &#x27;continue&#x27;);
    // The action may already have hidden the start screen; the advice
    // &quot;use Open .schedule&quot; only makes sense with that screen showing.
    showLibrary();
    toast(&#x27;Couldn’t continue: &#x27; + (err &amp;&amp; err.message ? err.message : &#x27;unexpected error&#x27;) + &#x27;. Use Open .schedule instead.&#x27;, 5500);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = label; }
  }
}

async function renderLibraryContinueCard() {
  const strip = document.getElementById(&#x27;libraryContinueStrip&#x27;);
  if (!strip) return;
  strip.hidden = true;
  _libraryContinueAction = null;

  const labelEl = document.getElementById(&#x27;libraryContinueLabel&#x27;);
  const titleEl = document.getElementById(&#x27;libraryContinueTitle&#x27;);
  const metaEl = document.getElementById(&#x27;libraryContinueMeta&#x27;);
  const btn = document.getElementById(&#x27;libraryContinueBtn&#x27;);
  if (!labelEl || !titleEl || !metaEl || !btn) return;

  const sessionState = readSessionDraftState();
  const recoveringLegacy = !!(sessionState &amp;&amp; sessionState.recovery &amp;&amp; sessionState.recovery.sourceMode === &#x27;directory&#x27;);
  if (hasDirectoryAccess() &amp;&amp; !sessionState) return;
  const record = !recoveringLegacy &amp;&amp; typeof loadWorkbookFileRecord === &#x27;function&#x27; ? await loadWorkbookFileRecord() : null;

  if (sessionState) {
    const eventCount = sessionState.days.reduce((n, d) =&gt; n + ((d.events &amp;&amp; d.events.length) || 0), 0);
    const dayCount = sessionState.days.length;
    const parts = [dayCount + (dayCount === 1 ? &#x27; day&#x27; : &#x27; days&#x27;), eventCount + (eventCount === 1 ? &#x27; event&#x27; : &#x27; events&#x27;)];
    parts.push(sessionState.workbookFileName ? sessionState.workbookFileName : &#x27;not saved to a file yet&#x27;);
    labelEl.textContent = recoveringLegacy ? &#x27;Recover a local copy&#x27; : &#x27;Continue where you left off&#x27;;
    titleEl.textContent = sessionState.title || &#x27;Untitled workbook&#x27;;
    metaEl.textContent = parts.join(&#x27; · &#x27;);
    btn.textContent = &#x27;Continue&#x27;;
    _libraryContinueAction = async () =&gt; {
      // The draft must be in the Store before reattaching: the reattach
      // matches the draft&#x27;s identity against the file&#x27;s schedules.
      if (!Store.getTitle() &amp;&amp; !Store.getDays().length) sessionLoad();
      // Same workbook as the remembered file? Reattach its handle so
      // auto-save writes back to it (the click is the permission gesture).
      if (record &amp;&amp; sessionState.workbookFileName === record.name
          &amp;&amp; typeof hasScheduleWorkbookHandle === &#x27;function&#x27; &amp;&amp; !hasScheduleWorkbookHandle()
          &amp;&amp; typeof adoptScheduleWorkbookHandle === &#x27;function&#x27;) {
        const reattached = await adoptScheduleWorkbookHandle(record.handle);
        if (!reattached) {
          toast(&#x27;Couldn’t reconnect to &#x27; + record.name + &#x27; (moved, deleted, or permission declined). Your work is still here — use Save .schedule to choose where to save it.&#x27;, 7000);
        }
      }
      const days = Store.getDays();
      if (days.length &amp;&amp; !Store.getActiveDay()) Store.setActiveDay(days[0].id);
      if (!hasScheduleWorkbookHandle()) markDirty();
      if (recoveringLegacy) toast(&#x27;Recovered as a separate workbook. Save .schedule to keep this copy; the shared file is unchanged.&#x27;, 8000);
      hideLibrary();
      if (typeof syncCurrentScheduleAccess === &#x27;function&#x27;) await syncCurrentScheduleAccess();
      syncToolbarTitle();
      renderActiveDay();
      renderInspector();
    };
    strip.hidden = false;
    return;
  }

  if (record) {
    labelEl.textContent = &#x27;Welcome back&#x27;;
    titleEl.textContent = record.name || &#x27;Your workbook&#x27;;
    const savedAt = formatWorkbookSavedAt(record.savedAt);
    metaEl.textContent = savedAt ? &#x27;Last saved &#x27; + savedAt : &#x27;Pick up where you stopped&#x27;;
    btn.textContent = &#x27;Reopen&#x27;;
    _libraryContinueAction = async () =&gt; {
      const opened = typeof openScheduleWorkbookFromHandle === &#x27;function&#x27;
        ? await openScheduleWorkbookFromHandle(record.handle)
        : false;
      if (!opened) {
        renderLibraryContinueCard(); // record may have been cleared (file moved)
        return;
      }
      hideLibrary();
      if (typeof syncCurrentScheduleAccess === &#x27;function&#x27;) await syncCurrentScheduleAccess();
    };
    strip.hidden = false;
  }
}

function hideLibrary() {
  document.getElementById(&#x27;libraryView&#x27;).classList.remove(&#x27;active&#x27;);
  document.querySelector(&#x27;.toolbar&#x27;).style.display = &#x27;&#x27;;
  document.querySelector(&#x27;.app-body&#x27;).style.display = &#x27;&#x27;;
  // Imports can render while the library hides the editor. Physical paper
  // fitting needs visible dimensions, so measure again after revealing it.
  if (document.querySelector(&#x27;.band-sheet&#x27;)) renderActiveDay();
  syncHelpEntryPoints();
}

async function refreshLibraryList() {
  const listEl = document.getElementById(&#x27;libraryList&#x27;);
  const stackEl = document.querySelector(&#x27;.library-stack&#x27;);
  if (!listEl) return;

  if (!hasDirectoryAccess()) {
    if (stackEl) stackEl.style.display = &#x27;none&#x27;;
    listEl.innerHTML = &#x27;&#x27;;
    return;
  }
  if (stackEl) stackEl.style.display = &#x27;&#x27;;

  const files = await listScheduleFiles();
  if (files.length === 0) {
    listEl.innerHTML = &#x27;&lt;div class=&quot;library-empty&quot;&gt;No schedules yet.&lt;/div&gt;&#x27;;
    return;
  }

  let html = &#x27;&#x27;;
  const entries = await Promise.all(files.map(async meta =&gt; ({
    meta,
    lockStatus: await getScheduleLockStatus(meta.fileName),
  })));
  entries.forEach(entry =&gt; {
    const meta = entry.meta;
    const lockStatus = entry.lockStatus;
    const timeAgo = meta.lastSavedAt ? formatTimeAgo(meta.lastSavedAt) : &#x27;&#x27;;
    const stats = meta.dayCount + (meta.dayCount === 1 ? &#x27; day&#x27; : &#x27; days&#x27;) + &#x27; \u00b7 &#x27;
      + meta.eventCount + (meta.eventCount === 1 ? &#x27; event&#x27; : &#x27; events&#x27;);
    const metaLine = [stats, timeAgo].filter(Boolean).join(&#x27; \u00b7 &#x27;);
    const accessBadgeClass = lockStatus.state === &#x27;mine&#x27;
      ? &#x27;editing&#x27;
      : (lockStatus.state === &#x27;locked&#x27; ? &#x27;locked&#x27; : &#x27;available&#x27;);
    const accessBadgeText = lockStatus.state === &#x27;mine&#x27;
      ? &#x27;Editing&#x27;
      : (lockStatus.state === &#x27;locked&#x27; ? &#x27;Read Only&#x27; : &#x27;Available&#x27;);

    html += &#x27;&lt;div class=&quot;library-item&quot; data-file=&quot;&#x27; + esc(meta.fileName) + &#x27;&quot;&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;library-item-info&quot;&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;library-item-name&quot;&gt;&#x27; + esc(meta.name) + &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;library-item-meta&quot;&gt;&#x27; + esc(metaLine) + &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;div class=&quot;library-item-badges&quot;&gt;&#x27;;
    html += &#x27;&lt;span class=&quot;library-item-badge library-item-access &#x27; + accessBadgeClass + &#x27;&quot;&gt;&#x27; + accessBadgeText + &#x27;&lt;/span&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
    html += &#x27;&lt;/div&gt;&#x27;;
  });
  listEl.innerHTML = html;

  listEl.querySelectorAll(&#x27;.library-item&#x27;).forEach(item =&gt; {
    item.addEventListener(&#x27;click&#x27;, () =&gt; {
      openSchedule(item.getAttribute(&#x27;data-file&#x27;));
    });
    item.addEventListener(&#x27;contextmenu&#x27;, e =&gt; {
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, item.getAttribute(&#x27;data-file&#x27;));
    });
  });
}

async function openSchedule(fileName) {
  const data = await readScheduleFile(fileName);
  if (!data || !data.current) { toast(&#x27;Failed to open schedule — file may be corrupt.&#x27;); return; }

  if (!await ensureUserName()) return;

  if (typeof clearUndoHistory === &#x27;function&#x27;) clearUndoHistory();
  Store.reset();
  Store.loadPersistedState(data.current);
  setCurrentScheduleFileData(data);

  setCurrentFile(fileName, data.lastSavedAt);
  hideLibrary();
  await syncCurrentScheduleAccess();
  syncToolbarTitle();
  renderActiveDay();
  renderInspector();
}

async function createNewSchedule(name) {
  if (hasDirectoryAccess() &amp;&amp; !await ensureUserName()) return;

  const slug = scheduleNameToSlug(name);
  const fileName = slug + &#x27;.json&#x27;;
  const userName = getUserName() || &#x27;&#x27;;

  if (hasDirectoryAccess()) {
    const existing = await readScheduleFile(fileName, { suppressErrors: true });
    if (existing) {
      toast(&#x27;A schedule named &#x27; + name + &#x27; already exists.&#x27;);
      return;
    }
  }

  if (typeof clearUndoHistory === &#x27;function&#x27;) clearUndoHistory();
  if (typeof clearScheduleWorkbookTarget === &#x27;function&#x27;) clearScheduleWorkbookTarget();
  Store.reset();
  Store.setTitle(name);
  const state = Store.getPersistedState();
  const fileData = buildScheduleFile(name, state, [], userName);
  setCurrentScheduleFileData(fileData);

  if (!hasDirectoryAccess()) {
    setCurrentFile(null, null);
    hideLibrary();
    if (typeof syncCurrentScheduleAccess === &#x27;function&#x27;) {
      await syncCurrentScheduleAccess();
    }
    syncToolbarTitle();
    renderActiveDay();
    renderInspector();
    sessionSave();
    toast(&#x27;Created &#x27; + name);
    return;
  }

  const ok = await writeScheduleFile(fileName, fileData);
  if (!ok) { toast(&#x27;Failed to create schedule.&#x27;); return; }

  setCurrentFile(fileName, fileData.lastSavedAt);
  hideLibrary();
  await claimCurrentScheduleLock({ silent: true });
  syncToolbarTitle();
  renderActiveDay();
  renderInspector();
  toast(&#x27;Created &#x27; + name);
}

function getImportedScheduleBaseName(fileName, state) {
  const stateTitle = state &amp;&amp; state.title ? String(state.title).trim() : &#x27;&#x27;;
  if (stateTitle) return stateTitle;

  const baseName = String(fileName || &#x27;&#x27;)
    .replace(/\.[^.]+$/, &#x27;&#x27;)
    .replace(/[-_]+/g, &#x27; &#x27;)
    .trim();

  if (baseName &amp;&amp; baseName.toLowerCase() !== &#x27;scheduledata&#x27;) return baseName;
  return &#x27;Imported Schedule&#x27;;
}

async function getAvailableImportedScheduleName(baseName) {
  const files = await listScheduleFiles();
  const existing = new Set(files.map(file =&gt; file.fileName));

  let candidateName = baseName;
  let candidateFile = scheduleNameToSlug(candidateName) + &#x27;.json&#x27;;
  if (!existing.has(candidateFile)) return candidateName;

  candidateName = baseName + &#x27; (Imported)&#x27;;
  candidateFile = scheduleNameToSlug(candidateName) + &#x27;.json&#x27;;
  let counter = 2;
  while (existing.has(candidateFile)) {
    candidateName = baseName + &#x27; (Imported &#x27; + counter + &#x27;)&#x27;;
    candidateFile = scheduleNameToSlug(candidateName) + &#x27;.json&#x27;;
    counter++;
  }
  return candidateName;
}

async function openImportedLocalDraft(state, sourceFileName, importedName, sourceFileData) {
  if (typeof clearUndoHistory === &#x27;function&#x27;) clearUndoHistory();
  Store.reset();
  const draftState = JSON.parse(JSON.stringify(state));
  draftState.title = importedName;
  Store.loadPersistedState(draftState);

  setCurrentFile(null, null);
  const fileData = sourceFileData &amp;&amp; typeof sourceFileData === &#x27;object&#x27;
    ? JSON.parse(JSON.stringify(sourceFileData))
    : { versions: [], activity: [] };
  fileData.name = importedName;
  fileData.current = Store.getPersistedState();
  if (!Array.isArray(fileData.versions)) fileData.versions = [];
  if (!Array.isArray(fileData.activity)) fileData.activity = [];
  if (!fileData.theme) fileData.theme = (sourceFileData &amp;&amp; sourceFileData.theme) || state.theme || undefined;
  setCurrentScheduleFileData(fileData);

  hideLibrary();
  if (typeof syncCurrentScheduleAccess === &#x27;function&#x27;) {
    await syncCurrentScheduleAccess();
  }
  syncToolbarTitle();
  renderActiveDay();
  renderInspector();
  sessionSave((typeof hasScheduleWorkbookHandle === &#x27;function&#x27; &amp;&amp; hasScheduleWorkbookHandle()) ? { skipDirty: true } : undefined);
  toast(&#x27;Opened &#x27; + sourceFileName);
}

async function importScheduleIntoLibrary(state, sourceFileName, importedName, sourceFileData) {
  const uniqueName = await getAvailableImportedScheduleName(importedName);
  const userName = getUserName();
  const targetFile = scheduleNameToSlug(uniqueName) + &#x27;.json&#x27;;

  const importedState = JSON.parse(JSON.stringify(state));
  importedState.title = uniqueName;
  const fileData = buildScheduleFile(uniqueName, importedState, [], userName);
  if (sourceFileData &amp;&amp; sourceFileData.theme) fileData.theme = sourceFileData.theme;
  const ok = await writeScheduleFile(targetFile, fileData);
  if (!ok) {
    toast(&#x27;Failed to import &#x27; + sourceFileName + &#x27;.&#x27;);
    return;
  }

  if (typeof clearUndoHistory === &#x27;function&#x27;) clearUndoHistory();
  Store.reset();
  Store.loadPersistedState(fileData.current);

  setCurrentScheduleFileData(fileData);
  setCurrentFile(targetFile, fileData.lastSavedAt);
  hideLibrary();
  await claimCurrentScheduleLock({ silent: true });
  syncToolbarTitle();
  renderActiveDay();
  renderInspector();
  toast(&#x27;Imported &#x27; + sourceFileName + &#x27; as &#x27; + uniqueName);
}

async function importScheduleFromLibrary() {
  if (hasDirectoryAccess() &amp;&amp; !getUserName()) {
    if (!await ensureUserName()) return;
  }

  importDataFile({
    onImported: async ({ fileName, state, fileData }) =&gt; {
      const importedName = getImportedScheduleBaseName(fileName, state);
      if (hasDirectoryAccess()) {
        await importScheduleIntoLibrary(state, fileName, importedName, fileData);
        return;
      }
      await openImportedLocalDraft(state, fileName, importedName, fileData);
    },
  });
}

async function duplicateSchedule(fileName) {
  const data = await readScheduleFile(fileName);
  if (!data) { toast(&#x27;Failed to read schedule.&#x27;); return; }

  const baseName = (data.name || &#x27;Schedule&#x27;) + &#x27; (Copy)&#x27;;
  let newName = baseName;
  let newFileName = scheduleNameToSlug(newName) + &#x27;.json&#x27;;

  // Avoid filename collisions
  const existing = await listScheduleFiles();
  const existingNames = new Set(existing.map(f =&gt; f.fileName));
  let counter = 2;
  while (existingNames.has(newFileName)) {
    newName = baseName + &#x27; &#x27; + counter;
    newFileName = scheduleNameToSlug(newName) + &#x27;.json&#x27;;
    counter++;
  }

  const userName = getUserName();
  const newData = buildScheduleFile(newName, data.current, [], userName);
  newData.current.title = newName;

  const ok = await writeScheduleFile(newFileName, newData);
  if (!ok) { toast(&#x27;Failed to duplicate.&#x27;); return; }

  // Open the copy immediately per spec
  openSchedule(newFileName);
  toast(&#x27;Duplicated as &#x27; + newName);
}

async function deleteSchedule(fileName) {
  const lockStatus = await getScheduleLockStatus(fileName);
  if (lockStatus.state === &#x27;locked&#x27; &amp;&amp; lockStatus.lock) {
    toast((lockStatus.lock.ownerName || &#x27;Another editor&#x27;) + &#x27; is editing this schedule right now.&#x27;);
    return;
  }
  const ok = await deleteScheduleFile(fileName);
  if (ok) {
    const lockFileName = getLockFileName(fileName);
    const existingLock = await readScheduleFile(lockFileName, { suppressErrors: true });
    if (existingLock) await deleteScheduleFile(lockFileName);
  }
  if (ok) {
    refreshLibraryList();
    toast(&#x27;Deleted&#x27;);
  } else {
    toast(&#x27;Failed to delete.&#x27;);
  }
}

let _returnToLibraryPending = false;

async function returnToLibrary() {
  if (_returnToLibraryPending) return;
  _returnToLibraryPending = true;
  const generation = _workbookGeneration;
  try {
    while (_versionPersistencePromise || _workbookSavePromise || _legacySavePromise) {
      await Promise.all([_versionPersistencePromise, _workbookSavePromise, _legacySavePromise].filter(Boolean));
      if (generation !== _workbookGeneration) return;
    }
    if (isDirty() &amp;&amp; !isCurrentScheduleEditable()) {
      toast(&#x27;Your unsaved changes are still protected locally. Save a separate .schedule copy before leaving this read-only schedule.&#x27;, 8000);
      return;
    }
    // A true save result acknowledges one revision, not necessarily the latest
    // edit. Drain newer revisions before clearing either memory or recovery.
    while (isDirty()) {
      const ok = getCurrentFileName()
        ? await saveCurrentSchedule()
        : await saveScheduleWorkbookFile();
      if (!ok || generation !== _workbookGeneration) return;
    }
    _navigationSaving = true;
    syncEditorChrome();
    await releaseCurrentScheduleLock();
    if (generation !== _workbookGeneration || isDirty()) return;
    clearUndoHistory();
    await discardSessionDraft();
    setCurrentFile(null, null);
    Store.reset();
    setCurrentScheduleFileData(null);
    clearScheduleWorkbookTarget();
    showLibrary();
  } finally {
    _navigationSaving = false;
    _returnToLibraryPending = false;
    syncEditorChrome();
  }
}

// ── Context menu ───────────────────────────────────────────────────────────

function showContextMenu(x, y, fileName) {
  _contextMenuTarget = fileName;
  let menu = document.getElementById(&#x27;libraryContextMenu&#x27;);
  if (!menu) {
    menu = document.createElement(&#x27;div&#x27;);
    menu.id = &#x27;libraryContextMenu&#x27;;
    menu.className = &#x27;library-context&#x27;;
    menu.innerHTML = &#x27;&lt;button class=&quot;library-context-item&quot; id=&quot;ctxDuplicate&quot;&gt;Duplicate&lt;/button&gt;&#x27;
      + &#x27;&lt;button class=&quot;library-context-item danger&quot; id=&quot;ctxDelete&quot;&gt;Delete&lt;/button&gt;&#x27;;
    document.body.appendChild(menu);

    menu.querySelector(&#x27;#ctxDuplicate&#x27;).onclick = () =&gt; {
      const target = _contextMenuTarget;
      closeContextMenu();
      if (target) duplicateSchedule(target);
    };
    menu.querySelector(&#x27;#ctxDelete&#x27;).onclick = () =&gt; {
      const target = _contextMenuTarget;
      closeContextMenu();
      if (target &amp;&amp; confirm(&#x27;Delete this schedule? This cannot be undone.&#x27;)) {
        deleteSchedule(target);
      }
    };
  }
  menu.style.left = x + &#x27;px&#x27;;
  menu.style.top = y + &#x27;px&#x27;;
  menu.classList.add(&#x27;active&#x27;);
}

function closeContextMenu() {
  const menu = document.getElementById(&#x27;libraryContextMenu&#x27;);
  if (menu) menu.classList.remove(&#x27;active&#x27;);
  _contextMenuTarget = null;
}

document.addEventListener(&#x27;click&#x27;, e =&gt; {
  if (!e.target.closest(&#x27;.library-context&#x27;)) closeContextMenu();
});

// ── Time formatting ────────────────────────────────────────────────────────

function formatTimeAgo(isoStr) {
  const d = new Date(isoStr);
  const now = new Date();
  const diffMs = now - d;
  const diffMin = Math.floor(diffMs / 60000);
  if (diffMin &lt; 1) return &#x27;just now&#x27;;
  if (diffMin &lt; 60) return diffMin + &#x27;m ago&#x27;;
  const diffHr = Math.floor(diffMin / 60);
  if (diffHr &lt; 24) return diffHr + &#x27;h ago&#x27;;
  const diffDay = Math.floor(diffHr / 24);
  if (diffDay &lt; 7) return diffDay + &#x27;d ago&#x27;;
  return d.toLocaleDateString(undefined, { month: &#x27;short&#x27;, day: &#x27;numeric&#x27; });
}

// ── Library wiring (called from init) ──────────────────────────────────────

function wireLibrary() {
  const connectBtn = document.getElementById(&#x27;libraryConnectBtn&#x27;);
  if (connectBtn) {
    connectBtn.onclick = async () =&gt; {
      const handle = await promptForDirectory();
      if (handle) {
        document.getElementById(&#x27;libraryConnectPrompt&#x27;).style.display = &#x27;none&#x27;;
        refreshLibraryList();
      }
    };
  }

  const newBtn = document.getElementById(&#x27;libraryNewBtn&#x27;);
  const importBtn = document.getElementById(&#x27;libraryImportBtn&#x27;);
  const newInline = document.getElementById(&#x27;libraryNewInline&#x27;);
  const newInput = document.getElementById(&#x27;libraryNewName&#x27;);
  const newConfirm = document.getElementById(&#x27;libraryNewConfirm&#x27;);
  const newCancel = document.getElementById(&#x27;libraryNewCancel&#x27;);

  if (newBtn &amp;&amp; newInline &amp;&amp; newInput) {
    const doCreate = () =&gt; {
      const name = (newInput.value || &#x27;&#x27;).trim() || &#x27;New Schedule&#x27;;
      createNewSchedule(name);
    };

    newBtn.onclick = doCreate;
    if (newConfirm) newConfirm.onclick = doCreate;
    newInput.addEventListener(&#x27;keydown&#x27;, e =&gt; {
      if (e.key === &#x27;Enter&#x27;) doCreate();
      if (e.key === &#x27;Escape&#x27;) {
        newInput.value = &#x27;&#x27;;
        newInput.blur();
      }
    });
    if (newCancel) newCancel.onclick = () =&gt; {
      newInput.value = &#x27;&#x27;;
      newInput.blur();
    };
  }

  if (importBtn) {
    importBtn.onclick = () =&gt; {
      if (hasDirectoryAccess()) {
        importScheduleFromLibrary();
        return;
      }
      if (typeof openScheduleWorkbookFile === &#x27;function&#x27;) {
        openScheduleWorkbookFile({
          onImported: async ({ fileName, state, fileData, workbookData }) =&gt; {
            const importedName = getImportedScheduleBaseName(fileName, state);
            await openImportedLocalDraft(state, fileName, importedName, fileData, workbookData);
          },
        });
        return;
      }
      importScheduleFromLibrary();
    };
  }

  // Help button in library header
  const libraryHelpBtn = document.getElementById(&#x27;libraryHelpBtn&#x27;);
  if (libraryHelpBtn) libraryHelpBtn.onclick = () =&gt; openHelpModal();

  // Build stamp in the Help modal — distinguishes a stale distributed copy
  // from the current build when debugging user reports.
  const helpVersionValue = document.getElementById(&#x27;helpVersionValue&#x27;);
  if (helpVersionValue &amp;&amp; typeof APP_VERSION !== &#x27;undefined&#x27;) {
    helpVersionValue.textContent = APP_VERSION;
  }

  // Continue card: delegated, wired once — the button&#x27;s content re-renders,
  // the listener never does.
  const continueStrip = document.getElementById(&#x27;libraryContinueStrip&#x27;);
  if (continueStrip) {
    continueStrip.addEventListener(&#x27;click&#x27;, (e) =&gt; {
      if (e.target.closest(&#x27;#libraryContinueBtn&#x27;)) runLibraryContinueAction();
    });
  }

  const themeToggle = document.getElementById(&#x27;editorThemeToggle&#x27;);
  if (themeToggle) {
    themeToggle.textContent = getEditorTheme() === &#x27;dark&#x27; ? &#x27;\u2600&#x27; : &#x27;\u263E&#x27;;
    themeToggle.title = &#x27;UI theme&#x27;;
    themeToggle.onclick = () =&gt; {
      const current = getEditorTheme();
      const next = current === &#x27;dark&#x27; ? &#x27;light&#x27; : &#x27;dark&#x27;;
      applyEditorTheme(next);
      themeToggle.textContent = next === &#x27;dark&#x27; ? &#x27;\u2600&#x27; : &#x27;\u263E&#x27;;
      themeToggle.title = &#x27;UI theme&#x27;;
    };
  }

  syncHelpEntryPoints();
}

// ── Help modal ─────────────────────────────────────────────────────────────

// localStorage throws (not &quot;returns null&quot;) when a hosting page or browser
// setting blocks site storage; Help must open regardless.
function hasSeenStartupHelp() {
  try { return localStorage.getItem(HELP_SEEN_KEY) === &#x27;1&#x27;; } catch (e) { return false; }
}

function markHelpSeen() {
  try { localStorage.setItem(HELP_SEEN_KEY, &#x27;1&#x27;); } catch (e) { console.warn(&#x27;Could not remember that Help was seen:&#x27;, e); }
}

function syncHelpEntryPoints() {
  const libraryHelpBtn = document.getElementById(&#x27;libraryHelpBtn&#x27;);
  if (libraryHelpBtn) {
    libraryHelpBtn.textContent = &#x27;Help&#x27;;
    libraryHelpBtn.title = &#x27;Help &amp; shortcuts&#x27;;
  }
}

function setHelpTab(tabName) {
  _helpActiveTab = tabName || &#x27;start&#x27;;
  const overlay = document.getElementById(&#x27;helpModal&#x27;);
  if (!overlay) return;
  overlay.querySelectorAll(&#x27;[data-help-tab]&#x27;).forEach(btn =&gt; {
    btn.classList.toggle(&#x27;active&#x27;, btn.getAttribute(&#x27;data-help-tab&#x27;) === _helpActiveTab);
  });
  overlay.querySelectorAll(&#x27;[data-help-panel]&#x27;).forEach(panel =&gt; {
    panel.classList.toggle(&#x27;active&#x27;, panel.getAttribute(&#x27;data-help-panel&#x27;) === _helpActiveTab);
  });
}

function wireHelpModal(overlay) {
  if (!overlay) return;
  const closeBtn = overlay.querySelector(&#x27;#helpCloseBtn&#x27;);
  if (closeBtn) closeBtn.onclick = () =&gt; closeHelpModal();

  overlay.querySelectorAll(&#x27;[data-help-tab]&#x27;).forEach(btn =&gt; {

function renderHelpErrorLog() {

document.addEventListener(&#x27;click&#x27;, e =&gt; {

document.addEventListener(&#x27;keydown&#x27;, e =&gt; {
